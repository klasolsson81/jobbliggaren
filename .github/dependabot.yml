# Dependabot — Jobbliggaren
#
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
#
# Ecosystems:
# - npm root (Husky-anchor) + npm web/jobbliggaren-web (faktisk frontend —
#   pnpm-lock.yaml autodetekteras; pnpm workspace catalogs GA 2025-02)
# - nuget root (Central Package Management — Directory.Packages.props)
# - github-actions (CI-workflows + lighthouse-ci-action supply-chain-yta)
# - docker (de tre Dockerfilerna under src/) + docker-compose (docker-compose.yml).
#   TVÅ poster därför att det är TVÅ ekosystem: `docker` läser Dockerfiles och
#   `docker-compose` läser compose-filer, så ingen täcker den andras images.
#
# SPRÅK I DEN HÄR FILEN, eftersom den blandar med flit och blandningen annars läser som
# slarv: headern är svensk och nya rader i den skrivs svenska för att listan ska gå att
# läsa som en lista. Posternas egna kommentarblock längst ned är engelska, i linje med
# filens senare tillägg (CodeCoverage- och codeql-noterna) och CLAUDE.md §1:s
# "new comments in English".
#
# Strategi: månadsvisa version-updates. Minor + patch grupperas per ecosystem för
# att minska PR-brus; MAJORS grupperas aldrig, utan kommer en PR i taget — dels så
# att var och en får sin egen granskning, dels för att en major i en grupp sätter
# `eligible=false` i dependabot-automerge.yml och därmed hoppar över scannen för
# ALLA paket i gruppen. Grupperingen är INGEN garanti mot en trasig grupp: mätt på
# #1140 var två av tre bygg-brytare semver-minor. `ci` är den grinden.
#
# Security updates körs separat och ignorerar schedule (GitHub-default) — MEN BARA FÖR
# npm, nuget och github-actions. `docker` och `docker-compose` stöder **version updates
# only**; GitHub kör inga security updates för dem (GitHub Docs, "Supported ecosystems
# and repositories", läst 2026-08-04). Meningen ovan gällde fyra entries när den skrevs
# och är falsk om två av de sex som finns i dag — se de nya entries längst ned för vad
# det betyder för CVE-vägen.
#
# `open-pull-requests-limit` per entry är dimensionerat för att majors nu tar egna
# slots. nuget står kvar på 5: #1140:s population ger 2 PR:er i den nya formen. En
# framtida framework-våg (t.ex. .NET 11) skulle kunna spränga taket tyst — det är
# inte mätt och därför inte förhandsjusterat, men det är den kända riskformen.
#
# CVE-täckning är CI-/Dependabot-formad, INTE agent-formad (security-auditor.md:292
# delegerar CVE-scan till Dependabot/CI — roster-gap-CTO 2026-05-17 §1.4, ADR 0045
# Beslut 4/5). Dependabot öppnar PRs; den blockerande severity-domen ligger i
# audit-jobbet (build.yml), observe-only Fas 1.

version: 2

updates:
  # Root package.json (Husky-anchor — lint-staged/husky-toolchain)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    # Group minor+patch only, so a MAJOR always arrives as its own PR. See the
    # note on the nuget entry below for why.
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # Frontend — web/jobbliggaren-web (Next.js 16 + pnpm; pnpm-lock.yaml
  # autodetekteras av npm-ekosystemet). Detta är den faktiska app-
  # dependency-ytan — root-entryn ovan täcker bara Husky-anchorn.
  - package-ecosystem: "npm"
    directory: "/web/jobbliggaren-web"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
    groups:
      web-minor-patch:
        update-types: ["minor", "patch"]

  # NuGet — Central Package Management (Directory.Packages.props i repo-root)
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "nuget"
    # Refit major (>= 12) is deliberately gated: Refit 12 changes the error model
    # (IApiResponse<T> stops shadowing base members) and pulls in the ReactiveUI.Primitives
    # R3-bridge source generator, which emits PrimitivesR3BridgeGeneratedAttribute in every
    # transitive referent -> CS0436 duplicate-attribute conflict in referencing test projects.
    # It requires its own dedicated migration (see the Refit pin comment in
    # Directory.Packages.props and the tracking issue), not a grouped Dependabot bump.
    # Lift this ignore when the Refit 12 migration issue is executed.
    ignore:
      - dependency-name: "Refit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Refit.HttpClientFactory"
        update-types: ["version-update:semver-major"]
      # CodeCoverage 18.9.0 is refused BY VERSION, not by update-type, and the
      # distinction is the point: 18.8.0 -> 18.9.0 is a semver-MINOR, so an
      # update-type ignore would also hide 18.10.0 and every later fix. Pinning the
      # one bad version keeps a future release visible.
      #
      # What it does: 18.9.0 stops emitting a cobertura file where build.yml's
      # `tests/**/coverage.cobertura.xml` glob looks. Measured in CI on #1157
      # (2026-08-02): `dotnet build` clean, `dotnet test` 22 160 passed — and
      # `scripts/coverage.sh` red. The failure then surfaces two steps downstream as
      # `jq: Could not open file artifacts/coverage/Summary.json`, which NAMES THE
      # WRONG THING, so a reader of the gate failure never reaches the cause.
      #
      # This is noise control, not a safety net: `coverage` is in `ci.needs`
      # (build.yml:687), so a bad collector fails the required aggregate and cannot
      # auto-merge. The ignore exists because #1174 and #1179 both re-proposed it
      # after the pin, and each costs a CI run and a review to reject again.
      #
      # LIFT WHEN: a release after 18.9.0 restores the cobertura output. Verify it
      # with `scripts/coverage.sh`, NEVER with the test suite alone — the suite is
      # green on the broken version, which is exactly how this got in. The pin
      # comment at the PackageVersion line in Directory.Packages.props carries the
      # same requirement, for the reader who arrives from the other direction.
      - dependency-name: "Microsoft.Testing.Extensions.CodeCoverage"
        versions: ["18.9.0"]
    # A MAJOR MUST NOT BE ABLE TO HIDE INSIDE A GROUP.
    #
    # This entry used to group `patterns: ["*"]`, i.e. everything including majors.
    # Measured on PR #1140 (2026-08-01): eighteen packages in one PR, fifteen of
    # which built clean. The three that broke the build were NSubstitute 6.0.0
    # (104 compile errors across 45 test files once nullability annotations landed
    # on its public API), StackExchange.Redis 3.1.0 (10 CS0618) and Resend 0.8.0
    # (1 CS8604).
    #
    # WHAT THIS CHANGE FIXES, PRECISELY — and it is less than "no more broken
    # groups". Of those three breakers exactly ONE is a major; 3.0.11 -> 3.1.0 and
    # 0.5.1 -> 0.8.0 are both semver-MINOR and would still land inside this group.
    # Re-run against #1140's population, the new shape yields a 17-package group
    # (red at the time, because Redis and Resend were both still in the tree) plus one
    # major PR. Resend has since been removed entirely (ADR 0124, #1237); the #1140
    # measurement is kept in the past tense because it is a record of what happened,
    # not a claim about the current population.
    # `update-type` is a proxy for "breaking" and a leaky one: Redis's minor added
    # [Obsolete] to public constructors and Resend's 0.x minor made a property
    # nullable — both breaking only because this house treats warnings as errors.
    # `ci` is what catches those, and on #1140 it did.
    #
    # What the change does buy is the part no gate covered: (1) a major gets its
    # own PR and its own review instead of riding in behind seventeen siblings,
    # and (2) the remaining bumps get a supply-chain scan at all —
    # `dependabot-automerge.yml` sets `eligible=false` on any major and then skips
    # the rest of the job, so #1140's eighteen packages were never scanned. One
    # major both took the group hostage AND disabled the automation meant to land
    # it. This is the shape the `web` entry above has always had.
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]

  # GitHub Actions — build.yml/deploy/lighthouse-ci-action supply-chain-yta
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Stockholm"
    # Raised 3 -> 5 as part of the grouping change: majors now arrive as individual
    # PRs, so the same month's work needs more slots. Measured on #1139's own
    # population — 1 minor/patch group + 2 majors = 3 — which saturates the old
    # limit EXACTLY, and an overflow is silent (Dependabot simply opens nothing).
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    # THE codeql-action SUB-MAJOR `ignore` WAS REMOVED HERE (2026-08-08, #1239,
    # Klas-beslut). It is not obsolete — it inverted, and the reason is worth the
    # paragraph because deleting an enforcement half normally IS the defect.
    #
    # What it enforced: #1139 rejected narrowing `@v4` to `@v4.37.3` and kept the
    # MOVING major tag, so the weekly scan would keep picking up new CodeQL queries.
    # The `ignore` stopped Dependabot re-proposing that narrowing behind an
    # auto-merge with no agent on it.
    #
    # What changed: #1239 SHA-pins every action, `codeql-action` included. That
    # inverts the polarity of this rule completely. `@<sha>` does not move, so the
    # ONLY way the analysis engine can advance is now a Dependabot PR — and this
    # rule was refusing exactly those. Kept as it stood, the engine would freeze on
    # whatever bundle the pinned SHA carries (measured 2026-08-08: v4 shipped
    # v4.37.4, .5 and .6 inside one week), and it would freeze SILENTLY, with the
    # weekly scan still green.
    #
    # This is not a reversal of #1139. That decision's own words at
    # `codeql.yml`'s init site call a narrow VERSION tag "strictly worse than a SHA
    # pin — a version tag is mutable, so the narrowing buys no tamper resistance
    # while paying the full staleness cost." A SHA pin pays the same staleness cost
    # and does buy the tamper resistance; removing this rule is what stops it being
    # paid twice.
    #
    # THE HOLE THIS USED TO CLOSE IS CLOSED ELSEWHERE NOW, not reopened: a
    # codeql-action bump is patch/minor, so it would reach `eligible=true` and
    # auto-merge with NO agent invoked. `dependabot-automerge.yml`'s gate therefore
    # excludes `github/codeql-action` by dependency name. That exclusion is this
    # rule's replacement and the two must be read together — moving the analysis
    # engine stays a decision with a reader.
    # Same grouping rule as nuget above. Measured on PR #1139 (2026-08-01): three
    # actions in one group, two of them clean ESM-migration majors and the third the
    # codeql narrowing the `ignore` above now refuses. Reviewing that third one
    # required unpicking it from the other two by hand — and note that the group is
    # what CAUGHT it, purely by accident: two unrelated majors forced
    # `eligible=false`. That accident is exactly what the `ignore` replaces with a
    # rule, because after this change a lone narrowing would be minor/patch and land
    # here, auto-mergeable.
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  # Docker base images — the three Dockerfiles under src/ (Api, Migrate, Worker), all
  # three on mcr.microsoft.com/dotnet/{sdk,aspnet}:10.0-noble.
  #
  # WHAT THIS IS AND IS NOT: a monthly VERSION cadence. It is **not** a CVE cadence, and
  # #1197's title promising one is wider than what any config can deliver here — GitHub
  # runs **no security updates** for `docker` or `docker-compose` (Docs, read 2026-08-04).
  # Nor does the automerge path compensate: `dependabot-automerge.yml`'s blocking scan is
  # `dotnet list package --vulnerable` plus `pnpm audit`, and **neither reads a container
  # image**, so a docker PR passes that gate vacuously. A monthly bump to a patched base
  # image is still worth far more than nothing — but nobody should read this entry as
  # "images are CVE-scanned". Closing that half needs an image scanner in the blocking
  # gate, carried as an AC on #196 before GHCR publishing goes live.
  #
  # `unattended-upgrades` on the box does NOT cover these either: it patches the host,
  # never the contents of a container (docs/runbooks/vps-base-hardening.md §7). Nothing
  # builds or publishes these images yet, so the gap is latent — it goes live with the
  # deploy-workflow AC on #196 (reconcile-pull against the GHCR digest; cited by its text,
  # not by an ordinal, because that AC list grows). Landed AHEAD of that PR deliberately:
  # this config can be early, it must never be late.
  #
  # DIRECTORIES ARE LISTED EXPLICITLY AND THE GLOB FORM IS REFUSED. `directories`
  # supports globbing where `directory` does not (GitHub Docs, read 2026-08-04), so
  # `/src/*` is the tempting one-liner. It is refused because dependabot-core#12348
  # ("Support for wild card (*) and globbing is no longer working with directories key")
  # has been OPEN since 2025-05-30 with no maintainer response, and the only workaround is
  # this entry's own form — explicit paths. Its symptom is that the glob matches ZERO
  # manifests — silently. That is the exact
  # fail-open shape of the defect this entry exists to close: a config that looks like
  # it has a CVE cadence while having none. Same reasoning as the codeql-action `ignore`
  # above, where a wrong value also fails open and silently.
  #
  # THE PRICE OF THE EXPLICIT FORM, NAMED: a new Dockerfile is silently uncovered unless
  # it is listed here, which is why #196 carries that obligation as an acceptance
  # criterion — a comment in this file has no reader at the moment the Dockerfile is
  # written. `/web/jobbliggaren-web` is the first discharge of it (the Next container);
  # Caddy's follows with the stack PR.
  - package-ecosystem: "docker"
    directories:
      - "/src/Jobbliggaren.Api"
      - "/src/Jobbliggaren.Migrate"
      - "/src/Jobbliggaren.Worker"
      - "/web/jobbliggaren-web"
      # /deploy/caddy IS LISTED AND IS PARTLY UNCOVERED, and the gap is worth naming here
      # rather than discovering it from a green PR. The `docker` ecosystem reads `FROM`
      # lines. After 2026-08-05 that file compiles caddy itself and copies the binary in,
      # so `FROM caddy:2-alpine` decides the base layer and NOT the caddy version — a
      # Dependabot base-image bump can go green while the edge binary has not moved. The
      # pins that do decide it sit in a RUN argument no ecosystem reads, and there is no
      # go.mod for `gomod` to read.
      # Trivy in the blocking `images` job is a partial detector: it catches advisories,
      # never an upstream hardening that carries no CVE. Same reason `seq:latest` is
      # written out below — so nobody reads an entry as coverage it does not give.
      #
      # AND THE SAME MECHANISM `seq:latest` NAMES APPLIES TO BOTH ITS `FROM` TAGS: they are
      # floating (`caddy:2-alpine`, `caddy:2-builder-alpine`) and not digest-pinned, so
      # there is no version to compare and Dependabot has nothing to propose here at all
      # until caddy 3 — not even for the base layer.
      - "/deploy/caddy"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Stockholm"
    # The reason is the multi-directory shape, not caution. The three src/ directories
    # carry the SAME two images, so without `group-by` below Dependabot opens one grouped
    # PR PER DIRECTORY, and an ungrouped .NET 11 major would be 2 images x 3 directories =
    # up to 6 PRs. Overflow is SILENT (Dependabot simply opens nothing), which is the same
    # failure shape the header already names for nuget. Raised twice as directories arrived:
    # node (`/web/jobbliggaren-web`) and caddy (`/deploy/caddy`) are each a fourth and fifth
    # image on their own major track, one slot apiece on top of that .NET worst case.
    open-pull-requests-limit: 8
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      # NOTE: `docker` does not exist as a repo label (measured 2026-08-04 via
      # `gh label list`), and GitHub silently ignores labels that are not defined. This is
      # PRE-EXISTING practice, not new here — `npm`, `frontend` and `github-actions` above
      # are all equally undefined. The PRs stay findable via `dependencies`.
      - "docker"
    # Same grouping rule as every entry above: minor+patch grouped, a MAJOR always
    # arrives as its own PR. A .NET major (11.0) is a framework migration and must not
    # ride in behind a patch.
    #
    # `group-by: dependency-name` collapses the per-directory duplication: "a single pull
    # request for each dependency update across all specified directories, rather than
    # separate pull requests per directory" (GitHub Docs, read 2026-08-04). It is the only
    # accepted value for that key.
    #
    # UNVERIFIED, AND SAID SO RATHER THAN ASSUMED: the docs do not state whether `group-by`
    # composes with `update-types` in the same group. Both are sibling keys under `groups`,
    # which is why it is written this way — but the limit above is set to survive the case
    # where it does not.
    #
    # NOBODY IS WATCHING FOR THAT, AND IT IS ACCEPTABLE HERE — said plainly rather than
    # dressed up as a control. The failure branch is benign: three identical PRs instead of
    # one, absorbed by the limit above. They are NOT auto-mergeable — no docker ecosystem is
    # allow-listed in dependabot-automerge.yml — so the cost of the bad branch is three
    # manual merges rather than one, which is annoyance, not risk. Whoever next opens this
    # file can read the answer off the PR list. And removing the key does not avoid the question — without
    # it, three PRs is the GUARANTEED outcome rather than the bad branch. Contrast the
    # docker-compose entry below, whose failure branch is silent and therefore needed an
    # owner rather than a note.
    groups:
      docker-minor-patch:
        update-types: ["minor", "patch"]
        group-by: dependency-name

  # Docker Compose images — postgres:18.3, redis:8.6-alpine, datalust/seq:latest.
  #
  # A `docker` entry does NOT reach these. `docker` and `docker-compose` are SEPARATE
  # ecosystems (GitHub Docs, read 2026-08-04; docker-compose reached GA 2025-02-25):
  # the first reads Dockerfiles, the second reads compose files, and neither covers the
  # other's images. #1197's premise enumerates postgres and redis while its acceptance
  # criterion names only `docker` — so a Dockerfile-only entry would have closed the
  # issue while leaving the DATABASE image, the one holding all the data, on no cadence
  # at all.
  #
  # `datalust/seq:latest` IS NOT BUMPED, and the mechanism matters because the wrong one
  # forecloses the fix: a floating tag carries no version to compare, AND it is not
  # digest-pinned. Digest-pinning (`datalust/seq:latest@sha256:...`) WOULD give a cadence
  # — Dependabot does update digests. That path is deliberately declined: dev wants
  # latest, and the production compose file is specified independently by #196's
  # Compose-all-in-one AC. Written down so nobody infers coverage from this entry.
  #
  # `ci` IS NOT THE GATE FOR THIS FILE — nor for the `docker` entry above, and an earlier
  # draft's "unlike every other entry" was false for exactly that reason. Measured
  # 2026-08-04: **no workflow invokes the compose CLI** — regenerate with
  # `grep -rnE 'docker[[:space:]]+compose|docker-compose[[:space:]]' .github/workflows/ .github/scripts/ scripts/`
  # and discard comment lines. (`scripts/` is in scope because build.yml invokes
  # `bash scripts/coverage.sh` — a regenerator that does not cross the surface it certifies
  # is a guard that cannot see its own under-reach.) So a bump lands green with nothing having read it.
  #
  # THIS SENTENCE HAS BEEN WRONG THREE TIMES, so it now carries the command instead of a
  # count: first a line citation that undercounted, then a claim about WHERE the
  # occurrences live — which the very next commit falsified by adding comment lines to
  # dependabot-automerge.yml. Only the invocation claim survived every recount. State the
  # property and hand over the regenerator; never publish the tally.
  #
  # NOTHING FROM THIS ENTRY AUTO-MERGES — `dependabot-automerge.yml`'s gate leaves every
  # docker ecosystem off its allow-list. The general reason covers every image bump:
  # nothing reads the image that changes. On top of that, a postgres patch/minor fails
  # SILENTLY: the base image carries ICU, `public.swedish` is an ICU collation, and a
  # drifting ICU version leaves btree text indexes sorted by an order that no longer
  # holds — Postgres does not crash, the queries just go quietly wrong.
  #
  # That mechanism has THREE homes serving three audiences — **ADR 0110** (the decision,
  # and it is GITIGNORED so `git grep` cannot see it), `release-checklist.md` §2 for
  # whoever tags (which also carries the repair procedure), and `docker-compose.yml`'s
  # `postgres-dev` block for whoever bumps it. Do not add a fourth — regenerate with
  #
  #   grep -rl pg_collation_actual_version . --exclude-dir=.git --exclude-dir=.github
  #
  # which should return exactly the three homes named above — and TWO in a tree that does
  # not have the gitignored ADR, which is every fresh clone and every worktree where
  # `sync-worktree-docs.ps1` has not run. **No tally is published here on purpose:** a
  # draft said "three FILES", which is environment-dependent in exactly the way the
  # `git grep` number was, one clause to its right. The homes are enumerated by name
  # instead; that is the invariant.
  #
  # Three of the command's clauses answer a way this count was already reported wrong:
  # `-l` not `-n`, because the token occurs twice in one file (release-checklist.md) and a
  # draft published the line count as a file count; `--exclude-dir=.github`, because THIS
  # comment and its Swedish twin contain the token and a draft's regenerator counted
  # itself; and a filesystem grep rather than `git grep`, which **cannot see the
  # gitignored ADR at all**. The fourth clause, `--exclude-dir=.git`, answers no published
  # error and is INERT in a worktree, where `.git` is a file rather than a directory — it
  # is kept for a main checkout, and named rather than swept into "every clause".
  # That last clause carries no number ON PURPOSE — a draft said `git grep` returns two,
  # which was true only before these comments existed, and is the same self-reference the
  # exclusion above fixes. State the property; the numbers move.
  #
  # Hand over the invocation, never the instruction — the instruction has now been
  # mis-executed twice, once by its own author. An earlier draft of
  # this comment left auto-merge in place and instructed the reader instead — an
  # instruction to whoever merges the bump, sitting in the one file that bump does not
  # touch. This file's own rule, forty lines up, is that such a comment has no reader at
  # that moment; it applies to this file too.
  #
  # NO postgres-major `ignore`, and the reason is written down so it is not re-proposed:
  # dependabot-automerge.yml already sets `eligible=false` on any major, so a postgres
  # major CANNOT auto-merge today. Such an ignore would duplicate a live control, and
  # unlike every ignore in this file it would carry no LIFT WHEN condition beyond "when
  # we feel like upgrading" — a permanent suppression in a gate's clothing. (The
  # CodeCoverage pin above records what re-proposing a rejected rule costs: a CI run and
  # a review, twice.)
  #
  # TWO FURTHER IMAGE CLASSES ARE COVERED BY NEITHER ENTRY, named here for the same reason
  # `seq:latest` is: so nobody reads two entries as full coverage. `docker` reads
  # Dockerfiles, `docker-compose` reads compose files, `github-actions` bumps `uses:`
  # references — and neither of the following is any of those three.
  #
  #   3. GitHub Actions **service containers**: `e2e.yml` runs `postgres:18` and
  #      `redis:8-alpine` as `services:`.
  #   4. **Testcontainers image literals in the test tree**, with no central constant —
  #      `nuget` bumps the Testcontainers PACKAGE and never the string. NO TALLY IS
  #      PUBLISHED HERE: a draft said "31 files, 39 occurrences" and neither number
  #      reproduced (the two reviewers who checked it got different answers again).
  #      Regenerate instead:
  #        git grep -l -E 'postgres:18|redis:8-alpine' -- tests/ | wc -l
  #        git grep -oh -E 'postgres:18|redis:8-alpine' -- tests/ | sort | uniq -c
  #      The property that does not move: no shared constant exists, so every occurrence
  #        git grep -E 'const string.*(postgres:18|redis:8-alpine)' -- tests/
  #      is empty, and each literal must be edited on its own.
  #
  # Both pin a floating major (`postgres:18`) while this file pins `postgres:18.3`, and
  # nothing reconciles them. The repair for class 4 — a shared constant, or pinned tags
  # in every file the regenerators above list — is a follow-up PR: it touches the test
  # tree, not this PR's CI and
  # infra scope. Naming it here is what keeps the enumeration honest; it is not the fix.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "docker"
    groups:
      compose-minor-patch:
        update-types: ["minor", "patch"]
