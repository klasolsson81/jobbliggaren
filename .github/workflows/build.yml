# Build + test pipeline (STEG 14a, BUILD.md §15.3).
#
# Kör på push till main + alla PRs. Inga AWS-anrop, inga deploys — ren CI-
# validering. Deploy hanteras separat via deploy-dev.yml (tag-trigger).
#
# Backend + frontend körs som parallella jobs för snabb fail-fast.
name: build

on:
  push:
    branches: [main]
  # NO base-branch filter on `pull_request` (#861). A `branches: [main]` filter here
  # matches NO trigger for a stacked PR (one whose base is another feature branch —
  # the normal shape when one issue is a precondition for the next), so such a PR got
  # ZERO checks. That is the dangerous part: "no checks reported" is visually
  # indistinguishable from "green checks", which silently disarms the house
  # merge-on-green-`ci` rule (ADR 0065) and the PR-babysitter acting on it (#836) —
  # there is no `ci` aggregate at all for the guard to evaluate. Fail loud over fail
  # silent: every PR builds regardless of base. It also removes a second trap — with a
  # base filter, retargeting an open PR's base fires `pull_request: edited`, which is
  # NOT in the default activity types, so fixing the base did not start CI either.
  # Cost: a stacked PR redundantly re-runs its parent's commits (they are in the branch
  # anyway); `concurrency: cancel-in-progress` below caps the waste.
  pull_request:
  workflow_dispatch:

# Ren read-only — inga federation-tokens behövs i build-workflowen.
permissions:
  contents: read

# Avbryt äldre runs vid ny push på samma ref (sparar minutes på dependabot-PRs).
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # timeout-minutes is a hang guard, not a performance budget. 15 stopped being a
  # hang guard once the suite grew into it.
  #
  # THE MECHANISM, which is what this comment is for: `backend` and `coverage` run
  # the SAME suite - same solution, same `-c Release`, same ASPNETCORE_ENVIRONMENT,
  # no filters in either - and both sit in ci.needs. `coverage` runs it WITH
  # instrumentation under 25 minutes; `backend` ran it without under 15. The tighter
  # ceiling therefore decided whether anything merged, and it sat on the job doing
  # strictly less work.
  #
  # The exhibit that needs no arithmetic: on run 30732576203 the `Test` step reported
  # SUCCESS at 12m49s and the job was killed one second into `Post Cache NuGet`.
  # Every test passed and `ci` went red anyway, naming no cause. That is a hang guard
  # firing on work that had already finished.
  #
  # Durations are deliberately NOT restated here. Three review rounds established
  # that every figure written into this comment slid between measurement and merge:
  # the run population is a moving window, `main` is frozen by the GITHUB_TOKEN
  # suppression while `pull_request` is live, and each restatement drifted from the
  # others. ADR 0044's 2026-08-02 amendment holds the dated measurements and is their
  # one home. Measure again rather than trust a numeral copied to a second place.
  #
  # WHAT 25 DOES NOT DO. It does not make the suite faster, and it removes the
  # de-facto proximity alarm on suite growth. The written owner of that question is
  # ADR 0065's re-evaluation trigger #2 (median PR wait > 15 min -> parallelisation
  # or subset-gate) - NOT ADR 0045, which carries no CI-duration budget at all.
  # Measured against `pull_request` runs - the population that trigger's own words
  # name, and which no prior reading in this repo had used - THE TRIGGER IS FIRED.
  # Escalated to Klas; ADR 0065's own text requires a superseding ADR.
  #
  # Parity with `coverage` is also thinner than it looks: over 114 live `build` runs
  # `coverage` has itself reached 21m27s = 86 % of the same 25. This buys headroom
  # for one job while the other is already approaching the wall. #1145.
  backend:
    name: backend (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # global.json låser till 10.0.200 (rollForward latestFeature). setup-dotnet
      # respekterar global.json om version inte angivs explicit.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Jobbliggaren.sln

      - name: Build
        run: dotnet build Jobbliggaren.sln --no-restore -c Release

      # Microsoft.Testing.Platform-runner aktiveras via global.json.
      #
      # .NET 10 SDK 10.0.201 kräver `--solution`-flag specifikt för `dotnet
      # test` när sln-fil inputas (inte för restore/build — där är positional
      # OK). Default test-output går till stdout — räcker för CI-feedback.
      # När test-failures behöver djupare analys: lägg till MTPlatform-native
      # `-- --report-trx`-flagga, men håll det enkelt för Fas 0.
      #
      # ASPNETCORE_ENVIRONMENT=Development tvingar test-host till dev-env oavsett
      # runner-default. Production-env tripper ForwardedHeadersConfig.EnsureSafe-
      # ForEnvironment (Sec-Major-1, STEG 12) eftersom test-fixturer inte har
      # proxy-CIDR:er. Production-startup-pipeline verifieras i isolation av
      # ProductionStartupSmokeTests som override:ar till "Production" + populerad
      # KnownNetworks via Environment.SetEnvironmentVariable inom sin egen factory.
      # Försök att sätta env-var inom ApiFactory.InitializeAsync hade ingen effekt
      # på Linux-runner (.NET 10 / WebApplicationFactory-quirk) — runner-level
      # env-var är ground truth.
      - name: Test
        env:
          ASPNETCORE_ENVIRONMENT: Development
        run: dotnet test --solution Jobbliggaren.sln --no-build -c Release

  # Coverage-mätning + blockerande regressions-gate (ADR 0044, Accepted
  # 2026-05-17). Per-lager icke-regression-ratchet — golv = floor(uppmätt
  # baseline − 2.0pp), pinnade av senior-cto-advisor mot baseline @ HEAD
  # 98b6f17. Runs in parallel with `backend` — deliberately a SEPARATE job, because
  # folding coverage into it would serialise ~14m + ~15m into ~30m of wall-clock —
  # and is likewise in ci.needs.
  # (This clause used to justify the split as "det snabba backend-jobbet rörs inte
  # (fast fail-feedback bevaras)". That premise expired. Measured 2026-08-02 by
  # PAIRING the two jobs on the same ten main runs — not by setting one job's RANGE
  # against the other's MEDIAN, which is how an earlier draft of this sentence got
  # it wrong: those are two populations, and the universal claim it produced
  # ("under two minutes") is false on one of the ten. Both jobs now carry the same
  # 25-minute guard. ADR 0044's Mekanism clause — the ORIGIN of that sentence, not
  # this copy — is amended accordingly and HOLDS the paired figures; do not restate
  # them here. #1145.)
  coverage:
    name: coverage (.NET 10)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Coverage (test + ReportGenerator, first-party-filtrerad)
        run: bash scripts/coverage.sh

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: artifacts/coverage
          retention-days: 14

      # GATE-MEKANISM (ADR 0044 Accepted — enforce:ad, blockerande via
      # ci.needs). Per-lager-golv = floor(uppmätt baseline − 2.0pp),
      # pinnade av senior-cto-advisor 2026-05-17 mot baseline @ HEAD
      # 98b6f17 (Domain 95.3/93.3, Application 97.7/91.1, Infrastructure
      # 84.0, Api 93.7). Ratchet: höjs manuellt vid Klas-GO när coverage
      # stabilt ligger högre — non-regression, ej target (Fowler/Goodhart,
      # ADR 0044 Beslut 4). Branch-gate endast Domain+Application (de
      # invariant-bärande lagren, CLAUDE.md §2.4). Worker observe-only
      # Fas 1; Migrate exkluderad (assembly-filtrerad). Ingen global- eller
      # method-gate (redundant/Goodhart-yta — CTO-beslut). jq finns
      # förinstallerat på ubuntu-runners (ingen ny supply-chain-yta).
      - name: Coverage gate (ADR 0044 — per-lager icke-regression-ratchet)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary=artifacts/coverage/Summary.json
          fail=0

          check() {
            local asm=$1 metric=$2 floor=$3 val
            val=$(jq -r --arg a "$asm" --arg m "$metric" \
              '.coverage.assemblies[] | select(.name==$a) | .[$m]' "$summary")
            if [[ -z "$val" || "$val" == "null" ]]; then
              echo "::error::Coverage-gate: assembly '$asm' saknas i Summary.json (metric=$metric) — fail-loud"
              fail=1
              return
            fi
            if awk "BEGIN{exit !($val < $floor)}"; then
              echo "::error::Coverage-regression: $asm $metric=$val% < golv $floor%"
              fail=1
            else
              echo "OK   $asm $metric=$val% (golv $floor%)"
            fi
          }

          # Line-golv: Domain/Application/Infrastructure/Api.
          check Jobbliggaren.Domain         coverage        93
          check Jobbliggaren.Application    coverage        95
          check Jobbliggaren.Infrastructure coverage        82
          check Jobbliggaren.Api            coverage        91
          # Branch-golv: endast Domain + Application (invariant-bärande).
          check Jobbliggaren.Domain         branchcoverage  91
          check Jobbliggaren.Application    branchcoverage  89

          # Worker: observe-only Fas 1 (ADR 0044 Beslut 4/5) — log, gejta ej.
          worker=$(jq -r '.coverage.assemblies[] | select(.name=="Jobbliggaren.Worker") | .coverage' "$summary")
          echo "INFO Jobbliggaren.Worker coverage=${worker}% (observe-only Fas 1 — ingen gate)"

          # Global first-party för trend/audit (ej gejtad — per-lager räcker, ADR Avvisat 5).
          line=$(jq -r '.summary.linecoverage' "$summary")
          branch=$(jq -r '.summary.branchcoverage' "$summary")
          method=$(jq -r '.summary.methodcoverage' "$summary")
          echo "INFO first-party totalt: line=${line}% branch=${branch}% method=${method}% (trend/audit)"

          if [[ $fail -ne 0 ]]; then
            echo "Coverage-gate FAILED — se ::error:: ovan (ADR 0044 per-lager-golv)."
            exit 1
          fi
          echo "Coverage-gate PASSED — alla per-lager-golv hållna."

  frontend:
    name: frontend (Next.js 16)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/jobbliggaren-web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # pnpm-version pinnad — pnpm-lock.yaml är lockfileVersion 9.0 (pnpm 9.x).
      # När ./web/jobbliggaren-web/package.json får `"packageManager": "pnpm@..."`-
      # fält kan version-pinnen härifrån tas bort (action läser då därifrån).
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9
          run_install: false

      # Next.js 16 kräver Node >=20.18. Använd 22 LTS för långt support-fönster.
      # När .nvmrc införs i web/jobbliggaren-web: byt till `node-version-file`.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/jobbliggaren-web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # #549 WS5: typography/color literal guard on globals.css - zero
      # hardcoded font-size/color outside token definitions + guard-allow.
      - name: CSS guard
        run: pnpm run guard:css

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      # #1053: the production build is a BLOCKING check. Until now `pnpm build`
      # ran only in `lighthouse` and `playwright e2e`, both `continue-on-error`,
      # so a broken production build reported success, `ci` went green, and an
      # `automerge` label landed it. Same defect class as #877 / #861 / #1048:
      # an absent signal reads as success.
      #
      # It lives HERE, not in its own job, on purpose:
      #   - `backend` already runs restore -> build -> test in ONE job. This job
      #     is its analogue and was the only one missing the build; that
      #     asymmetry IS the defect #1053 reported.
      #   - a separate job would make a FIFTH copy of the pnpm/Node setup block
      #     (frontend / lighthouse / audit / e2e already carry it), and drift
      #     between those copies is silent.
      #   - it costs nothing observable. Measured 2026-07-26 across six runs:
      #     `coverage` is the critical path at ~913 s, this job ~275 s, and
      #     `pnpm build` ~31 s cold (24-38 s, 7 observations). 275 -> 306 s
      #     against 913 s leaves `ci` wall-clock unchanged.
      # Placed BEFORE Vitest (~207 s) so a broken build reports red at ~75 s
      # instead of ~285 s — mirroring `backend`'s build-before-test order.
      #
      # NOTE: this does NOT close the `next dev` class (#1059). Both jobs that
      # build, build for PRODUCTION, and `pnpm build` was measurably green WITH
      # that bug. That invariant is enforced by the `"use server"` export-shape
      # rule in eslint.config.mjs, which rides the `Lint` step above.
      - name: Build (production)
        run: pnpm build

      - name: Test (Vitest)
        run: pnpm test

  # Fixture-tester för de bash-skript som CI, merge-/hygien-kontrollerna och **deployen på
  # lådan** själva kör. **Räkna dem med `ls .github/scripts/*.test.sh deploy/systemd/*.test.sh`
  # i stället för att lita på en siffra här** — den här raden sa "tre" medan jobbet körde fyra,
  # blev fem i #1198, och sa `.github/scripts/` medan sviterna låg i två kataloger (#196:
  # attestationsgrinden bor under `deploy/`, därför att lådan klonar `deploy/` och en
  # runtime-grind inte kan bo där runtime inte ser den — det instrument raden själv föreskrev
  # missade den alltså helt). De ursprungliga tre:
  # `is-pure-base-merge.sh`,
  # predikatet som avgör om en push får låta en PR:s granskningsgrind stå kvar
  # armerad (#836); `select-deletable-branches.sh`, predikatet som avgör vilka
  # fjärr-grenar `delete-merged-branches.yml` får RADERA (#725); och
  # `assert-not-truncated.sh`, grinden som vägrar besluta på en API-lista som kan
  # ha kapats vid sitt sidtak (#725 — en kapad ÖPPEN-PR-lista är fail-OPEN och
  # löser upp båda stackade-PR-grindarna). Jobbet är
  # BLOCKERANDE (ligger i ci.needs) och det är hela poängen — otestad logik
  # inuti en merge-kontroll är ett påstående som inte kan falla, vilket är precis
  # den defektklass kontrollen finns för att stänga. Samma sak gäller ett
  # destruktivt svep: skillnaden är bara att dess felutfall är oåterkalleligt.
  #
  # Inget toolchain-steg — men verktygslistan är INTE längre bara bash/git/jq.
  # `compose-loopback-guard.sh` läser sedan den här ändringen compose EGEN
  # upplösta modell (`docker compose config`), så jobbet kräver **compose-CLI:t**.
  # Det kräver INGEN daemon: `config` är klientsidig, och varje mätning bakom
  # vakten togs med Docker nere. Alla fyra finns förinstallerade på
  # ubuntu-runnern — mätt 2026-08-05 ur `actions/runner-images`: `ubuntu-latest`
  # (24.04) bär **Docker Compose 2.38.2**. **26.04-imagen, redan i public preview,
  # bär 5.1.3 — ett majorhopp**, och `-latest`-migreringar byter OS under ett
  # workflow utan att någon fil ändras här. Vakten grindar därför inte på
  # majorversion; fixtursviten är det som avgör ett beteendebyte, genom att korsa
  # varje normalisering vakten lutar sig mot. Mätt 2026-07-27 på ubuntu-runner: **9 s när jobbet körde
  # ENBART `is-pure-base-merge`-fixturerna**; siffran är alltså ett golv, inte
  # jobbets nuvarande varaktighet. Storleksordningen är det som bär: mot
  # `coverage` på ~913 s (kritisk väg) är ci:s väggklocka oförändrad oavsett
  # vilken av de två siffrorna som gäller.
  scripts:
    name: scripts (bash fixtures)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # DEN ENDA EGENSKAP HOS ETT DEPLOY-SKRIPT SOM VARKEN CI ELLER DESS EGEN FIXTURSVIT KAN SE.
      # systemd kör `ExecStart=` på filen direkt och svarar 203/EXEC om exec-biten saknas — men
      # varje fixtursvit anropar sitt skript som `bash <path>`, vilket är mode-blint, och
      # `core.filemode=false` på Windows gör att en utvecklare inte heller ser det lokalt.
      # Mätt 2026-08-09 (#197): båda de nya skripten committades 100644 medan varje syskon i
      # samma katalog är 100755, så hela backup-mekanismen hade varit inert från
      # installationsögonblicket och inget grönt jobb hade sagt emot.
      #
      # Indexet är mätobjektet, inte arbetsträdet: `File.GetUnixFileMode` och `test -x` mäter
      # utcheckningen, som på Windows ljuger. Därför bash här och inte en C#-pin.
      - name: deploy/systemd/*.sh är exekverbara i indexet
        run: |
          # A GLOB THAT MATCHES NOTHING PASSES VACUOUSLY, so the count is checked first: a
          # renamed directory would otherwise turn this gate into a green no-op that reads as
          # coverage. FOURTEEN scripts, measured 2026-08-12 with `git ls-files` (was eight until
          # #1201 added the heartbeat and its fixture suite, then ten until #1175 added logship
          # and its own, then twelve until #1295 added the runtime-id helper and its own); the
          # floor is a floor and not an equality, so adding one does not fail the build for the
          # wrong reason — but it is RAISED when scripts land, or the gate silently stops
          # noticing that some went missing.
          n=$(git ls-files 'deploy/systemd/*.sh' | wc -l)
          if [ "$n" -lt 14 ]; then
            echo "::error::found only $n scripts under deploy/systemd — expected at least 14."
            echo "If one was legitimately removed, lower the floor in this step deliberately."
            exit 1
          fi
          bad=$(git ls-files -s 'deploy/systemd/*.sh' | grep -v '^100755 ' || true)
          if [ -n "$bad" ]; then
            echo "::error::icke-exekverbara skript i deploy/systemd (systemd ger 203/EXEC):"
            echo "$bad"
            echo "Åtgärd: git update-index --chmod=+x <fil>"
            exit 1
          fi
          echo "alla $(git ls-files 'deploy/systemd/*.sh' | wc -l) skript är 100755"

      # AGENTS.md-budgeten är blockerande: Codex trunkerar TYST över sitt kombinerade
      # tak, så överskridande måste falla här (ADR 0135 Decision 2).
      - name: AGENTS.md byte budget (blocking, ADR 0135)
        run: bash .github/scripts/agents-md-budget-guard.sh

      # Mängdparitet .claude/agents + .claude/skills ↔ .codex/agents: en Codex-panel
      # får inte tyst sakna en granskare eller en kanonisk spec (ADR 0135 Amendment 2).
      # Text-hemmet förblir ETT.
      - name: Codex agent set parity (blocking, ADR 0135 Am.2)
        run: bash .github/scripts/codex-agent-parity-guard.sh

      # Diagnostik, INGEN grind — `git --version` avslutar alltid 0. Predikatets
      # golv (git >= 2.38, för `merge-tree --write-tree`) grindas av fixtur 1:
      # på en äldre git returnerar den `git-too-old` i stället för
      # `pure-base-merge` och fäller jobbet. Versionen skrivs ut här så att en
      # runner-regression går att läsa direkt ur loggen i stället för att härledas
      # ur ett fixturfel.
      - name: git-version (diagnostik — golvet grindas av fixtur 1)
        run: git --version

      - name: is-pure-base-merge (fixturer)
        run: bash .github/scripts/is-pure-base-merge.test.sh

      - name: select-deletable-branches (fixturer)
        run: bash .github/scripts/select-deletable-branches.test.sh

      - name: assert-not-truncated (fixturer)
        run: bash .github/scripts/assert-not-truncated.test.sh

      - name: audit-suppression-guard (fixturer)
        run: bash .github/scripts/audit-suppression-guard.test.sh

      # Ligger under deploy/ och inte .github/scripts/ därför att lådan klonar deploy/ — en
      # runtime-grind kan inte bo där runtime inte ser den. Fixturerna stubbar cosign, så
      # sviten behöver varken daemon, registry eller nätverk.
      - name: verify-image-attestation (fixturer)
        run: bash deploy/systemd/verify-image-attestation.test.sh

      # Mäthemmet för container-runtimens uid/gid (#1295), delat av injektionen som SÄTTER
      # ägarskapet på /run/jobbliggaren/secrets och av reconcile som GRINDAR applyn på det.
      # Sviten stubbar `docker` och mäter skriptets eget kontrakt: argumentavvisning,
      # utdatavalidering, och att ingenting utom de två talen någonsin når stdout — båda
      # anroparna fångar stdout i en variabel, så en diagnostik där ser inte ut som ett trasigt
      # skript utan som ett id.
      - name: jobbliggaren-runtime-ids (fixturer)
        run: bash deploy/systemd/jobbliggaren-runtime-ids.test.sh

      # Wrapperns tre rena predikat: klassificeraren (okänd image → REFUSE), digest-regeln, och
      # sedan #1295 ägarskapsgrinden (den inkommande imagen måste kunna läsa de injicerade
      # hemligheterna, annars appliceras ingenting). Stubbar `docker` och `flock`, så varken
      # daemon, registry eller root krävs — ägarskapsfallen flyttar IMAGENS id:n via stubben i
      # stället för katalogens ägare, vilket är det som gör dem mätbara utan root. Notera att
      # sviten SJÄLV kör båda dessa steg — men bara det här jobbet grindar dem, och en svit som
      # ingen grind kör kan inte falla, vilket är den defektklass preambeln ovan namnger.
      # JBL_REQUIRE_*_CASES: ägarskapsgrindens två fall är plattformsberoende och skippas
      # högljutt lokalt — mode-fallet behöver ett filsystem som hedrar chmod, gruppfallet behöver
      # att kontot ligger i mer än en grupp (`chgrp` får bara sätta en grupp man är medlem i).
      # Gruppfallet är det enda som skiljer katalogens GRUPP från dess ÄGARE: fixturens uid är
      # dess gid, så utan det lämnar en `%g`→`%u`-swap hela sviten grön. På ubuntu ska ingetdera
      # skippas, så här blir en skip ett fel — en annonserad skip är ingen mätning.
      - name: jobbliggaren-reconcile (fixturer)
        run: bash deploy/systemd/jobbliggaren-reconcile.test.sh
        env:
          JBL_REQUIRE_MODE_CASES: "1"
          JBL_REQUIRE_GROUP_CASES: "1"

      # Frånvaro-detektorn för lådans kryptohemligheter (#198, grind B-1). `--check` är lådans
      # ENDA larm för en saknad masternyckel: en crash-loopande container syns aldrig i
      # `systemctl --failed`, så ett falskt "all present" lämnar API:t nere utan spår på den
      # enda yta någon läser (#1175, ingen loggsink). Fixturerna stat:ar bara filer — varken
      # daemon, root eller nätverk krävs — och en av dem bevisar att `--check` aldrig rör
      # docker, eftersom den kör vid boot innan dockerd är uppe.
      # JBL_REQUIRE_MODE_CASES: sviten skippar katalog-läge-fallen på filsystem som inte
      # hedrar chmod (Git Bash/Windows) och SÄGER det högljutt — men en annonserad skip är
      # inte en mätning. På ubuntu ska ingenting skippas, så här blir en skip ett fel.
      # Utan den här raden vore "de körs i CI" ett påstående framtvingat av ingenting.
      - name: jobbliggaren-inject-secrets (fixturer)
        run: bash deploy/systemd/jobbliggaren-inject-secrets.test.sh
        env:
          JBL_REQUIRE_MODE_CASES: "1"

      # Nattliga krypterade offsite-backupen (#197, grind M-4). Sviten stubbar `docker`, `age`,
      # `rclone` och `flock` på en PATH den bygger FRÅN GRUNDEN — det är enda sättet att mäta
      # "ett saknat verktyg producerar INGEN backup", eftersom en påklistrad stub-katalog låter
      # `command -v flock` hitta /usr/bin/flock under sig. rclone-stubben håller ett riktigt
      # litet objektlager på disk, så skriptets upload → läs-tillbaka → jämför-runda EXEKVERAS
      # i stället för att påstås; ett fall korrumperar objektet mellan halvorna och bevisar att
      # jämförelsen kan gå röd. Ingen daemon, ingen root, inget nätverk, ingen Postgres.
      #
      # Vad sviten INTE mäter, och det står i dess huvud: att artefakten går att DEKRYPTERA.
      # Lådan har medvetet ingen privat nyckel, så varken den eller den här sviten kan avgöra
      # det — det är restore-drillens påstående (#197 PR-2 + runbooken).
      - name: jobbliggaren-backup (fixturer)
        run: bash deploy/systemd/jobbliggaren-backup.test.sh

      # Lådans kadenserade läsare och dess dead-man (#1201, grind M-7). Sviten stubbar
      # `systemctl`, `auditctl`, `df` och `curl` — varken root, auditd eller nätverk krävs.
      #
      # Tre egenskaper här kan INTE observeras av en grön produktionskörning, vilket är hela
      # skälet att de har fixturer — och alla tre är mutationsverifierade 2026-08-10, var och en
      # mot en mutation som fäller SINA assertioner och inga andra:
      #   1. Predikatets icke-vakuitetsarmar (golv-timers, "audit-nycklarna är laddade i KÄRNAN")
      #      fyrar per definition bara på en låda där något redan är fel.
      #   2. Payload-invarianten. Fixturen matar en adress genom den enda ytan som kan bära
      #      godtycklig text — ett fallerat unit-namn — och KORSAR kontrollen två gånger om: en
      #      teckenbaserad filtrering släpper igenom `155.4.133.179` (varje tecken är tillåtet),
      #      och en formkontroll som bara gäller tokens med `@` släpper igenom den likaså. Båda
      #      mutationerna fäller exakt sina fall.
      #   3. Att stubben emitterar systemds statusglyf om `--plain` saknas. Utan den mätte hela
      #      P1- och payload-blocket en form produktionen aldrig producerar: skarpt returnerade
      #      `awk '{print $1}'` glyfen, namnet nådde aldrig saneringen, och invarianten höll av
      #      misstag. Ta bort `--plain` ur skriptet och sviten går röd.
      #
      # JBL_REQUIRE_SCRATCH_PATH: `curl-absent`-fallet bygger sin PATH från grunden och skippar
      # sig självt annonserat där skalet inte går att kopiera körbart (Git Bash/Windows). En
      # annonserad skip är inte en mätning — på ubuntu ska ingenting skippas, så här blir en skip
      # ett fel. Samma grind, och samma skäl, som `JBL_REQUIRE_MODE_CASES` på inject-secrets-
      # steget ovan: utan raden vore "den mäter på runnern" ett påstående framtvingat av ingenting.
      - name: jobbliggaren-heartbeat (fixturer)
        run: bash deploy/systemd/jobbliggaren-heartbeat.test.sh
        env:
          JBL_REQUIRE_SCRATCH_PATH: "1"

      # Off-box-arkivet (#1175 (A)). Sviten stubbar `journalctl`, `age`, `rclone` och `docker`
      # på en PATH byggd från grunden — ingen root, ingen daemon, inget nätverk.
      #
      # Fyra egenskaper här kan inte observeras av en grön produktionskörning:
      #
      #   1. KORREKTHETSSPINEN. `journalctl --cursor-file` skriver markören som en SIDOEFFEKT av
      #      att läsa, så den naiva formen förlorar ett fönster vid varje misslyckad uppladdning
      #      utan fel någonstans. T6 fäller det, och T7 är kontrafaktumet som gör T6 icke-vakuöst
      #      — T6 ensam passerar även mot ett skript som aldrig skriver någon markör alls.
      #   2. AUDIT-ROTATION. Det finns ingen markör för auditd, så rotation upptäcks på inode.
      #      Missas den blir fönstret mellan förra offseten och rotationen aldrig skeppat — ett
      #      hål exakt där en angripares spår skulle ligga.
      #   3. CREDENTIAL-LÄCKAN. Den avkodade rclone-konfigen får aldrig nå journalen (T10).
      #   4. DRIFT MOT #197. T12 jämför de tre delade literalerna mot `jobbliggaren-backup.sh`.
      #      Den finns uteslutande för att fånga drift som uppstår SENARE, i en annan lane.
      #
      # JBL_REQUIRE_SIBLING_SCRIPTS: T12 skippar sig själv om syskonskriptet inte finns, och en
      # annonserad skip är inte en mätning — samma grind och samma skäl som
      # `JBL_REQUIRE_SCRATCH_PATH` ovan. Utan raden vore drift-detektorn tyst inert precis när
      # syskonet döps om, vilket är det enda tillfälle den behövs.
      - name: jobbliggaren-logship (fixturer)
        run: bash deploy/systemd/jobbliggaren-logship.test.sh
        env:
          JBL_REQUIRE_SIBLING_SCRIPTS: "1"

      # Diagnostik, INGEN grind — och till skillnad från `git --version` ovan är det
      # INTE gratis: `docker compose version` avslutar 1 när plugin:et saknas
      # (`'compose' is not a docker command`), och ett `run:`-steg fäller jobbet på
      # nollskild status. Utan `continue-on-error` hade steget alltså varit en grind
      # medan den här kommentaren gick i god för motsatsen — och eftersom det ligger
      # FÖRE vaktsteget hade det dessutom fällt jobbet med ett rått shell-fel innan
      # vaktens egen `::error:: … 'docker compose' unavailable` hann skrivas ut.
      # Egenskapen görs sann av mekanismen nedan, inte av den här meningen.
      # Golvet grindas av vakten själv: saknas subkommandot avslutar den 2, aldrig 0.
      - name: docker-compose-version (diagnostik — golvet grindas av vakten)
        continue-on-error: true
        run: docker compose version

      # Fixturerna kör guarden mot repots EGET compose-projekt (`$REPO_ROOT`, sedan
      # projekt-semantiken — vilket inkluderar en auto-laddad override och en
      # skuggande `compose.yaml` om någon committas), så det här steget grindar det
      # som faktiskt körs och inte bara sin egen testdata. Mutationsverifierat: tas
      # ett `127.0.0.1:`-prefix bort ur den riktiga filen faller flera av fixturerna
      # som pekar på `$REPO_ROOT`, och jobbet med dem. **INTE alla** — `floor_can_fail`
      # förväntar sig redan exit 1 och förblir grön, vilket är hela skälet att inte
      # skriva "de som pekar dit" som en universal.
      #
      # INGEN SIFFRA HÄR, och den raden är inhämtad genom att bryta mot den TVÅ gånger.
      # Först varnade en version — korrekt — för att lita på ett tal här och publicerade
      # "**två** fixturer" i samma mening; mätt 2026-08-05 föll **tre**, så talet var
      # falskt redan när det skrevs. Ersättningsmeningen sa sedan "fixturerna som pekar
      # på `$REPO_ROOT`", vilket är fyra och alltså också falskt. Kör
      # `bash .github/scripts/compose-loopback-guard.test.sh` för det aktuella svaret.
      #
      # OCH LÄS SVITENS EGEN SUMMERINGSRAD, inte `$?` efter en pipe. `bash …test.sh | tail`
      # rapporterar `tail`:s status, så en körning med FAIL-rader läses som grön — mätt
      # under granskningen av just den här ändringen, av en agent som rapporterade ett
      # omätt resultat på grund av det.
      #
      # Steget är LÅNGSAMMARE än sina grannar, och skälet är strukturellt snarare än en
      # mätning som ruttnar: sviten gör en compose-invokation per fixtur, så tiden växer
      # med fixturantalet. Runner-siffran står i den här körningens egen logg.
      - name: compose-loopback-guard (fixturer + repots eget compose-projekt)
        run: bash .github/scripts/compose-loopback-guard.test.sh

      # Deploy-projektets EGET predikat (#196). Motsatt dom mot vakten ovan: edge:en MÅSTE
      # publicera 80/443 vitt, allt annat får inte publicera alls. Sista fixturen dömer den
      # riktiga `deploy/`-katalogen, inte en kopia av den.
      - name: compose-edge-publish-guard (fixturer + deploy-projektet)
        run: bash .github/scripts/compose-edge-publish-guard.test.sh

      # #1170. Retentionens VARAKTIGHET får bo på ett enda ställe — docs/runbooks/log-sink.md
      # §3 steg 7, curl-anropet som sätter policyn. Före den här grinden bar compose och BUILD.md
      # varsitt påstående om en 30-dagarsgräns som var falskt på varje låda som någonsin kört;
      # de citeras inte här, för vaktens egen fixtur (d) graderar just den formen som fällande.
      # Vakten dömer REPOTS PÅSTÅENDEN, aldrig lådan — grönt betyder inte att retention är satt.
      - name: seq-retention-duration-guard (fixturer + de scopade filerna)
        run: bash .github/scripts/seq-retention-duration-guard.test.sh

  # ---------------------------------------------------------------------------
  # PERF-/SUPPLY-CHAIN-GOVERNANCE (ADR 0045 — observe-only Fas 1).
  #
  # ALLA tre jobben nedan är OBSERVE-ONLY: de ligger MEDVETET UTANFÖR ci.needs.
  # Coverage-gaten (ADR 0044) är orörd — dessa är rent additiva.
  # continue-on-error + explicit
  # exit 0 → de kan aldrig blockera merge Fas 1. Budget-överskridande/CVE-fynd
  # emitteras som ::warning:: + job-summary, inte som fail.
  #
  # Skäl (CTO roster-gap 2026-05-17 + ADR 0045 Beslut 5): "flaky perf-gate
  # sämre än ingen perf-gate". Delade GitHub-runners = web-verifierat brusig
  # baslinje. Flip observe-only→blockerande (ci.needs-inläggning) = medveten
  # ratchet vid Klas-GO efter stabil distribution (ADR 0045 Beslut 6),
  # ALDRIG en tyst default. Ändra inte detta utan Klas-GO.
  # ---------------------------------------------------------------------------

  # Lighthouse-CI — Core Web Vitals (ADR 0045 Beslut 2). lighthouserc.json
  # kör numberOfRuns:3 + median (single-run = flaky). Jobbet sväljer exit-
  # koden (continue-on-error) → observe-only Fas 1.
  lighthouse:
    name: lighthouse (observe-only)
    runs-on: ubuntu-latest
    # Sized for the REAL collect load this fix restores: install + build +
    # 8 URLs × numberOfRuns:3 = 24 Lighthouse-körningar. Den gamla 15-min-
    # budgeten sattes när jobbet failade på sekunder (green-but-empty) och
    # mötte aldrig verklig last. En JOBB-timeout skulle cancel:a jobbet, och
    # if: always()-steg (green-but-empty-vakten) kör INTE efter en cancel →
    # tyst signalförlust, precis det §2.5-vakten ska stänga. Rymlig marginal
    # skyddar vakten. Jobbet är observe-only (ej i ci.needs) → påverkar ej
    # blockerande kritisk väg.
    timeout-minutes: 30
    continue-on-error: true
    defaults:
      run:
        working-directory: web/jobbliggaren-web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/jobbliggaren-web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # lhci autorun körs som ett run-steg (INTE treosh/lighthouse-ci-action) så
      # det ärver jobbets working-directory (web/jobbliggaren-web). Därmed löses
      # configens relativa sökvägar (collect.startServerCommand: pnpm start,
      # upload.outputDir: ./.lighthouseci) från web-dir — precis som en lokal
      # körning. treosh-action körde lhci från repo-roten (GITHUB_WORKSPACE),
      # ärvde ej working-directory, och kunde aldrig hitta `pnpm start`
      # (start-scriptet finns i web-dirs package.json, ej rotens) →
      # green-but-empty: `ERR_PNPM_NO_SCRIPT_OR_SERVER` på VARJE körning,
      # maskerad grön av continue-on-error. @lhci/cli är pinnad devDep (samma
      # runner treosh wrappade internt, nu i vår version-kontroll). Observe-
      # only: continue-on-error gör att collect/assert-fail aldrig blockerar
      # CI Fas 1.
      #
      # 2026-07-20: separat budget.json RETIRERAD. lhci 0.15.1 assert.js
      # kastar ovillkorligt "Cannot use both budgets AND assertions" när
      # assert.budgetsFile OCH assert.assertions är satta samtidigt — de är
      # ömsesidigt uteslutande i denna CLI-version, inte kombinerbara.
      # lighthouserc.json är nu ENDA källan: budget.json:s resourceSizes/
      # resourceCounts ligger inline i assert.assertions som
      # resource-summary:<type>:size|count (samma nyckelformat/KB→byte-formel
      # lhci:s egen budgets-converter.js alltid använt) — SSOT, ingen
      # dubblerad budgetdata som kan divergera.
      - name: Lighthouse CI
        id: lhci
        continue-on-error: true
        run: pnpm exec lhci autorun --config=lighthouserc.json

      # Artifact-upload (ersätter treosh uploadArtifacts). path är workspace-
      # relativ — upload-artifact är ett uses-steg och ärver ej working-directory.
      #
      # #1048: `include-hidden-files` is load-bearing, not cosmetic. The action
      # treats any path segment starting with `.` as hidden and excludes it, and
      # `.lighthouseci` is exactly that — so with the default (false) every report
      # lhci wrote was dropped and no artifact was ever produced. Measured on run
      # 30166260225 (main @ 6129c80b): lhci logged "Dumping 24 reports to disk",
      # the upload logged "No files were found", and the run's artifact list held
      # only coverage-report. `if-no-files-found: ignore` is what kept that silent
      # for the job's whole history, so it moves to `warn`: a miss must annotate.
      # `warn` still cannot block — the job is observe-only (continue-on-error,
      # not in ci.needs) and stays that way until a Klas ratchet (ADR 0045 Beslut 6).
      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lighthouse-results
          path: web/jobbliggaren-web/.lighthouseci
          include-hidden-files: true
          if-no-files-found: warn

      # Green-but-empty-vakt (§2.5 no-silent-caps): producerade lhci ingen data
      # är mätinstrumentet trasigt (som det var i hela sin historia före denna
      # fix). Vakten ANNOTERAR synligt men GRINDAR ALDRIG — jobbet förblir
      # observe-only (continue-on-error, ej i ci.needs). Flip→blockerande =
      # medveten Klas-ratchet (ADR 0045 Beslut 6).
      - name: Lighthouse results present (observe-only guard)
        if: always()
        run: |
          if [ -z "$(ls -A .lighthouseci 2>/dev/null)" ]; then
            echo "::warning::Lighthouse-CI producerade ingen data (.lighthouseci tom/saknas) — mätinstrumentet är trasigt (green-but-empty). Se lhci-steget ovan. Grindar ej (observe-only Fas 1)."
          else
            echo "::notice::Lighthouse-CI samlade data ($(ls -1 .lighthouseci | wc -l) poster i .lighthouseci). Observe-only Fas 1 (ADR 0045 Beslut 2/5) — LCP/CLS/page-weight assert-intent, INP/composite observe. Ratchet→blockerande vid Klas-GO (Beslut 6)."
          fi

  # Load-test (NBomber) — ADR 0045 Beslut 4. Fas 1: compile-verifierar
  # baslinje-scaffoldet (perf/Jobbliggaren.LoadTests, utanför sln). Faktiska
  # hot-path-scenarier + runtime-exekvering mot ephemeral API skrivs/wiras
  # av perf-test-writer-agenten (steg 4). Observe-only — exit 0 ovillkorligt.
  loadtest:
    name: loadtest (observe-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # Compile-gate för NBomber-projektet (fångar att paket/projekt bygger).
      # Runtime-exekvering mot ephemeral API kräver docker-compose-stack
      # (Postgres + Redis + Worker + Api). Wiras upp när CI får compose-stöd;
      # tills dess kör vi enbart compile + baseline-runner mot loopback (utan
      # API → connection-refused, men exit 0 hålls via Program.cs).
      - name: Build load-test project
        continue-on-error: true
        run: dotnet build perf/Jobbliggaren.LoadTests/Jobbliggaren.LoadTests.csproj -c Release

      # Kör NBomber-runnern i "baseline-only"-läge. Hot-path-scenarier (landing-
      # stats m.fl., klass (a)/(b)/(c)) skrivna av perf-test-writer-agenten kräver
      # ephemeral API + Redis-stack — aktiveras genom att flippa
      # LOADTEST_SCENARIOS=landing-stats när compose-stöd finns i CI.
      - name: Run load-test (baseline-only, observe-only)
        continue-on-error: true
        env:
          LOADTEST_SCENARIOS: baseline-only
          LOADTEST_BASE_URL: http://127.0.0.1:8080
        run: dotnet run --project perf/Jobbliggaren.LoadTests/Jobbliggaren.LoadTests.csproj -c Release --no-build

      # Ladda upp NBomber-rapporter + JSON-trend-artefakter. Behövs för
      # Beslut 6-ratchet-utvärderingen (stabil distribution över N runs).
      - name: Upload load-test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: loadtest-reports
          path: |
            loadtest-reports/
            artifacts/perf/
          retention-days: 14
          if-no-files-found: ignore

      - name: Observe-only-not
        if: always()
        run: |
          echo "::notice::Load-test observe-only Fas 1 (ADR 0045 Beslut 4/5). NBomber-projekt compile-verifierat + baseline-runner exekverad. Hot-path-scenarier mot p95-budgetar (Beslut 1) finns implementerade (perf/Jobbliggaren.LoadTests/Scenarios/) men kräver ephemeral API-stack i CI för runtime-exekvering. Blockerar ej merge; flip→gate = Klas-GO-ratchet (Beslut 6)."

  # Supply-chain audit — ADR 0045 Beslut 4/7. CVE-scan (CI-/Dependabot-formad
  # per security-auditor.md:292). Fail-signal vid High/Critical men OBSERVE-
  # ONLY Fas 1 (exit 0). Dependabot öppnar fix-PRs parallellt. security-
  # auditor behåller manuellt Blocker-veto oförändrat.
  audit:
    name: audit (observe-only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/jobbliggaren-web/pnpm-lock.yaml

      - name: Restore (NuGet)
        run: dotnet restore Jobbliggaren.sln

      # dotnet list package --vulnerable: High/Critical → ::warning::, exit 0
      # (observe-only Fas 1, ADR 0045 Beslut 7). Moderate/Low ignoreras
      # medvetet (transitiv dev-brus utan runtime-exponering pre-launch).
      - name: NuGet vulnerability scan (observe-only)
        shell: bash
        run: |
          set -uo pipefail
          out=$(dotnet list Jobbliggaren.sln package --vulnerable --include-transitive 2>&1 || true)
          echo "$out"
          # Herestring, inte pipe — se den blockerande tvillingen i dependabot-automerge.yml
          # för SIGPIPE-mekanismen, som är stängd på båda ställena.
          #
          # DEN ANDRA AXELN ÄR DÄREMOT LEVANDE ÄVEN HÄR, och det är den som kan producera
          # utfallet nedan: `|| true` på raden ovan kastar verktygets exitkod och domen
          # vilar på ett ORD i strömmen, så "inga sårbarheter" är oskiljbart från "kunde
          # inte avgöra". Då fyrar `else`-grenen och skriver ett FALSKT
          # `::notice::Inga NuGet High/Critical-CVE:er` — en tillförsäkran om ett faktum
          # steget inte etablerat, alltså #1198-klassen. Ägs av #1210, som täcker båda
          # anropsplatserna. Ingen merge hänger på den här: jobbet är `continue-on-error`
          # och ligger utanför `ci.needs`.
          if grep -Eiq '\b(High|Critical)\b' <<<"$out"; then
            echo "::warning::NuGet High/Critical CVE upptäckt (ADR 0045 Beslut 7, observe-only Fas 1). Dependabot öppnar fix-PR. security-auditor manuellt Blocker-veto kvarstår."
          else
            echo "::notice::Inga NuGet High/Critical-CVE:er (Moderate/Low ignoreras medvetet pre-launch)."
          fi

      - name: Install (pnpm)
        working-directory: web/jobbliggaren-web
        run: pnpm install --frozen-lockfile

      - name: pnpm audit (observe-only)
        working-directory: web/jobbliggaren-web
        shell: bash
        run: |
          set -uo pipefail
          if pnpm audit --audit-level=high; then
            echo "::notice::pnpm audit: inga High/Critical."
          else
            echo "::warning::pnpm audit High/Critical (ADR 0045 Beslut 7, observe-only Fas 1). Dependabot öppnar fix-PR."
          fi

      # Watches the vuln gate's two escape hatches — `pnpm.auditConfig.ignoreGhsas`
      # (accepted risk) and `pnpm.overrides` (repaired risk). ADR 0065 Amendment
      # 2026-07-28 ratified both and recorded, as a known gap, that neither was
      # watched: a stale entry and a dead override key each produce no warning and
      # no exit difference, and a bare GHSA would silently cover a NEW path if its
      # package re-entered the production tree.
      #
      # It lives HERE and never in `dependabot-automerge.yml`. A path-pinning
      # assertion inside a blocking merge control is how the next deadlock gets
      # built — it would fail a PR for something that PR did not cause, which is
      # the defect that amendment exists to repair. Predicate + fixtures are in
      # `.github/scripts/`, gated by the blocking `scripts` job, per the
      # `is-pure-base-merge.sh` precedent.
      #
      # THE CONSUMER IS `security-auditor`, and naming one was a merge condition.
      # `dependabot-automerge.yml`'s own header — ratified by a security-auditor
      # round and Klas-GO "B" 2026-06-07 — states that *no human reads observe-only
      # audit at auto-merge*. Delivering findings into a channel this repo has
      # already certified as unread would build the empty signal, so the guard is
      # not the alarm: it is the always-current measurement `security-auditor`
      # consults, per its own trigger list and CLAUDE.md §9.2
      # (senior-cto-advisor 2026-07-30).
      #
      # TWO AUDIT FILES, both with the ignore list REMOVED, and neither taken in
      # the checkout. With the list applied the suppressed advisory is invisible and
      # the guard could not tell a stale entry from a live one — the measurement has
      # to see what the suppression hides. `--prod` supplies the partition half:
      # membership in the production advisory set is what re-tests the dev-only
      # argument an acceptance was granted on. Call it a partition rather than
      # reachability, because that is what it is — `--prod` splits DECLARED
      # dependencies, and a devDependency can still generate shipped output (this
      # repo builds its stylesheet from two of them). (The first version parsed
      # `findings[].paths` for that and could not fire at all — pnpm emits
      # `.>root>child`, no spaces, no versions.)
      #
      # `pnpm audit` needs only `package.json` + `pnpm-lock.yaml` in one directory,
      # so both runs happen in RUNNER_TEMP against copies. The checkout is never
      # mutated, which removes the earlier trap/restore and its cancel window.
      - name: audit-suppression-guard (observe-only)
        working-directory: web/jobbliggaren-web
        shell: bash
        run: |
          set -uo pipefail
          probe="$RUNNER_TEMP/audit-probe"
          mkdir -p "$probe"
          jq 'del(.pnpm.auditConfig)' package.json > "$probe/package.json"
          cp pnpm-lock.yaml "$probe/pnpm-lock.yaml"
          # `|| true` is required: pnpm audit exits non-zero whenever advisories
          # exist, so the exit code cannot distinguish findings from failure. The
          # guard asserts the JSON shape instead and reports SKIPPED, never clean.
          ( cd "$probe" && pnpm audit --json        > full.json 2>audit-full.err || true )
          ( cd "$probe" && pnpm audit --json --prod > prod.json 2>audit-prod.err || true )
          for e in "$probe/audit-full.err" "$probe/audit-prod.err"; do
            [ -s "$e" ] && echo "::notice::pnpm audit stderr ($e):" && cat "$e"
          done
          # The two location probes. The guard takes VALUES and FILES, never a
          # version call of its own — that keeps it network-free and fixturable, so
          # resolving the major is the workflow's job. Without these the guard
          # cannot tell "nothing is accepted" from "pnpm 11 reads a different file
          # and this manifest is no longer where the settings live", and it would
          # report the second as clean (measured 2026-07-30 against `del(.pnpm)`).
          major="$(pnpm --version | cut -d. -f1)"
          ws=()
          [ -f pnpm-workspace.yaml ] && ws=(--workspace-yaml pnpm-workspace.yaml)
          bash ../../.github/scripts/audit-suppression-guard.sh \
            --package-json package.json \
            --audit-json "$probe/full.json" \
            --audit-prod-json "$probe/prod.json" \
            --lockfile pnpm-lock.yaml \
            --pnpm-major "$major" "${ws[@]+"${ws[@]}"}"

  # Aggregat-job som kraschar hela CI om något barn-job failed. Gör branch-
  # protection-rules enkla att konfigurera (bara "ci" som required check
  # istället för en check per matrix-cell).
  #
  # Perf-/audit-jobben (lighthouse/loadtest/audit) är MEDVETET EJ med —
  # observe-only Fas 1 (ADR 0045 Beslut 5). Lägg INTE till dem här utan Klas-GO
  # (ratchet, ADR 0045 Beslut 6).
  #
  # `scripts` tillkom 2026-07-27 (#836). Det är INTE den ratcheten: inget
  # observe-only-jobb flippades till blockerande, utan ett nytt jobb som är
  # blockerande från början, för logik som styr när en PR får mergas. Ett
  # observe-only test av en merge-kontroll hade varit samma tomma signal som
  # #861 tog bort. Kostar ~4 s och ligger inte på kritisk väg.
  # ---------------------------------------------------------------------------
  # images — bygger varje container-image PR:en kan bryta. INGEN push.
  #
  # VARFÖR DETTA JOBB FINNS, mätt 2026-08-05: `ci` byggde ingen Dockerfile alls, och de
  # enda `docker build`-stegen i repot ligger i `deploy-dev.yml`, vars första rad säger
  # HISTORICAL och vars auto-trigger togs bort 2026-06-28. Följden satt på `main` utan
  # att någon visste: alla tre .NET-images gick inte att bygga, därför att
  # `.editorconfig` — som markerar EF-migrationerna `generated_code = true` — aldrig
  # kopierades in i byggkontexten. Utanför containern finns filen, alltså var CI grön;
  # inuti fanns den inte, och `TreatWarningsAsErrors` gjorde analysvarningarna till
  # byggfel. En grind hade fångat det den dag Dockerfilen gled från rot-konfigen.
  #
  # Byggkontexten är ett HANDHÅLLET URVAL av repots konfiguration, och det här jobbet är
  # vad som gör ett felaktigt urval högljutt i stället för latent.
  #
  # Trivy blockerar, och den blockerar HÄR snarare än först vid publicering: #196:s AC
  # kräver en bildskanner i den blockerande grinden innan GHCR-publicering går live, och
  # imagesarna blir publika (CTO-dom 2026-08-05, beslut 3) — en publik image är en publik
  # CVE-inventering.
  images:
    name: images (docker build + trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # `nocache` names the stage that must NEVER be served from the layer cache: one running
      # `apk --no-cache upgrade` against alpine's moving index. A cached upgrade layer yields
      # an image carrying the package versions of whenever that layer was built.
      #
      # Per-stage and not `no-cache: true`, so the expensive deterministic work still caches.
      #
      # The three .NET legs are empty ON PURPOSE, not by omission: they carry no upgrade RUN
      # at all. Their OS state comes wholly from `mcr.microsoft.com/dotnet/aspnet:10.0-noble`,
      # whose digest moves when Microsoft rebuilds, which invalidates their cache naturally.
      #
      # An unmatched stage name is SILENTLY ignored by buildkit — exit 0, no warning, step
      # served from cache (measured 2026-08-27, buildx v0.29.1). Nothing here asserts the name
      # still matches a `FROM ... AS <name>`; #1518 owns that gate.
      matrix:
        include:
          - { name: api, context: ".", file: "src/Jobbliggaren.Api/Dockerfile", nocache: "" }
          - { name: worker, context: ".", file: "src/Jobbliggaren.Worker/Dockerfile", nocache: "" }
          - { name: migrate, context: ".", file: "src/Jobbliggaren.Migrate/Dockerfile", nocache: "" }
          - { name: web, context: "web/jobbliggaren-web", file: "web/jobbliggaren-web/Dockerfile", nocache: "runtime" }
          - { name: caddy, context: "deploy/caddy", file: "deploy/caddy/Dockerfile", nocache: "runtime" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: jobbliggaren-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
          no-cache-filters: ${{ matrix.nocache }}
          # web-imagen bakar in NEXT_PUBLIC_* vid build och kan inte rättas vid runtime.
          # Värdet här är CI:ns, inte produktionens — jobbet bevisar att bygget går, inte
          # vad som publiceras. Release-workflowen skickar sitt eget.
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://ci.invalid

      - name: Trivy ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: jobbliggaren-${{ matrix.name }}:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  ci:
    name: ci
    needs: [backend, frontend, coverage, scripts, images]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs passed
        run: |
          if [[ "${{ needs.backend.result }}" != "success" ]] || \
             [[ "${{ needs.frontend.result }}" != "success" ]] || \
             [[ "${{ needs.coverage.result }}" != "success" ]] || \
             [[ "${{ needs.scripts.result }}" != "success" ]] || \
             [[ "${{ needs.images.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All jobs passed"
