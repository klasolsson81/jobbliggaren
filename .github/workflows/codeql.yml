# CodeQL code scanning — SAST (observe-only Fas 1).
#
# Statisk säkerhetsanalys (SAST) av backend (C# / .NET 10) + frontend
# (JavaScript/TypeScript / Next.js 16). Resultat hamnar i repots
# Security → Code scanning-flik som SARIF-alerts.
#
# ---------------------------------------------------------------------------
# OBSERVE-ONLY Fas 1 (samma ratchet-disciplin som ADR 0045 fitness-functions).
#
# Denna workflow är en EGEN check — den ligger MEDVETET UTANFÖR det required
# `ci`-aggregatet i build.yml (se `ci.needs` där; uppräkningen står på ETT
# ställe, för en lista över trädet går stale medan en regel inte gör det).
# Branch protection (ADR 0065) kräver enbart `ci`, så CodeQL kan aldrig
# blockera merge Fas 1. `continue-on-error: true` på jobbet speglar
# lighthouse/loadtest/audit-jobben i build.yml — fynd/build-fel ger neutral
# check, inte röd merge-spärr. Alerts syns ändå i Security-fliken.
#
# Flip observe-only → blockerande (kräva "CodeQL"-check i branch protection,
# eller code-scanning required) = MEDVETEN Klas-GO-ratchet efter stabil
# baslinje (ADR 0045 Beslut 6-precedens), ALDRIG en tyst default. Ändra inte
# detta utan Klas-GO. Den ratchet:en ska då dokumenteras (ADR 0045-amendment
# eller egen ADR), konsekvent med hur 0045 behandlade sina observe→gate-flips.
# ---------------------------------------------------------------------------
name: codeql

on:
  push:
    branches: [main]
  # No base-branch filter (#861) — mirrors build.yml so a stacked PR is scanned too.
  # Without this, a PR based on another feature branch produced no SARIF at all and the
  # absence looked like a clean scan.
  pull_request:
  schedule:
    # Måndag 04:23 UTC — udda minut för att undvika runner-rusningstid.
    # Schemalagd full-scan fångar drift mellan PR:er + nya CodeQL-queries.
    - cron: '23 4 * * 1'
  workflow_dispatch:

# Avbryt äldre runs vid ny push på samma ref (sparar minutes på dependabot-PRs).
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }}, observe-only)
    runs-on: ubuntu-latest
    # Observe-only Fas 1: jobbet kan aldrig blockera merge (speglar ADR 0045-
    # jobben i build.yml). Build-fel/fynd → neutral check, ej röd spärr.
    continue-on-error: true
    timeout-minutes: 20

    permissions:
      # CodeQL kräver write för att ladda upp SARIF till Security-fliken.
      security-events: write
      # Läs-behörigheter för checkout + workflow-metadata.
      contents: read
      actions: read

    strategy:
      # Låt C#-jobbet fortsätta även om JS/TS-jobbet faller (och tvärtom) —
      # observe-only, vi vill ha bägge språkens signal oberoende.
      fail-fast: false
      matrix:
        include:
          # C# / .NET 10: build-mode MANUAL. Återbrukar build.yml:s kända-gröna
          # build-recept (setup-dotnet@v6 + global.json + restore + build) för
          # determinism — INTE autobuild. Skäl (senior-cto-advisor 2026-06-07,
          # agentId af8997b2f5987e1ee): Mediator.SourceGenerator emitterar
          # CQRS-dispatch/DI/pipeline-kod (inkl auth-pipeline) endast vid
          # kompilering. build-mode:none skulle lämna den ytan osynlig för SAST;
          # autobuild inför en andra, divergens-benägen build-väg (DRY-brott +
          # flakiness-risk i observe-only-jobb). Manual = autobuilds täckning
          # utan dess heuristik-risk, deterministiskt identiskt med grön CI.
          - language: csharp
            build-mode: manual
          # JS/TS / Next.js 16: build-mode NONE — tolkat språk, inget bygge
          # krävs. node_modules exkluderas automatiskt; .next via codeql-config.
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # --- C#-only: SDK + NuGet-cache (krävs av manual build nedan) ----------
      # global.json låser 10.0.200 (rollForward latestFeature) — identiskt med
      # build.yml så CodeQL bygger exakt samma produkt som grön CI.
      - name: Setup .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Cache NuGet
        if: matrix.language == 'csharp'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Packages.props', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # --- CodeQL init -------------------------------------------------------
      # SHA-PINNED, AND THE ENGINE STILL HAS TO MOVE. Both halves matter; neither
      # works alone.
      #
      # History, because this block previously said the opposite. #1139 proposed
      # narrowing both codeql-action sites to an exact patch (`@v4.37.3`) and that
      # was rejected — a version tag is mutable, so the narrowing bought no tamper
      # resistance while paying the full staleness cost, and this file's schedule
      # exists to catch "nya CodeQL-queries" (see the `schedule` comment at the
      # top). #1239 then SHA-pinned every action in the repo, on Klas-beslut
      # 2026-08-08, after a measured path from a moved upstream release tag to root
      # on the production box.
      #
      # A SHA pin is what the #1139 rejection called the better trade: it pays the
      # same staleness cost and DOES buy the tamper resistance. But paying that cost
      # only makes sense if something still advances the engine — and a SHA does not
      # move on its own. So the staleness half is carried by Dependabot: the
      # `github/codeql-action*` sub-major `ignore` in `.github/dependabot.yml` was
      # REMOVED in the same change, because with a SHA pin that rule refused the
      # only PRs that can unfreeze the analysis engine. Left in place it would have
      # frozen the weekly scan on whatever bundle this SHA carries, silently and
      # green (measured 2026-08-08: v4 shipped .4, .5 and .6 inside one week).
      #
      # And the hole that `ignore` originally closed is closed elsewhere rather than
      # reopened: a codeql-action bump is patch/minor, so it would auto-merge with
      # no agent on it. `dependabot-automerge.yml`'s gate now excludes
      # `github/codeql-action` BY DEPENDENCY NAME. Changing the analysis engine
      # stays a decision with a reader.
      #
      # THREE FILES, ONE MECHANISM: the pin here, the absent `ignore` in
      # dependabot.yml, the name exclusion in dependabot-automerge.yml. Moving any
      # one without the others reintroduces either the freeze or the silent
      # auto-merge. The adjudicator for the pinning convention is
      # `grep -rhoE 'uses:\s*\S+' .github/workflows/ | grep -vE 'uses: [^@]+@[0-9a-f]{40}$'`,
      # which returns only prose; do not maintain a count here.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      # --- C#-only: manuellt build mellan init och analyze -------------------
      # Källgenererad mediator-kod existerar bara efter kompilering → måste
      # byggas för att SAST ska se den. Samma fyra steg som build.yml.
      - name: Build (C#, manual build-mode)
        if: matrix.language == 'csharp'
        run: |
          dotnet restore Jobbliggaren.sln
          dotnet build Jobbliggaren.sln --no-restore -c Release

      # --- CodeQL analyze ----------------------------------------------------
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: '/language:${{ matrix.language }}'

      - name: Observe-only-not
        if: always()
        run: |
          echo "::notice::CodeQL observe-only Fas 1 (ADR 0045-ratchet-precedens). ${{ matrix.language }} SAST → Security-fliken. Blockerar ej merge (utanför required ci-aggregatet); flip→blockerande = Klas-GO-ratchet."
