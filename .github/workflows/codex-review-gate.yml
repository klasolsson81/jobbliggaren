name: Codex review gate

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number
        required: true
        type: string
      head_sha:
        description: Full SHA read in both completed Codex reports
        required: true
        type: string
      base_ref:
        description: Reviewed target branch name
        required: true
        type: string
      base_sha:
        description: Full reviewed target branch SHA
        required: true
        type: string
      verdict:
        description: Record clean reports or revoke approval
        required: true
        type: choice
        options: [blocked, approved]
        default: blocked
      code_report:
        description: Codex code review report URL
        type: string
      security_report:
        description: Codex security review report URL
        type: string
      attestation:
        description: Type both-complete-zero-medium-plus only after reading both reports
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: write

concurrency:
  group: codex-review-${{ github.event.inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  attest:
    if: github.event_name == 'pull_request_target' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default branch, never PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate scope or publish owner attestation
        run: python3 .github/scripts/codex_review_gate.py
        env:
          GH_TOKEN: ${{ github.token }}
