# Dependabot auto-merge — minska manuellt PR-arbete för rutinmässiga dep-bumpar.
#
# Aktiverar GitHub auto-merge på Dependabot-PRs som är patch/minor. MAJOR
# granskas alltid manuellt (auto-merge aktiveras ej för dem).
#
# Respekterar branch protection (ADR 0065): GitHub auto-merge squash-mergar
# FÖRST när required `ci`-aggregatet är grönt.
#
# BLOCKERANDE VULN-GATE (Klas-GO "B" 2026-06-07, security-auditor-rond
# a60bb5f08176fdf7f): till skillnad från `ci`-aggregatet (där audit är
# observe-only, ADR 0045) kör detta workflow en EGEN blockerande supply-chain-
# scan (NuGet + pnpm, High/Critical) innan auto-merge aktiveras — eftersom ingen
# människa läser observe-only-audit vid auto-merge. En patch/minor med känd
# High/Critical-CVE auto-mergas alltså INTE; jobbet failar och PR:n faller
# tillbaka på manuell granskning. (OBS: detta fångar CVE:er, inte cert-/signerings-
# fel som NU3012 — sådant fångas av build+restore i `ci`-aggregatet.) Detta ändrar
# EJ ADR 0045:s observe-only-status för `ci` (Avvisat-alt-5 i ADR 0065 består) —
# gaten gäller bara den automatiska vägen.
#
# FÖRKRAV (engångs, Klas): "Allow auto-merge" PÅ i Settings → General +
# branch protection aktiv (kräver publikt repo eller Pro — bunden till
# visibility, verifiera vid visibility-byte).
#
# OBS (ADR 0065): required_conversation_resolution=true — om en kommentar landar
# på en Dependabot-PR väntar auto-merge tills tråden är resolved.
name: dependabot-automerge

on:
  pull_request:
    # This filter deliberately SURVIVED #861, which dropped the equivalent one from
    # build/codeql/e2e. Reason: Dependabot only ever opens PRs against the default
    # branch (`.github/dependabot.yml` sets no `target-branch:` for any of its
    # ecosystems), so the filter is a no-op today and stacked Dependabot PRs do not
    # exist. NOT kept for blast-radius reasons — `label-automerge.yml` already runs
    # with `contents: write` + `pull-requests: write` and no branches filter at all.
    # If `target-branch:` is ever added, this filter silently means "auto-merge never
    # runs" for those PRs — the exact silent-failure shape #861 removed elsewhere.
    branches: [main]

# write krävs för att GITHUB_TOKEN ska kunna aktivera auto-merge på PR:n.
permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: auto-merge (patch/minor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Kör ENBART för Dependabot-öppnade PRs.
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Hämta Dependabot-metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Avgör behörighet en gång: endast patch/minor. Major/okänd → hela resten
      # hoppas över (ingen scan, ingen auto-merge) → manuell granskning.
      - name: Avgör behörighet (endast patch/minor)
        id: gate
        shell: bash
        run: |
          if [[ "$UT" == "version-update:semver-patch" || "$UT" == "version-update:semver-minor" ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::update-type=$UT → major/okänd, manuell granskning (ingen auto-merge)."
          fi
        env:
          UT: ${{ steps.metadata.outputs.update-type }}

      - name: Checkout
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        uses: actions/checkout@v7

      - name: Setup .NET
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup pnpm
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Setup Node
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/jobbliggaren-web/pnpm-lock.yaml

      # Blockerande NuGet-gate. dotnet list package --vulnerable returnerar exit 0
      # även med fynd → vi greppar Severity-kolumnen och failar vid High/Critical.
      - name: Blockerande NuGet vuln-gate (High/Critical)
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        shell: bash
        run: |
          set -uo pipefail
          dotnet restore Jobbliggaren.sln
          out=$(dotnet list Jobbliggaren.sln package --vulnerable --include-transitive 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -Eiq '\b(High|Critical)\b'; then
            echo "::error::NuGet High/Critical-CVE — auto-merge blockeras. Granska manuellt."
            exit 1
          fi
          echo "::notice::Inga NuGet High/Critical-CVE:er."

      # Blockerande npm-gate. pnpm audit --audit-level=high returnerar exit != 0
      # vid High/Critical → jobbet failar → auto-merge aktiveras ej.
      #
      # REPAIRED, NOT SUPPRESSED (2026-07-28), because the gate could not
      # CONVERGE. It audits the whole tree rather than the diff, and so failed PRs
      # that REMOVE vulnerabilities over vulnerabilities they did not introduce.
      # Measured: PR #1042 (`next` 16.2.9 -> 16.2.11) sat open for three days with
      # green `ci` and this job red; that bump alone closes 18 of the repo's 28
      # Dependabot alerts. It was failed by six OTHER packages — `tmp`,
      # `brace-expansion`, `js-yaml`, `fast-uri`, `postcss`, `sharp`.
      #
      # All six are TRANSITIVE, so Dependabot opens no PR for any of them. The
      # first draft of this change concluded from that fact that they could not be
      # cleared, and suppressed all seven advisories. **That conclusion did not
      # follow.** No Dependabot PR means only that Dependabot will not fix them FOR
      # us — not that they are unfixable. They are fixed here, by hand, through
      # `pnpm.overrides` in `web/jobbliggaren-web/package.json`: the mechanism that
      # same object already used twice, four lines above where the suppression was
      # about to go. Both reviewers found this independently.
      #
      # MEASURED ON pnpm 9.15.9 — what `pnpm/action-setup@v6` `version: 9` resolved
      # to on 2026-07-28. That is a SNAPSHOT, not a pin: `version: 9` floats and
      # there is no `packageManager` field (see `build.yml`'s Setup pnpm comment).
      # It was measured on 9 and not only on a local pnpm 10 because a
      # version-dependent mechanism would have made this change a silent no-op on
      # the runner. 9.15.9 and 10.28.2 gave identical advisory sets:
      #   - before:                    11 high/critical
      #   - with the overrides:         5  (4 `next` + the one accepted below)
      #   - with #1042's `next` bump:   0  -> `--audit-level=high` exit 0
      # `pnpm build` exit 0 and the full vitest suite green against the new
      # lockfile; `install --frozen-lockfile` exit 0, so the gate's own install
      # step is unaffected.
      #
      # WHAT IS STILL ACCEPTED — exactly one entry, in
      # `pnpm.auditConfig.ignoreGhsas`:
      #
      #   GHSA-mh99-v99m-4gvg   brace-expansion   vulnerable <=5.0.7
      #
      # WHY IT CANNOT BE REPAIRED: the patched range is `>=5.0.8`, and the paths
      # that survive resolve brace-expansion **1.1.16** — which is `<=5.0.7` in
      # semver order, hence in range — underneath `minimatch` 3.x, which pins
      # `^1.1.7`. Forcing 5.0.8 there breaks the dependency outright.
      # WHAT WOULD REMOVE IT: minimatch 3.x leaving the tree (it arrives via
      # `@lhci/cli` and `eslint`), or the 1.x line publishing an equivalent fix.
      # WHY IT IS ACCEPTABLE MEANWHILE: measured 2026-07-28, 71 paths, every one
      # rooted in `@lhci/cli`, `eslint` or `eslint-config-next` — all three
      # devDependencies. The one production path that existed
      # (`shadcn > ts-morph > @ts-morph/common > minimatch@10`) is closed by the
      # `brace-expansion@>=2.0.0 <=5.0.7` override. It is a DoS-class advisory in
      # lint/Lighthouse tooling, reachable by nothing we ship.
      #
      # THE `sharp` RESIDUAL, NAMED RATHER THAN LEFT IMPLICIT. The override takes
      # sharp 0.34.5 -> 0.35.3 and `pnpm build` is green. That is evidence the
      # override does not BREAK the build; it is NOT evidence that sharp still
      # SERVES, because the build never exercises it — `next/image` is imported by
      # no file in `src/`, and `next.config.ts` has no `images` key. sharp's
      # runtime surface is `/_next/image`, an endpoint Next serves and this app
      # never invokes. Do not cite the green build as a runtime guarantee.
      #
      # WHY A GHSA LIST RATHER THAN A LOWER THRESHOLD, for the one that remains:
      # `--audit-level=critical` reaches exit 0 today (there are no criticals), so
      # it would have hidden all four `next` advisories — two SSRF and a proxy
      # bypass — without naming anything. A GHSA line is a diff a human approves;
      # `git blame` gives its date and its PR, and the reasoning lives in this
      # comment, which is why the comment is long. `--prod` was measured and
      # rejected: it does not converge (`sharp`, `postcss`, `fast-uri`,
      # `brace-expansion` all survive it), and pnpm reports `devDependencies: 0`
      # for this tree, so its dev/prod split is not the one `package.json`
      # declares.
      #
      # READING THE LOG: pnpm's summary line prints PRE-filter counts. A GREEN run
      # can still print a line like `14 high (7 ignored)`. Judge the gate by its
      # exit code, and risk by the Dependabot alert count — not by that line.
      #
      # THE REGISTER IS NOT THIS FILE. `auditConfig` filters `pnpm audit` (and so
      # `audit (observe-only)` in `build.yml` too), but GitHub's Dependabot alerts
      # are unaffected — that is where the 28 are counted and that is the number
      # that must go to zero. This list must shrink, not grow. Note it has no
      # mechanism enforcing that: a stale entry produces no warning and no exit
      # difference, and a bare GHSA would silently cover a NEW path if
      # brace-expansion ever re-entered the production tree. A guard pinning which
      # paths this entry resolves to belongs in observe-only `audit`, never inside
      # this merge control.
      - name: Install (pnpm, för audit)
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        working-directory: web/jobbliggaren-web
        run: pnpm install --frozen-lockfile

      - name: Blockerande pnpm vuln-gate (High/Critical)
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        working-directory: web/jobbliggaren-web
        run: pnpm audit --audit-level=high

      - name: Aktivera auto-merge (patch/minor, vuln-gate passerad)
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
