# Dependabot auto-merge — minska manuellt PR-arbete för rutinmässiga dep-bumpar.
#
# Aktiverar GitHub auto-merge på Dependabot-PRs som är patch/minor. MAJOR
# granskas alltid manuellt (auto-merge aktiveras ej för dem).
#
# Respekterar branch protection (ADR 0065): GitHub auto-merge squash-mergar
# FÖRST när required `ci`-aggregatet är grönt.
#
# BLOCKERANDE VULN-GATE (Klas-GO "B" 2026-06-07, security-auditor-rond
# a60bb5f08176fdf7f): till skillnad från `ci`-aggregatet (där audit är
# observe-only, ADR 0045) kör detta workflow en EGEN blockerande supply-chain-
# scan (NuGet + pnpm, High/Critical) innan auto-merge aktiveras — eftersom ingen
# människa läser observe-only-audit vid auto-merge. En patch/minor med känd
# High/Critical-CVE auto-mergas alltså INTE; jobbet failar och PR:n faller
# tillbaka på manuell granskning. (OBS: detta fångar CVE:er, inte cert-/signerings-
# fel som NU3012 — sådant fångas av build+restore i `ci`-aggregatet.) Detta ändrar
# EJ ADR 0045:s observe-only-status för `ci` (Avvisat-alt-5 i ADR 0065 består) —
# gaten gäller bara den automatiska vägen.
#
# FÖRKRAV (engångs, Klas): "Allow auto-merge" PÅ i Settings → General +
# branch protection aktiv (kräver publikt repo eller Pro — bunden till
# visibility, verifiera vid visibility-byte).
#
# OBS (ADR 0065): required_conversation_resolution=true — om en kommentar landar
# på en Dependabot-PR väntar auto-merge tills tråden är resolved.
name: dependabot-automerge

on:
  pull_request:
    # This filter deliberately SURVIVED #861, which dropped the equivalent one from
    # build/codeql/e2e. Reason: Dependabot only ever opens PRs against the default
    # branch (`.github/dependabot.yml` sets no `target-branch:` for any of its
    # ecosystems), so the filter is a no-op today and stacked Dependabot PRs do not
    # exist. NOT kept for blast-radius reasons — `label-automerge.yml` already runs
    # with `contents: write` + `pull-requests: write` and no branches filter at all.
    # If `target-branch:` is ever added, this filter silently means "auto-merge never
    # runs" for those PRs — the exact silent-failure shape #861 removed elsewhere.
    branches: [main]

# write krävs för att GITHUB_TOKEN ska kunna aktivera auto-merge på PR:n.
permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: auto-merge (patch/minor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Kör ENBART för Dependabot-öppnade PRs.
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Hämta Dependabot-metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Avgör behörighet en gång: endast patch/minor. Major/okänd → hela resten
      # hoppas över (ingen scan, ingen auto-merge) → manuell granskning.
      - name: Avgör behörighet (endast patch/minor)
        id: gate
        shell: bash
        run: |
          if [[ "$UT" == "version-update:semver-patch" || "$UT" == "version-update:semver-minor" ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::update-type=$UT → major/okänd, manuell granskning (ingen auto-merge)."
          fi
        env:
          UT: ${{ steps.metadata.outputs.update-type }}

      - name: Checkout
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        uses: actions/checkout@v7

      - name: Setup .NET
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Setup pnpm
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Setup Node
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/jobbliggaren-web/pnpm-lock.yaml

      # Blockerande NuGet-gate. dotnet list package --vulnerable returnerar exit 0
      # även med fynd → vi greppar Severity-kolumnen och failar vid High/Critical.
      - name: Blockerande NuGet vuln-gate (High/Critical)
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        shell: bash
        run: |
          set -uo pipefail
          dotnet restore Jobbliggaren.sln
          out=$(dotnet list Jobbliggaren.sln package --vulnerable --include-transitive 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -Eiq '\b(High|Critical)\b'; then
            echo "::error::NuGet High/Critical-CVE — auto-merge blockeras. Granska manuellt."
            exit 1
          fi
          echo "::notice::Inga NuGet High/Critical-CVE:er."

      # Blockerande npm-gate. pnpm audit --audit-level=high returnerar exit != 0
      # vid High/Critical → jobbet failar → auto-merge aktiveras ej.
      #
      # BASELINE-SCOPED SINCE 2026-07-28, because the gate could not otherwise
      # CONVERGE. It audited the whole tree rather than the diff, and so failed
      # PRs that REMOVE vulnerabilities over vulnerabilities they did not
      # introduce. Measured: PR #1042 (`next` 16.2.9 -> 16.2.11) sat open for
      # three days with green `ci` and this job red; that bump alone closes 18 of
      # the repo's 28 Dependabot alerts. It was failed by six OTHER packages —
      # `tmp`, `brace-expansion`, `js-yaml`, `fast-uri`, `postcss`, `sharp` —
      # every one of them TRANSITIVE and therefore never given its own Dependabot
      # PR. The deadlock was total: nothing could pass.
      #
      # The baseline lives in `web/jobbliggaren-web/package.json` under
      # `pnpm.auditConfig.ignoreGhsas`, a GHSA list. The form is chosen so that an
      # accepted risk is VISIBLE and ATTRIBUTABLE: the line is a diff a human
      # approves, and `git blame` on it IS the date and the rationale. Contrast a
      # lowered threshold (`--audit-level=critical`), which would have hidden the
      # very same acceptance without ever naming what was accepted.
      #
      # `next`'s own advisories are DELIBERATELY ABSENT from the list — the gate
      # must still be able to fail a next regression.
      #
      # WHICH GHSA IS WHICH. JSON admits no comments, so the seven entries are
      # bare strings there and this is the only place the mapping is written. It
      # is load-bearing for the "this list must shrink" instruction below: without
      # it, nobody can tell which line to delete when a package is finally fixed.
      # Measured from `pnpm audit --json` on 2026-07-28, all seven transitive:
      #   GHSA-3jxr-9vmj-r5cp  brace-expansion
      #   GHSA-mh99-v99m-4gvg  brace-expansion
      #   GHSA-52cp-r559-cp3m  js-yaml
      #   GHSA-f88m-g3jw-g9cj  sharp
      #   GHSA-ph9p-34f9-6g65  tmp
      #   GHSA-r28c-9q8g-f849  postcss
      #   GHSA-v2hh-gcrm-f6hx  fast-uri
      #
      # MEASURED ON pnpm 9.15.9 — what `pnpm/action-setup@v6` with `version: 9`
      # resolves to — and NOT only on a local pnpm 10, because the entire risk was
      # that `auditConfig` might be version-dependent and this change therefore a
      # silent no-op on the runner. 9.15.9 and 10.28.2 gave byte-identical
      # advisory sets:
      #   - tree WITHOUT the baseline: 11 high/critical advisories
      #   - tree WITH the baseline:     4, all of them `next`'s (gate still red)
      #   - #1042's ACTUAL tree + baseline (next 16.2.11 resolved in node_modules):
      #     0 high/critical, `pnpm audit --audit-level=high` exit 0
      # `pnpm install --frozen-lockfile` stays exit 0 as well — `auditConfig` is
      # not part of the lockfile, so the gate's own install step is unaffected.
      # The gate can therefore reach green again, which was the whole point.
      #
      # THE REGISTER IS NOT THIS FILE. `auditConfig` filters `pnpm audit` (and
      # thereby `audit (observe-only)` in `build.yml` too), but GitHub's Dependabot
      # alerts are unaffected — that is where the 28 are counted, and that is the
      # number that must go to zero. This list must shrink, not grow; every entry
      # that becomes unnecessary is to be removed.
      - name: Install (pnpm, för audit)
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        working-directory: web/jobbliggaren-web
        run: pnpm install --frozen-lockfile

      - name: Blockerande pnpm vuln-gate (High/Critical)
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        working-directory: web/jobbliggaren-web
        run: pnpm audit --audit-level=high

      - name: Aktivera auto-merge (patch/minor, vuln-gate passerad)
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
