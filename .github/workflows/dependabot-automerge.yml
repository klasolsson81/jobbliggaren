# Dependabot auto-merge — minska manuellt PR-arbete för rutinmässiga dep-bumpar.
#
# Aktiverar GitHub auto-merge på Dependabot-PRs som är patch/minor. MAJOR
# granskas alltid manuellt (auto-merge aktiveras ej för dem).
#
# Respekterar branch protection (ADR 0065): GitHub auto-merge squash-mergar
# FÖRST när required `ci`-aggregatet är grönt.
#
# BLOCKERANDE VULN-GATE (Klas-GO "B" 2026-06-07, security-auditor-rond
# a60bb5f08176fdf7f): till skillnad från `ci`-aggregatet (där audit är
# observe-only, ADR 0045) kör detta workflow en EGEN blockerande supply-chain-
# scan (NuGet + pnpm, High/Critical) innan auto-merge aktiveras — eftersom ingen
# människa läser observe-only-audit vid auto-merge. En patch/minor med känd
# High/Critical-CVE auto-mergas alltså INTE; jobbet failar och PR:n faller
# tillbaka på manuell granskning. (OBS: detta fångar CVE:er, inte cert-/signerings-
# fel som NU3012 — sådant fångas av build+restore i `ci`-aggregatet.) Detta ändrar
# EJ ADR 0045:s observe-only-status för `ci` (Avvisat-alt-5 i ADR 0065 består) —
# gaten gäller bara den automatiska vägen.
#
# FÖRKRAV (engångs, Klas): "Allow auto-merge" PÅ i Settings → General +
# branch protection aktiv (kräver publikt repo eller Pro — bunden till
# visibility, verifiera vid visibility-byte).
#
# OBS (ADR 0065): required_conversation_resolution=true — om en kommentar landar
# på en Dependabot-PR väntar auto-merge tills tråden är resolved.
name: dependabot-automerge

on:
  pull_request:
    # This filter deliberately SURVIVED #861, which dropped the equivalent one from
    # build/codeql/e2e. Reason: Dependabot only ever opens PRs against the default
    # branch (`.github/dependabot.yml` sets no `target-branch:` for any of its
    # ecosystems), so the filter is a no-op today and stacked Dependabot PRs do not
    # exist. NOT kept for blast-radius reasons — `label-automerge.yml` already runs
    # with `contents: write` + `pull-requests: write` and no branches filter at all.
    # If `target-branch:` is ever added, this filter silently means "auto-merge never
    # runs" for those PRs — the exact silent-failure shape #861 removed elsewhere.
    branches: [main]

# write krävs för att GITHUB_TOKEN ska kunna aktivera auto-merge på PR:n.
permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: auto-merge (patch/minor)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Kör ENBART för Dependabot-öppnade PRs.
    if: ${{ github.actor == 'dependabot[bot]' }}
    steps:
      - name: Hämta Dependabot-metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Avgör behörighet en gång: endast patch/minor. Major/okänd → hela resten
      # hoppas över (ingen scan, ingen auto-merge) → manuell granskning.
      #
      # `docker-compose` UNDANTAS HELT, och grinden nycklar på FELMOD, inte på
      # scan-täckning. Den blockerande scannen nedan är `dotnet list package --vulnerable`
      # + `pnpm audit`; ingen av dem läser en container-image, så BÅDA docker-ekosystemen
      # passerar den vakuöst. Ändå undantas bara compose, därför att bara den faller TYST:
      # `docker-compose.yml` bär `postgres:18.3`, migration
      # 20260714170816_AddSwedishCollationToCompanyRegisterText deklarerar `public.swedish`
      # som en ICU-kollation, och ICU-versionen kommer ur basimagen — en patch/minor-bump
      # kan alltså lämna btree-index sorterade efter en ordning som inte längre gäller.
      # Postgres kraschar inte på det; frågorna blir tyst fel. Och den träffar dev-DB:n,
      # den enda som i dag håller riktiga data (mätt 2026-08-04: 106 071 annonser,
      # 1 066 938 företagsrader). En trasig `sdk`/`aspnet`-basimage faller i stället
      # högljutt i build eller deploy, och ingenting bygger eller publicerar dem än —
      # image-scannern för dem ägs av #196:s AC före GHCR-publicering.
      #
      # Kadensen påverkas INTE: Dependabot öppnar PR:en månadsvis som förut. Det som
      # faller bort är auto-merge, alltså att ingen människa läser den.
      #
      # `package-ecosystem` är en dokumenterad output från `dependabot/fetch-metadata`
      # (verifierat 2026-08-04). Skulle den någon gång sakna värde faller villkoret till
      # tom sträng → PR:en förblir behörig; därför loggas värdet, så att en tyst
      # regression syns i jobbloggen i stället för att gömma sig.
      - name: Avgör behörighet (endast patch/minor, aldrig docker-compose)
        id: gate
        shell: bash
        run: |
          echo "::notice::update-type=$UT ecosystem=${ECO:-<tomt>}"
          if [[ "$ECO" == "docker-compose" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::docker-compose → tyst ICU-kollationsrisk mot dev-DB:n, manuell granskning (release-checklist.md §2)."
          elif [[ "$UT" == "version-update:semver-patch" || "$UT" == "version-update:semver-minor" ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::update-type=$UT → major/okänd, manuell granskning (ingen auto-merge)."
          fi
        env:
          UT: ${{ steps.metadata.outputs.update-type }}
          ECO: ${{ steps.metadata.outputs.package-ecosystem }}

      - name: Checkout
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        uses: actions/checkout@v7

      - name: Setup .NET
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup pnpm
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      - name: Setup Node
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/jobbliggaren-web/pnpm-lock.yaml

      # Blockerande NuGet-gate. dotnet list package --vulnerable returnerar exit 0
      # även med fynd → vi greppar Severity-kolumnen och failar vid High/Critical.
      - name: Blockerande NuGet vuln-gate (High/Critical)
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        shell: bash
        run: |
          set -uo pipefail
          dotnet restore Jobbliggaren.sln
          out=$(dotnet list Jobbliggaren.sln package --vulnerable --include-transitive 2>&1 || true)
          echo "$out"
          if echo "$out" | grep -Eiq '\b(High|Critical)\b'; then
            echo "::error::NuGet High/Critical-CVE — auto-merge blockeras. Granska manuellt."
            exit 1
          fi
          echo "::notice::Inga NuGet High/Critical-CVE:er."

      # Blockerande npm-gate. pnpm audit --audit-level=high returnerar exit != 0
      # vid High/Critical → jobbet failar → auto-merge aktiveras ej.
      #
      # REPAIRED, NOT SUPPRESSED (2026-07-28), because the gate could not
      # CONVERGE. It audits the whole tree rather than the diff, and so failed PRs
      # that REMOVE vulnerabilities over vulnerabilities they did not introduce.
      # Measured: PR #1042 (`next` 16.2.9 -> 16.2.11) sat open for three days with
      # green `ci` and this job red; that bump alone closes 18 of the repo's 28
      # Dependabot alerts. It was failed by six OTHER packages it does not touch —
      # `tmp`, `brace-expansion`, `js-yaml`, `fast-uri`, `postcss`, `sharp` — all
      # transitive, so Dependabot opens no PR for any of them. They are repaired by
      # hand via `pnpm.overrides` in `web/jobbliggaren-web/package.json`.
      #
      # THE RULES live in ADR 0065, Amendment 2026-07-28 — when an advisory may be
      # accepted rather than repaired (Beslut 1-5), and why an override key is
      # gated only to PARTITION, with the mechanism that makes raising the wrong
      # half a no-op (Beslut 6). Read it before touching `overrides` or
      # `auditConfig`. What follows is the INVENTORY: what is true of this tree
      # today.
      #
      # MEASURED ON pnpm 9.15.9 — what `pnpm/action-setup@v6` `version: 9` resolved
      # to on 2026-07-28. `version: 9` pins the MAJOR only and there is no
      # `packageManager` field, so the patch floats; measuring on 9 rather than only
      # on a local pnpm 10 mattered because a version-dependent mechanism would have
      # made this a silent no-op on the runner. 9.15.9 and 10.28.2 gave identical
      # advisory sets:
      #   - before:                    11 high/critical
      #   - with the overrides:         5  (4 `next` + the one accepted below)
      #   - with #1042's `next` bump:   0  -> `--audit-level=high` exit 0
      # `pnpm build` exit 0, `install --frozen-lockfile` exit 0, and CI's `frontend`
      # job (which runs the full vitest suite) green on the same tree.
      #
      # WHAT IS STILL ACCEPTED — exactly one entry, in
      # `pnpm.auditConfig.ignoreGhsas`:
      #
      #   GHSA-mh99-v99m-4gvg   brace-expansion   vulnerable <=5.0.7
      #
      # WHY IT CANNOT BE REPAIRED: the patched range is `>=5.0.8`, and the paths
      # that survive resolve brace-expansion **1.1.16** — which is `<=5.0.7` in
      # semver order, hence in range — underneath `minimatch` 3.x, which declares
      # `^1.1.7`. Forcing 5.0.8 there breaks the dependency outright.
      # WHAT WOULD REMOVE IT: minimatch 3.x leaving the tree (it arrives via
      # `@lhci/cli` and `eslint`), or the 1.x line publishing an equivalent fix.
      # WHY IT IS ACCEPTABLE MEANWHILE: measured 2026-07-28 via `pnpm why`, 71 leaf
      # paths, every one rooted in `@lhci/cli`, `eslint` or `eslint-config-next` —
      # all three devDependencies. The one production path that existed
      # (`shadcn > ts-morph > @ts-morph/common > minimatch@10`) is closed by the
      # `brace-expansion@>=2.0.0 <=5.0.7` override. `security-auditor` reproduced
      # the closure independently: production resolves only 5.0.8.
      #
      # THE `sharp` RESIDUAL, NAMED RATHER THAN LEFT IMPLICIT. The override takes
      # sharp 0.34.5 -> 0.35.3 and `pnpm build` is green. That is evidence the
      # override does not BREAK the build; it is NOT evidence that sharp still
      # SERVES, because the build never exercises it — `next/image` is imported by
      # no file in `src/`, and `next.config.ts` has no `images` key. No app-generated
      # traffic reaches sharp; the endpoint that would (`/_next/image`) stays
      # publicly served and is deliberately outside the proxy matcher
      # (`src/proxy.ts`). sharp also sits in `pnpm.ignoredBuiltDependencies`, so its
      # install scripts do not run — independent support for the same conclusion.
      # Do not cite the green build as a runtime guarantee.
      #
      # READING THE LOG: pnpm's summary line counts the accepted advisory too, so a
      # run whose exit code is what matters still prints a non-zero high count. On
      # this tree it prints, verbatim: `Severity: 7 moderate | 5 high (1 ignored)`.
      # Judge the gate by its exit code, and risk by the Dependabot alert count —
      # never by that line.
      # `--prod` was measured and rejected AS THIS GATE'S MECHANISM, on convergence
      # alone: against the PRE-REPAIR tree it left `sharp`, `postcss`, `fast-uri`
      # and `brace-expansion` standing, so the gate would still not have gone green.
      # That reason holds and is the whole of it.
      #
      # An earlier version of this comment added that pnpm reports
      # `devDependencies: 0` for this tree, "so the dev/prod split it applies is not
      # the one `package.json` declares". **That inference was false** and is struck
      # here rather than only in the script that no longer contains the call site.
      # `metadata.devDependencies` is a COUNTER beside `metadata.dependencies`; the
      # `--prod`/`--dev` filter partitions correctly — measured 2026-07-30, `--prod`
      # narrows the graph 1110 -> 487 and yields one advisory while `--dev` yields
      # two. That matters beyond tidiness: `audit-suppression-guard.sh`'s
      # OVER-BROAD SUPPRESSION check rests on `--prod` partitioning correctly, and
      # this file is the one a reader reaches first.
      #
      # THE pnpm 9 PIN IS LOAD-BEARING FOR BOTH HALVES. pnpm 11 does not read the
      # `pnpm` field in `package.json` at all — measured on 11.17.0: "The `pnpm`
      # field in package.json is no longer read by pnpm ... ignored:
      # `pnpm.overrides`, `pnpm.auditConfig`." So on 11 neither the acceptance NOR
      # the six repairs apply. Every `pnpm/action-setup@v6` call site pins
      # `version: 9`, which is what keeps both alive. Raising that pin past 9 is a
      # MIGRATION (settings move to `pnpm-workspace.yaml`), not a version bump —
      # ADR 0065 Amendment 2026-07-28 carries it.
      #
      # THE REGISTER IS NOT THIS FILE. `auditConfig` filters `pnpm audit` — and so
      # `audit (observe-only)` in `build.yml` too — but GitHub's Dependabot alerts
      # are unaffected. That is where the 28 are counted and that is the number that
      # must reach zero. THAT GAP IS WATCHED IN PART, and not from inside this file:
      # `.github/scripts/audit-suppression-guard.sh` runs in observe-only `audit`
      # and is consulted by `security-auditor` (her audit area 8, CLAUDE.md §9.2).
      # It catches three things — a stale entry, a dead override key, and an accepted
      # advisory that has entered the production set. Beslut 6's silent pin-back is
      # NOT among them and stays open: it is not detectable from the LOCKFILE, and
      # ADR 0065 Amendment 2026-07-28 records why. Read that as scoped, not absolute
      # — the gap is unclosable for a file-only guard, which is what this one is by
      # construction; it is not a claim that no mechanism could ever see it. An
      # installed tree does exist at this call site, since `audit` runs
      # `pnpm install --frozen-lockfile` before the guard. The guard never fails a build
      # — a path-pinning assertion inside THIS control is how the next deadlock gets
      # built, since it would fail a PR over tree state the PR did not cause.
      - name: Install (pnpm, för audit)
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        working-directory: web/jobbliggaren-web
        run: pnpm install --frozen-lockfile

      - name: Blockerande pnpm vuln-gate (High/Critical)
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        working-directory: web/jobbliggaren-web
        run: pnpm audit --audit-level=high

      - name: Aktivera auto-merge (patch/minor, vuln-gate passerad)
        if: ${{ steps.gate.outputs.eligible == 'true' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
