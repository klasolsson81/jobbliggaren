# Label-baserad auto-merge för egna PRs (opt-in per PR) — Klas-GO 2026-06-07.
#
# TVÅ labels krävs, och de betyder OLIKA saker (#836, CTO-bind 2026-07-27):
#
#   automerge    = AVSIKT. "Den här PR:en ska mergas när den är klar."
#                  Sann redan vid `gh pr create`. Sätts av CC eller av
#                  PR-babysittern.
#   agents-done  = TILLSTÅND. "De obligatoriska granskarna (CLAUDE.md §9.2) har
#                  svarat och inget Blocker/Major är oåtgärdat."
#                  Sätts ENBART av sessionen som äger PR:en, efter att den
#                  faktiskt väntat in dem — ibland sex granskningsrundor senare.
#
# Auto-merge armeras först när BÅDA sitter. Workflow:t lyssnar på båda labelarna,
# så ordningen spelar ingen roll: den som sätts sist ser den andra och armerar.
#
# VARFÖR delningen finns: `automerge` bar tidigare båda betydelserna, så varje
# aktör som legitimt uttryckte AVSIKT ofrivilligt beviljade TILLSTÅND. Det hände
# på riktigt i #813 (PR #832, 2026-07-12): PR:en skapades medvetet UTAN label
# medan code-reviewer kördes, labeln sattes på PR-eventet (att det var
# babysittern är #835:s förstahandsutsaga — timeline-raden visar en
# människoidentitet, eftersom cloud-routinen autentiserar som användaren och
# loggen därför omöjligt kan visa det), PR:en auto-mergade på grön `ci`, och
# granskningen kom tillbaka med 1 Blocker + 2 Major — alla tre landade i main.
# Det hände igen i #1083 (2026-07-26).
#
# INGA TIDSSIFFROR HÄR, avsiktligt. Ett tidigare utkast skrev "labeln väntar på
# CI (~13 min) och inte på agenterna (12–18)". Mätt: `build.yml` på
# `pull_request` ligger på 14–16 min, median 15 (n=20) — så CI är ibland
# LÅNGSAMMARE än granskarna, och siffran bar alltså argumentet åt fel håll.
# Slutsatsen står på #832 och #1083, inte på en varaktighet. En tidsangivelse i
# en normativ fil blir stale vid nästa CI-ändring; regeln blir det aldrig.
# Mätningar som behöver ett hem hör i CTO-rapporten (daterad och tracked).
#
# Den avgörande egenskapen: **babysittern behöver inte ändras för att bli
# säker.** Den får fortsätta labela allt som är grönt och kan ändå inte merga
# ogranskad kod, eftersom den aldrig rör `agents-done`. Det spelar roll därför
# att den cloud-routinen är billed och user-triggered — CC kan varken läsa,
# versionera eller testa den, så en fix som vilar på dess beteende är en fix CC
# inte kan skeppa.
#
# NY PUSH AVVÄPNAR. Ett `synchronize`-event tar bort `agents-done` och stänger av
# auto-merge: granskarna svarade mot en diff som inte längre är den som mergas.
# `automerge` lämnas kvar — avsikten har inte ändrats.
#
# Säkerhet: `pull_request` (ej `pull_request_target`) → fork-PRs får read-only
# token. Required `ci` gatar fortfarande mergen via branch protection (ADR 0065).
# GitHub har INGEN per-label-behörighet, så `agents-done` är en konvention med en
# ägare, inte en spärr — designens svagaste led, namngivet i stället för gömt.
# Layer 2 (required status check `agent-review`) är Klas-ägd och stänger både det
# och den manuella "Enable auto-merge"-knappen, som detta workflow inte når.
#
# OBS: detta workflow har INGEN egen vuln-gate (till skillnad från
# dependabot-automerge.yml) — dina egna PRs är medvetet kod du själv skrivit och
# labelat; required `ci` är grinden. Ändrar du dependencies i en egen PR, väg
# audit-utfallet manuellt innan du sätter labelarna.
name: label-automerge

on:
  pull_request:
    types: [labeled, unlabeled, synchronize]

# write krävs för att GITHUB_TOKEN ska kunna aktivera/stänga av auto-merge och ta
# bort `agents-done`.
permissions:
  contents: write
  pull-requests: write

jobs:
  arm:
    name: auto-merge (arm — kräver automerge + agents-done)
    runs-on: ubuntu-latest
    # Kör bara när en av DE TVÅ labelarna precis sattes, och båda nu sitter.
    # `github.event.pull_request.labels` är PR:ens fulla label-mängd vid eventet,
    # så den som sätts sist ser den andra. Ordningen kan därför inte stranda
    # PR:en i ett halvarmerat läge.
    if: >-
      github.event.action == 'labeled' &&
      (github.event.label.name == 'automerge' || github.event.label.name == 'agents-done')
    timeout-minutes: 5
    concurrency:
      group: automerge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      # Saknad label är en NO-OP med en synlig notis, aldrig ett skippat jobb.
      # Ett skippat jobb säger inte VILKEN label som saknas, och tystnad som läses
      # som "ingenting hände" är den grammatik #861 dömde i just det här
      # subsystemet.
      - name: Rapportera om grinden inte är komplett
        if: >-
          !(contains(github.event.pull_request.labels.*.name, 'automerge') &&
            contains(github.event.pull_request.labels.*.name, 'agents-done'))
        run: |
          if [ "$HAS_AGENTS_DONE" != "true" ]; then
            echo "::notice::Armerar INTE — 'agents-done' saknas. De obligatoriska granskarna (CLAUDE.md §9.2) ska svara först; den ägande sessionen sätter labeln. (#836)"
          else
            echo "::notice::Armerar INTE — 'automerge' saknas. Sätt den när PR:en är avsedd att mergas. (#836)"
          fi
        env:
          HAS_AGENTS_DONE: ${{ contains(github.event.pull_request.labels.*.name, 'agents-done') }}

      - name: Aktivera auto-merge (eller merga direkt om PR:en redan är mergebar)
        if: >-
          contains(github.event.pull_request.labels.*.name, 'automerge') &&
          contains(github.event.pull_request.labels.*.name, 'agents-done')
        # GitHub tillåter INTE att auto-merge aktiveras på en PR som kan mergas
        # direkt ("The option to enable auto-merge is shown only on pull requests
        # that cannot be merged immediately"). Delningen flyttar armeringen till
        # EFTER att granskarna svarat, och då är `ci` ofta redan grön — CLEAN är
        # alltså inte längre undantaget (ingen varaktighet här, se huvudet).
        # Repots hela historik av det
        # här workflow:t armerade medan `ci` var pending eller grenen BEHIND, så
        # den vägen är obeprövad här. Grenen nedan är korrekt oavsett vilket
        # beteende GitHub har: vi mergar direkt bara när PR:en ÄR mergebar, och
        # branch protection (required `ci`, `enforce_admins`,
        # `required_conversation_resolution`) gatar den mergen precis som den
        # gatar auto-mergen.
        run: |
          set -euo pipefail
          state=$(gh pr view "$PR_URL" --json mergeStateStatus --jq .mergeStateStatus)
          if [ "$state" = "CLEAN" ]; then
            echo "::notice::PR:en är CLEAN — auto-merge kan inte aktiveras på en PR som redan är mergebar. Mergar direkt; branch protection är fortfarande grinden."
            gh pr merge --squash "$PR_URL"
          else
            gh pr merge --auto --squash "$PR_URL"
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  disarm:
    name: auto-merge (disarm — grinden bröts)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Två snabba `synchronize` (mätt: en PR fick två base-merges inom 7 minuter)
    # ger annars två parallella disarm-jobb och två identiska PR-kommentarer.
    concurrency:
      group: automerge-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    # TVÅ vägar, båda måste finnas för att `agents-done` ska vara en fail-safe
    # symbol: den som GER tillstånd måste också kunna ÅTERKALLA det.
    #   synchronize — ny commit ⇒ granskarna svarade mot en annan diff.
    #   unlabeled   — någon tog tillbaka en label ⇒ tillståndet är återkallat.
    # Utan `unlabeled` gör en borttagen `agents-done` ingenting: auto-merge är
    # redan aktiverat på PR-objektet och mergar på grön `ci` oavsett labelmängd.
    # Det scenariot är inte hypotetiskt — en granskare återkommer med en Blocker
    # efter att labeln satts, sessionen tar bort den för att stoppa mergen, och
    # PR:en mergar ändå. Det är #836:s incident återuppstådd GENOM kontrollen.
    if: >-
      (github.event.action == 'synchronize' &&
       contains(github.event.pull_request.labels.*.name, 'agents-done')) ||
      (github.event.action == 'unlabeled' &&
       (github.event.label.name == 'agents-done' || github.event.label.name == 'automerge'))
    steps:
      - name: Stäng av auto-merge
        # INGET `|| true`. `--disable-auto` felar när auto-merge aldrig var
        # aktiverat, men ett svalt fel här är fail-OPEN: varje annan orsak
        # (token, rate limit, nätverk) lämnar auto-merge på och PR:en mergar
        # ogranskad. Avgör tillståndet i stället för att svälja felet
        # (`build.yml`: fail loud över fail silent).
        run: |
          set -euo pipefail
          if [ -n "$(gh pr view "$PR_URL" --json autoMergeRequest --jq '.autoMergeRequest // ""')" ]; then
            gh pr merge --disable-auto "$PR_URL"
          else
            echo "::notice::auto-merge var inte aktiverat — inget att stänga av."
          fi
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ta bort agents-done (endast när en push bröt grinden)
        if: github.event.action == 'synchronize'
        run: gh pr edit "$PR_URL" --remove-label agents-done
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `always()` så att en PR aldrig avväpnas tyst: failar label-borttagningen
      # ovan är det ÄNNU viktigare att tråden säger varför auto-merge stängdes av.
      - name: Förklara i PR:en varför den avväpnades
        if: always() && github.event.action == 'synchronize'
        run: gh pr comment "$PR_URL" --body "$BODY"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: |
            **Auto-merge disabled and `agents-done` removed** — a new commit was
            pushed after the review gate had cleared, so the reviewers' answers
            apply to a diff that is no longer the one merging (#836).

            Wait the mandatory agents in against the new head, then set
            `agents-done` again. `automerge` stays — the intent has not changed.

            **Was this push from `gh pr update-branch`?** Then no line of the
            author's code changed, only the base. The gate still resets, by
            design: the reviewers answered against a different tree. It is also
            why the babysitter must not `update-branch` a PR carrying
            `agents-done` — that update belongs to the owning session
            (playbook §8).
