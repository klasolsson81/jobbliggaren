# Publishes the five container images the production stack runs (#196), and since #1238 one release
# record naming all five, which is what the box applies (ADR 0149).
#
# NO PUSH TRIGGER, AND NO DISPATCH FROM `arm` — both were considered and both are refused
# on measurement (senior-cto-advisor, 2026-08-05).
#
# `on: push: branches: [main]` never fires here: automerge merges as a GitHub App, and
# app-triggered events start no workflow runs. Measured counterfactual on #1107 (app-merged,
# zero runs) against #1108 (human-merged, run after 5 s).
#
# `repository_dispatch` from `label-automerge.yml`'s `arm` job was the obvious replacement
# and is worse than it looks. `arm` runs when the gate labels are applied, which is not when
# the merge lands: over the last 14 merged PRs, 7 of 12 gated merges landed 3.4 to 16.0
# minutes after `arm` ran. In every one of those a dispatched build would check out a `main`
# that does not contain the PR, push an identical digest, and report green — the failure
# shape `delete-merged-branches.yml`'s header condemns in this same subsystem. It cannot be
# fixed by dispatching later inside `arm` either: on the `--auto` branch the merge is
# arbitrarily later than the job, and `arm` carries `timeout-minutes: 5` against a measured
# lag reaching 956 s. And it is structurally blind to Dependabot, which merges through
# `dependabot-automerge.yml` and never touches `label-automerge.yml` — precisely the PRs
# that bump the base images going INTO these containers.
#
# So the trigger is a reconciler, which is the same answer `delete-merged-branches.yml`
# reached for the same cause: the only mechanism whose trigger survives the condition it
# exists to repair. A run for an already-released commit is a no-op apart from re-verifying
# what was released. It does NOT follow that a missed schedule self-heals on the next one:
# measure the schedule's actual delivery before relying on it — the command is in
# parallel-sessions.md §8.1, and .claude/hooks/main-ahead-of-images.sh is what notices when it
# has not.
#
# WHAT A RUN PUBLISHES (#1238). `prepare` fixes ONE commit, `github.sha`; five cells build, scan,
# push and attest one image each from exactly that tree; then `publish` — which runs only when all
# five cells succeeded — verifies all five as built from that commit, writes ONE immutable record
# naming them (`ghcr.io/klasolsson81/jobbliggaren-release:sha-<commit>`), attests it, and only then
# moves the `dev` channel to it, followed by the five `latest` tags the box's pre-#1238 consumer
# still pulls. A delayed or failed cell therefore publishes nothing a consumer follows. The decision
# logic lives in `.github/scripts/publish-release.sh` and `deploy/systemd/jobbliggaren-release-record.sh`,
# each with its own fixture suite; this file is wiring, and `attestation-publish-order-guard.sh`
# holds its order.
#
# NEVER RE-RUN A RUN FROM BEFORE #1238 — dispatch a new one. A re-run executes the workflow file of
# the original commit: per-cell `latest` moves and a checkout of the moving `main`.
#
# The owning session dispatches manually; CLAUDE.md §6.5
# already requires it to watch its PR to merge, so it is standing at the right moment.
name: release-images

on:
  schedule:
    # Hourly. Actions on standard runners costs nothing for public repositories.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      push:
        description: "Push to GHCR. Set false for a dry run that proves build, scan and tag resolution without touching the registry."
        type: boolean
        required: false
        default: true

# Nothing at workflow level: each job names what it needs. `packages: write` pushes to GHCR,
# `id-token: write` mints the OIDC token an attestation is signed against, `attestations: write`
# records it. The box refuses any image or record without one (#196, ADR 0149).
permissions: {}

concurrency:
  group: release-images
  cancel-in-progress: false

jobs:
  # ONE COMMIT FOR THE WHOLE RUN, and it is `github.sha` — the commit the
  # signing certificate names. Cosign pins that claim on the box, so an image built from any other
  # tree would fail there; the checks below make the run refuse first. Checking out the moving
  # `main` instead, as this job did until #1238, built the tip at checkout time under the trigger's
  # commit, which a merge landing between the two would have split.
  #
  # The publish decision guards against MISTAKES, not intent: a branch's copy of this file runs when
  # dispatched from that branch, and could drop the condition. The real boundary is the consumer's
  # check of the certificate's workflow, ref, repository and commit — a build from anywhere but main
  # verifies nowhere.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short: ${{ steps.resolve.outputs.short }}
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      # Inputs reach the shell as environment, never as `${{ }}` inside the script.
      - name: Publish or dry run
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          INPUT_PUSH: ${{ inputs.push }}
        run: |
          publish=false
          if [ "$EVENT" = schedule ]; then
            publish=true
          elif [ "$EVENT" = workflow_dispatch ] && [ "$INPUT_PUSH" = true ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            publish=true
          fi
          echo "publish=$publish" >>"$GITHUB_OUTPUT"
          echo "publish=$publish (event $EVENT, run from $GITHUB_REF)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - name: The tree is the commit this run names
        run: |
          if ! [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]; then
            echo "::error::prepare checked out $(git rev-parse HEAD), not $GITHUB_SHA"
            exit 1
          fi
      - name: Resolve
        id: resolve
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >>"$GITHUB_OUTPUT"

  release:
    name: ${{ matrix.name }}
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    environment: sixlabors-main-build
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: ".", file: "src/Jobbliggaren.Api/Dockerfile" }
          - { name: worker, context: ".", file: "src/Jobbliggaren.Worker/Dockerfile" }
          - { name: migrate, context: ".", file: "src/Jobbliggaren.Migrate/Dockerfile" }
          - { name: web, context: "web/jobbliggaren-web", file: "web/jobbliggaren-web/Dockerfile", needs_site_url: true }
          - { name: caddy, context: "deploy/caddy", file: "deploy/caddy/Dockerfile" }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: The tree is the commit this run names
        env:
          PREPARED: ${{ needs.prepare.outputs.sha }}
        run: |
          if ! { [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] && [ "$PREPARED" = "$GITHUB_SHA" ]; }; then
            echo "::error::this cell checked out $(git rev-parse HEAD) (prepared: $PREPARED), not $GITHUB_SHA"
            exit 1
          fi

      - name: Image name
        id: tag
        env:
          SHORT: ${{ needs.prepare.outputs.short }}
          NAME: ${{ matrix.name }}
        run: |
          echo "sha=$SHORT" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-$NAME" >> "$GITHUB_OUTPUT"

      # An undefined repository variable renders to the EMPTY STRING, not to an error, so
      # the web Dockerfile's own guard is what would fire — and it cannot know the thing to
      # set is a GitHub repository variable in this repo's settings. Named here, where the
      # operator can act on it.
      - name: Require NEXT_PUBLIC_SITE_URL
        if: matrix.needs_site_url
        run: |
          [ -n "${{ vars.NEXT_PUBLIC_SITE_URL }}" ] || {
            echo "::error::Set the repository variable NEXT_PUBLIC_SITE_URL (Settings -> Secrets and variables -> Actions -> Variables). It is inlined at build time and cannot be set at runtime." >&2
            exit 1
          }

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PINNED TO THE BOX'S VERSION, not to latest. Debian 13 ships cosign 2.5.0 and apt
      # security-maintains it; running a newer cosign here would let a bundle-format change pass
      # CI and then be refused on the box, which is the failure this whole gate exists to make
      # impossible. Drift now shows up as a red job instead of a silent hourly refusal.
      # An EXACT release tag, not `@v4`: this action publishes no floating major above v3
      # (measured 2026-08-08 — `v3` is the only `v[0-9]+` tag, while releases run to v4.1.2), so
      # `@v4` fails at "Set up job" with "unable to find version", before any step runs. Found by
      # dispatching this file rather than by reading it.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.5.0"

      # A RELEASED COMMIT IS FROZEN (#1238). Once `release:sha-<commit>` exists and proves itself —
      # read in the verify-first order, naming this commit, and this cell's recorded image verifying
      # as built from it — nothing in this cell runs: a published release's images are never rebuilt
      # or re-pointed. A record that exists and does NOT prove itself fails the cell loudly; it is
      # never overwritten (repair: deleting that version, Klas's decision).
      - name: Frozen?
        id: frozen
        if: needs.prepare.outputs.publish == 'true'
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          NAME: ${{ matrix.name }}
        run: bash .github/scripts/publish-release.sh frozen "$SOURCE_SHA" "$NAME" >>"$GITHUB_OUTPUT"

      # THE IDEMPOTENCE BELOW A RECORD, and it is what removes the trigger from the critical path:
      # an image this commit already published is reused when it verifies AS BUILT FROM THIS COMMIT —
      # the certificate's commit claim, not merely our workflow — so a re-pointed `sha-<short>` can
      # never be reused into a release. `latest` is no longer consulted: since #1238 it moves only in
      # `publish`, after the whole set.
      #
      # WHAT IT DOES NOT DO IS FAIL THIS JOB. A verifier that cannot answer sends this run down the
      # rebuild path with a `::warning::` — `publish` then verifies the rebuilt digest, blocking, so a
      # structural breakage now turns the run red there instead of rebuilding green every hour.
      - name: Skip only if this commit's image is already published and proven
        id: published
        if: steps.frozen.outputs.frozen != 'true'
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          SHORT: ${{ steps.tag.outputs.sha }}
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          # STDERR IS DISCARDED: under `2>&1` a failed lookup put the error text into the variable,
          # and two identical failures once compared equal.
          digest=$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$IMAGE:sha-$SHORT" 2>/dev/null | tr -d '"') || digest=""
          if ! [[ $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "Building: $IMAGE:sha-$SHORT does not resolve."
            exit 0
          fi
          verify_status=0
          deploy/systemd/verify-image-attestation.sh "$IMAGE@$digest" "$SOURCE_SHA" || verify_status=$?
          if [ "$verify_status" -eq 0 ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:sha-$SHORT is $digest, attested as built from $SOURCE_SHA; nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "::warning::$digest did not verify as built from $SOURCE_SHA (verifier exit $verify_status — 1: not proven, 2: could not answer) — rebuilding."
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: steps.published.outputs.already == 'false'

      # Built and LOADED, not pushed. The scan below is the gate, and a gate that runs
      # after the push is not a gate — a public image is a public CVE inventory.
      - name: Build ${{ matrix.name }}
        env:
          SIXLABORS_LICENSE_KEY: ${{ (matrix.name == 'api' || matrix.name == 'worker' || matrix.name == 'migrate') && secrets.SIXLABORS_LICENSE_KEY || '' }}
        if: steps.published.outputs.already == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          secret-envs: |
            sixlabors_license=SIXLABORS_LICENSE_KEY
          tags: ${{ steps.tag.outputs.image }}:sha-${{ steps.tag.outputs.sha }}
          # NO cache-to. `mode=min` exports only layers in the FINAL image, and every
          # expensive step here (dotnet restore/publish, pnpm install, next build, the
          # caddy compile) lives in an intermediate stage it would not export — so it
          # restored nothing while still writing five scopes. Measured 2026-08-05: the
          # repo's Actions cache is at 10.18 GiB against a 10 GB ceiling, already
          # evicting LRU, and the eviction victims are the NuGet and pnpm caches three
          # jobs in build.yml depend on. This job runs once per merged SHA; a cold build
          # is the cheaper side of that trade.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}

      # BLOCKING, and it is #196's own acceptance criterion: an image scanner in the
      # blocking gate before GHCR publishing goes live. `format: table` deliberately —
      # `sarif` ignores `exit-code` silently. No `continue-on-error`.
      - name: Trivy ${{ matrix.name }}
        if: steps.published.outputs.already == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}:sha-${{ steps.tag.outputs.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # ONE TAG HERE, AND ONLY THE IMMUTABLE ONE. `sha-<short>` names this build; every mutable
      # tag — `dev`, `latest` — moves in `publish`, after the whole set and its record are attested
      # (#1314 measured what moving `latest` before the attestation costs; #1238 what moving it per
      # cell costs). A dry run or a run that may not publish never pushes.
      - name: Push ${{ matrix.name }}
        id: push
        if: steps.published.outputs.already == 'false' && needs.prepare.outputs.publish == 'true'
        env:
          NAME: ${{ matrix.name }}
          SHORT: ${{ steps.tag.outputs.sha }}
        run: |
          bash .github/scripts/publish-release.sh push "$NAME" "$SHORT" >>"$GITHUB_OUTPUT"

      # WITHOUT THIS THE BOX REFUSES EVERY IMAGE, by design — it treats an absent attestation exactly
      # like a bad one. `push-to-registry` writes the bundle to GHCR under the referrers tag scheme,
      # which is where both the box and the checks in this file read it from; GHCR does not implement
      # the OCI referrers API endpoint, and the tag scheme is what makes discovery work anyway.
      - name: Attest ${{ matrix.name }}
        id: attest
        if: steps.push.outcome == 'success' && steps.push.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.tag.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # THE FAN-IN (#1238, ADR 0149). Runs only when all five cells succeeded — `needs` with the implicit
  # `success()` is what makes a delayed or failed cell structurally harmless: nothing below runs, so
  # nothing a consumer follows moves. Four steps, in an order `attestation-publish-order-guard.sh`
  # pins: write (or prove) the record → attest it → verify it, blocking → only then move tags.
  publish:
    needs: [prepare, release]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      # FULL HISTORY: the record's sequence is the commit count of its source, and releases are
      # ordered by ancestry in this clone — a shallow clone would make both meaningless, and the record
      # tool refuses one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - name: The tree is the commit this run names
        env:
          PREPARED: ${{ needs.prepare.outputs.sha }}
        run: |
          if ! { [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] && [ "$PREPARED" = "$GITHUB_SHA" ]; }; then
            echo "::error::the fan-in checked out $(git rev-parse HEAD) (prepared: $PREPARED), not $GITHUB_SHA"
            exit 1
          fi

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.5.0"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # A released commit is proven again (its record and all five recorded images, against the
      # commit); otherwise the five `sha-<short>` images are verified as built from the commit and a
      # new record is pushed under a PENDING tag. The immutable `sha-<commit>` name
      # is created only in `advance`, after the record's own attestation verifies.
      - name: Record
        id: record
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
        run: bash .github/scripts/publish-release.sh record "$SOURCE_SHA" >>"$GITHUB_OUTPUT"

      - name: Attest the record
        id: attest
        if: steps.record.outputs.attest == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.record.outputs.repo }}
          subject-digest: ${{ steps.record.outputs.digest }}
          push-to-registry: true

      # BLOCKING, with a bounded retry. Measured 2026-10-03 over 120 runs and 334 publishes: an
      # attestation was readable from the registry the moment the attest step returned, every time —
      # the evidence the pre-#1238 probe was collecting before it could become a gate. Reads the
      # record through the box's own read function, so every run exercises that path end to end.
      - name: Verified
        id: verified
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          RECORD_DIGEST: ${{ steps.record.outputs.digest }}
        run: bash .github/scripts/publish-release.sh verify "$RECORD_DIGEST" "$SOURCE_SHA"

      - name: Advance
        id: advance
        if: steps.verified.outcome == 'success'
        env:
          SOURCE_SHA: ${{ needs.prepare.outputs.sha }}
          RECORD_DIGEST: ${{ steps.record.outputs.digest }}
        run: bash .github/scripts/publish-release.sh advance "$RECORD_DIGEST" "$SOURCE_SHA"
