# Publishes the five container images the production stack pulls (#196).
#
# NO PUSH TRIGGER, AND NO DISPATCH FROM `arm` — both were considered and both are refused
# on measurement (senior-cto-advisor, 2026-08-05).
#
# `on: push: branches: [main]` never fires here: automerge merges as a GitHub App, and
# app-triggered events start no workflow runs. Measured counterfactual on #1107 (app-merged,
# zero runs) against #1108 (human-merged, run after 5 s).
#
# `repository_dispatch` from `label-automerge.yml`'s `arm` job was the obvious replacement
# and is worse than it looks. `arm` runs when the gate labels are applied, which is not when
# the merge lands: over the last 14 merged PRs, 7 of 12 gated merges landed 3.4 to 16.0
# minutes after `arm` ran. In every one of those a dispatched build would check out a `main`
# that does not contain the PR, push an identical digest, and report green — the failure
# shape `delete-merged-branches.yml`'s header condemns in this same subsystem. It cannot be
# fixed by dispatching later inside `arm` either: on the `--auto` branch the merge is
# arbitrarily later than the job, and `arm` carries `timeout-minutes: 5` against a measured
# lag reaching 956 s. And it is structurally blind to Dependabot, which merges through
# `dependabot-automerge.yml` and never touches `label-automerge.yml` — precisely the PRs
# that bump the base images going INTO these containers.
#
# So the trigger is a reconciler, which is the same answer `delete-merged-branches.yml`
# reached for the same cause: the only mechanism whose trigger survives the condition it
# exists to repair. The build is SHA-idempotent, so an extra trigger costs one manifest lookup.
# It does NOT follow that a missed schedule self-heals on the next one: measure the schedule's
# actual delivery before relying on it — the command is in parallel-sessions.md §8.1, and
# .claude/hooks/main-ahead-of-images.sh is what notices when it has not.
#
# The owning session dispatches manually when it wants the image now; CLAUDE.md §6.5
# already requires it to watch its PR to merge, so it is standing at the right moment.
name: release-images

on:
  schedule:
    # Hourly. A no-op run is a checkout and two manifest lookups per image — cheap rather
    # than free, and free in billing terms because Actions on standard runners costs
    # nothing for public repositories.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build. Defaults to main; set it to prove a change to this workflow before it is on main."
        required: false
        default: main
      push:
        description: "Push to GHCR. Set false for a dry run that proves build, scan and tag resolution without touching the registry."
        type: boolean
        required: false
        default: true

# `packages: write` is what pushing to GHCR needs; nothing here writes to the repository.
# `id-token: write` mints the OIDC token the provenance attestation is signed against, and
# `attestations: write` is what records it. The box refuses any image without one (#196).
permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-images
  cancel-in-progress: false

jobs:
  # ONE SHA FOR THE WHOLE RUN. Each cell used to check out `main` itself, so a merge
  # landing between two cells starting gave different `sha-<short>` to different images in
  # the same run — and the box pins ONE tag for all five in its .env. Three would exist,
  # two would not, and the deploy would fail or fall back to `latest` and get a mixed set.
  # Resolving once also makes a re-run of the same run-ID reproducible, which it was not.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short: ${{ steps.resolve.outputs.short }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || 'main' }}
      - id: resolve
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  release:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: api, context: ".", file: "src/Jobbliggaren.Api/Dockerfile" }
          - { name: worker, context: ".", file: "src/Jobbliggaren.Worker/Dockerfile" }
          - { name: migrate, context: ".", file: "src/Jobbliggaren.Migrate/Dockerfile" }
          - { name: web, context: "web/jobbliggaren-web", file: "web/jobbliggaren-web/Dockerfile", needs_site_url: true }
          - { name: caddy, context: "deploy/caddy", file: "deploy/caddy/Dockerfile" }

    steps:
      # The SHA `prepare` resolved, not the triggering ref. The build answers "what was on
      # main when this run started" — one answer for all five cells — which is what makes
      # re-running harmless and a missed trigger recoverable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Image name
        id: tag
        run: |
          echo "sha=${{ needs.prepare.outputs.short }}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      # An undefined repository variable renders to the EMPTY STRING, not to an error, so
      # the web Dockerfile's own guard is what would fire — and it cannot know the thing to
      # set is a GitHub repository variable in this repo's settings. Named here, where the
      # operator can act on it.
      - name: Require NEXT_PUBLIC_SITE_URL
        if: matrix.needs_site_url
        run: |
          [ -n "${{ vars.NEXT_PUBLIC_SITE_URL }}" ] || {
            echo "::error::Set the repository variable NEXT_PUBLIC_SITE_URL (Settings -> Secrets and variables -> Actions -> Variables). It is inlined at build time and cannot be set at runtime." >&2
            exit 1
          }

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # THE IDEMPOTENCE, and it is what removes the trigger from the critical path: if this
      # SHA is already published there is nothing to do, so a missed schedule self-heals and
      # an extra trigger costs a lookup.
      #
      # BOTH TAGS MUST AGREE, not just the immutable one. Keyed on `sha-` alone, a run
      # where `docker push sha-X` succeeded and `docker push latest` failed would be
      # skipped forever after: `latest` would point at the previous SHA indefinitely while
      # every run reported green, and `latest` is what an unpinned reconcile pulls. That is
      # the green-silent-inert shape this file's own header condemns.
      #
      # Any failure to read either digest resolves to `already=false`, i.e. build and push.
      # The reason is logged rather than swallowed: a permanent auth or CLI breakage would
      # otherwise look identical to normal operation while rebuilding five images hourly.
      # PINNED TO THE BOX'S VERSION, not to latest. Debian 13 ships cosign 2.5.0 and apt
      # security-maintains it; running a newer cosign here would let a bundle-format change pass
      # CI and then be refused on the box, which is the failure this whole gate exists to make
      # impossible. Drift now shows up as a red job instead of a silent hourly refusal.
      # An EXACT release tag, not `@v4`: this action publishes no floating major above v3
      # (measured 2026-08-08 — `v3` is the only `v[0-9]+` tag, while releases run to v4.1.2), so
      # `@v4` fails at "Set up job" with "unable to find version", before any step runs. Found by
      # dispatching this file rather than by reading it.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.5.0"

      # A THIRD CONDITION SINCE #196's ATTESTATION REPAIR: the attestation must exist too.
      # What it catches is an attestation that was readable when it was published and is not
      # readable now — deleted, expired, or unreachable in GHCR's referrers. It no longer has
      # to catch a failed attest step: `latest` is published after `Attest` succeeds, so that
      # run leaves the two tags disagreeing and the next run rebuilds on the first condition.
      #
      # AND IT IS MEASURED IN THE REGISTRY, NOT THROUGH THE ATTESTATIONS API. The box reads the
      # bundle from GHCR's referrers; an attestation that exists in the API but not in the
      # registry would satisfy an API check while the box refuses forever — the same defect one
      # layer up. So the predicate calls the SAME script the box calls: it measures the layer
      # that matters, and the presence is proven where a failure has a reader.
      #
      # WHAT IT DOES NOT DO IS FAIL THIS JOB. A verifier that cannot answer sends this run down
      # the rebuild path with a `::warning::` and exit 0, so a structural breakage — cosign
      # gone, bundle format moved, GHCR referrers unreadable — rebuilds five images every hour,
      # green, for as long as it lasts. That is deliberate (the alternative is a red publish
      # pipeline on every transient registry hiccup) but it is NOT a drift alarm, and this
      # comment previously claimed it was. The cosign version here is pinned to the box's, which
      # ISOLATES CI from the box's drift rather than exposing it; a divergence between them
      # surfaces on the box, in the journal, and #1175 is why that has no reader yet.
      - name: Skip only if both tags agree AND the attestation is readable from the registry
        id: published
        run: |
          img="${{ steps.tag.outputs.image }}"
          # STDERR IS DISCARDED HERE, WHICH IS A CHANGE FROM THE ORIGINAL AND IS THE POINT.
          # Under `2>&1` a failed lookup put the error text INTO the variable, so two identical
          # failures compared equal, `already=true` followed, and the tag pair was declared
          # settled on the strength of two error messages. The reason for a failure is no longer
          # captured, and that trade is deliberate: an unexplained rebuild is recoverable, a
          # permanent skip on two matching errors is not. (`|| x=""` is retained for readers;
          # Actions runs `bash -e {0}` without pipefail, so the pipe already returns `tr`'s
          # status and the fallback never fires.)
          sha_digest=$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$img:sha-${{ steps.tag.outputs.sha }}" 2>/dev/null | tr -d '"') || sha_digest=""
          latest_digest=$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' "$img:latest" 2>/dev/null | tr -d '"') || latest_digest=""
          if [ -z "$sha_digest" ] || [ "$sha_digest" != "$latest_digest" ]; then
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "Building. sha-tag digest: [$sha_digest] latest digest: [$latest_digest]"
            exit 0
          fi
          # Captured into a variable rather than read from `$?` inside a branch: `$?` is the
          # status of the last command run, which any added line silently changes. The repo has
          # measured that class twice (a pipe's status read as a tool's), so the code is written
          # so a later edit cannot introduce it.
          verify_status=0
          deploy/systemd/verify-image-attestation.sh "$img@$sha_digest" || verify_status=$?
          if [ "$verify_status" -eq 0 ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "Both tags resolve to $sha_digest and it carries a verifiable attestation; nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            # 1 is "no attestation", 2 is "could not answer", and this branch takes both. The
            # message reports which, because naming "missing attestation" during a TUF outage
            # would put a false cause in the log beside the verifier's own honest one.
            echo "::warning::$sha_digest is published under both tags but did not verify (verifier exit $verify_status — 1: no attestation, 2: could not answer) — rebuilding. The box applies the same predicate, so it would refuse this image."
          fi

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
        if: steps.published.outputs.already == 'false'

      # Built and LOADED, not pushed. The scan below is the gate, and a gate that runs
      # after the push is not a gate — a public image is a public CVE inventory.
      - name: Build ${{ matrix.name }}
        if: steps.published.outputs.already == 'false'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: ${{ steps.tag.outputs.image }}:sha-${{ steps.tag.outputs.sha }}
          # NO cache-to. `mode=min` exports only layers in the FINAL image, and every
          # expensive step here (dotnet restore/publish, pnpm install, next build, the
          # caddy compile) lives in an intermediate stage it would not export — so it
          # restored nothing while still writing five scopes. Measured 2026-08-05: the
          # repo's Actions cache is at 10.18 GiB against a 10 GB ceiling, already
          # evicting LRU, and the eviction victims are the NuGet and pnpm caches three
          # jobs in build.yml depend on. This job runs once per merged SHA; a cold build
          # is the cheaper side of that trade.
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}

      # BLOCKING, and it is #196's own acceptance criterion: an image scanner in the
      # blocking gate before GHCR publishing goes live. `format: table` deliberately —
      # `sarif` ignores `exit-code` silently. No `continue-on-error`.
      - name: Trivy ${{ matrix.name }}
        if: steps.published.outputs.already == 'false'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.tag.outputs.image }}:sha-${{ steps.tag.outputs.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      # ONE TAG HERE, AND THAT IS THE WHOLE POINT OF THE SPLIT. `sha-<short>` is the rollback
      # handle the box pins in its `.env`; `latest` is what an unpinned reconcile pulls, and it
      # is published further down, only once the attestation exists. Publishing both here is
      # what put an unattested image on `latest` for 56 minutes on 2026-08-11 (#1314): the
      # `Attest` step failed after this step had already moved the tag, so the box pulled an
      # image it then refused, hourly, until a later run rebuilt it.
      # THE REF CONDITION IS A SECURITY GATE, NOT TIDINESS. Without it a `workflow_dispatch`
      # with `ref: <some-branch>` builds that branch's tree, pushes it as `latest`, and — since
      # the attestation below binds WHO built the image, never WHICH TREE was built — attests it
      # under an identity the box accepts. The box would verify and deploy a branch. Attestation
      # cannot close this; only the push condition can. The dry-run purpose is untouched:
      # proving a build never required pushing it.
      - name: Push ${{ matrix.name }}
        id: push
        if: steps.published.outputs.already == 'false' && (github.event_name != 'workflow_dispatch' || (inputs.push && (inputs.ref == 'main' || inputs.ref == '')))
        run: |
          docker push "${{ steps.tag.outputs.image }}:sha-${{ steps.tag.outputs.sha }}"
          # The registry manifest digest, which only exists after the push — `load: true` means
          # build-push-action never produced one. `{{json .Manifest.Digest}}` deliberately: the
          # bare template silently falls back to the full pretty output on Docker 29 (measured
          # 2026-08-08), which would feed a paragraph of text to the attest action as a digest.
          digest=$(docker buildx imagetools inspect --format '{{json .Manifest.Digest}}' \
            "${{ steps.tag.outputs.image }}:sha-${{ steps.tag.outputs.sha }}" | tr -d '"')
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::could not resolve a manifest digest after push: [$digest]"; exit 1 ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # WITHOUT THIS THE BOX REFUSES EVERY IMAGE, by design — the reconcile wrapper treats an
      # absent attestation exactly like a bad one. `push-to-registry` writes the bundle to GHCR
      # under the referrers tag scheme, which is where both the box and the skip predicate above
      # read it from; GHCR does not implement the OCI referrers API endpoint, and the tag scheme
      # is what makes discovery work anyway.
      #
      # The attestation binds to the DIGEST, so moving `latest` onto that digest afterwards
      # neither invalidates it nor needs a second attestation: the tag is a name for the same
      # manifest the bundle already covers.
      - name: Attest ${{ matrix.name }}
        id: attest
        if: steps.push.outcome == 'success' && steps.push.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.tag.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # `latest` MOVES LAST, AND ONLY OVER AN ATTESTED DIGEST. This is the ordering the box's
      # trust chain assumes and did not have: the reconcile unit pulls `latest`, verifies it,
      # and refuses the whole apply if it does not verify — so a `latest` that can point at an
      # unattested image is a self-inflicted outage, not a caught intrusion.
      #
      # THE GUARD NAMES THE ATTEST STEP RATHER THAN RELYING ON THE JOB'S STATUS. A skipped
      # `Push` (a dry-run dispatch) leaves the job successful, so a bare `if:` — which inherits
      # the implicit `success()` — would publish `latest` from a build deliberately not pushed.
      # `steps.attest.outcome == 'success'` is true in exactly one case: the attestation ran and
      # succeeded. Failure and skip both leave `latest` where it was.
      #
      # WHEN THIS STEP DOES NOT RUN, `latest` KEEPS POINTING AT THE PREVIOUS ATTESTED DIGEST.
      # The box pulls that, verifies it, and applies it — stale but serving, and silent, which
      # is the right shape for a fault that lies with the publisher rather than the image.
      # The next run sees the two tags disagree and rebuilds; the repair path is unchanged.
      #
      # THE RESIDUAL IS REAL AND IS NAMED HERE RATHER THAN PRETENDED AWAY. `sha-<short>` is
      # published before the attestation exists, so between the push above and the attest above
      # — and permanently, if the attest fails — that tag can resolve to a publicly pullable
      # image carrying no attestation. It is fail-closed at the consumer: the box verifies
      # whatever it pulls, so even a rollback that pins such a `sha-` tag is refused rather than
      # applied. Closing it entirely would need a staging repository, which buys nothing the
      # consumer-side gate does not already provide.
      - name: Publish latest ${{ matrix.name }}
        if: steps.attest.outcome == 'success'
        run: |
          # A NON-BLOCKING PROBE, deliberately not a gate. `steps.attest.outcome` says the
          # attest action reported success; it does not say the bundle is readable from GHCR's
          # referrers, which is where the box reads it. Gating on that would put an UNMEASURED
          # dependency on referrer propagation into the publish path — #1314 measured
          # push-to-attest at 3-5 s but never measured attest-to-readable, and that unknown is
          # the whole reason this PR exists. So it is measured rather than enforced: every
          # publish records whether the producer can already read what the consumer will read.
          # If these warnings never appear the gate is safe to add; if they do, the window's
          # size comes from data instead of a guess. It never fails the step.
          probe_status=0
          deploy/systemd/verify-image-attestation.sh \
            "${{ steps.tag.outputs.image }}@${{ steps.push.outputs.digest }}" >/dev/null 2>&1 || probe_status=$?
          if [ "$probe_status" -ne 0 ]; then
            echo "::warning::attestation for ${{ steps.push.outputs.digest }} is not yet readable from the registry (verifier exit $probe_status). Publishing latest anyway; the box re-verifies on every reconcile."
          fi
          docker tag "${{ steps.tag.outputs.image }}:sha-${{ steps.tag.outputs.sha }}" \
                     "${{ steps.tag.outputs.image }}:latest"
          docker push "${{ steps.tag.outputs.image }}:latest"
