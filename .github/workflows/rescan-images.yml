# Rescans the five PUBLISHED images against today's advisory database (#1519).
#
# THE DEFECT THIS CLOSES. `release-images.yml` skips Build, Trivy AND Push whenever the current
# `main` SHA is already published under both tags with a readable attestation. That skip is
# deliberate, well argued, and NOT CHANGED BY THIS FILE. Its unnamed consequence was that a
# published image is never rescanned: no GitHub Actions event fires on a published advisory
# (measured 2026-08-28 — neither `security_advisory`, `repository_advisory` nor
# `repository_vulnerability_alert` is an `on:` event), Dependabot has nothing to propose for a
# floating base tag such as `caddy:2-alpine` or `node:22-alpine` (`.github/dependabot.yml`
# records that those tags carry no version to compare, and separately that GitHub runs no
# security updates for the docker ecosystem at all), and so the only event producing a new image
# was a merge to `main` for some unrelated reason. Patch latency on the only internet-facing
# process in the stack had no ceiling, and merge cadence is not a security control.
#
# DETECT, DO NOT REPAIR (senior-cto-advisor, 2026-08-28). The repair lever already exists and
# always did: a merge yields a new SHA, the release predicate goes false, the image is rebuilt
# and scanned and pushed, and the box pulls it within the hour. What was missing was never the
# repair, it was the KNOWLEDGE. A detection defect is repaired with a detector.
#
# THE THREE ALTERNATIVES WERE MEASURED AND REFUSED, and they are written out so this is not
# re-litigated from scratch. (1) An AGE TERM that rebuilds a stale-but-unchanged SHA re-points
# `sha-<short>`, which `release-images.yml` defines as the rollback handle the box pins in its
# `.env` — a handle that means two digests at two times is a rollback that does not roll back —
# and it turns the hourly timer into an unattended production deploy of an image no human asked
# for. (2) ALWAYS BUILD AND SCAN, PUSH ON CHANGE scans a freshly built image rather than the
# published artefact, so a green scan says nothing about what the box actually runs. (3) The
# HYBRID (scan, and let a red scan force a rebuild) inherits both of (1)'s worst properties and
# adds a loop: after such a rebuild `latest` no longer equals `sha-<short>`, so the next hourly
# run sees `already=false` and rebuilds again, forever, until a new tag scheme is designed.
#
# WHY ITS OWN FILE RATHER THAN A STEP IN `release-images.yml`, and the first reason is the one
# that matters: PRIVILEGE. This workflow can read the registry and nothing else. A detector that
# cannot push cannot be edited into a publisher, and that property is structurally impossible for
# a job that shares a file with the publish path. The second is failure isolation — inside
# `release-images.yml` a red scan of the OLD published digest would fail the job before its Push
# step, so an old advisory would block exactly the merge that was going to fix it.
#
# THE INTENDED READER IS THE SCHEDULED-RUN NOTIFICATION, AND THAT LAST LINK IS NOT YET MEASURED.
# "Notifications for scheduled workflows are sent to the user who initially created the workflow",
# and on a cron-syntax change to whoever changed it (GitHub Docs, read 2026-08-28). Who that
# resolves to here is open: automerge lands this file on `main` as a GitHub App squash commit
# (`release-images.yml`'s header carries the measurement that app-triggered events start no
# workflow runs at all), the author is preserved as the repository owner while the committer is
# the App, and GitHub does not document which of the two it attributes. `permissions: contents:
# read` means no other step can raise an alarm if the mail goes nowhere, so a detector nobody
# reads would be the green-silent-inert shape one level up from the one this file closes.
# Owed: one red run, observed. Until then this paragraph states an intent, not a fact.
#
# The cadence below is DAILY and not hourly for the same reader: the floor is Trivy's database,
# rebuilt every six hours (trivy-db README, read 2026-08-28), but the binding constraint is
# tolerance. Twenty-four red mails a day destroys whatever reader there turns out to be.
#
# THIS WORKFLOW IS NEVER ADDED TO `ci`'s `needs`, AND IT STRUCTURALLY CANNOT BE. `needs:` does not
# reach across workflow files, so the only route into the required set is branch protection — and
# a scheduled workflow never runs on a pull request, so that required check would block every PR
# forever within the hour. The deadlock would be immediate and visible rather than quiet. Written
# out because it is a stronger guarantee than an instruction not to do it.
name: rescan-images

on:
  schedule:
    # Daily. Minute 5 rather than 17 so this does not start in the same minute as
    # `release-images.yml`, and not 0 because the top of the hour is the busiest slot on shared
    # runners.
    - cron: "5 5 * * *"
  workflow_dispatch:

# READ ONLY, AND THE ABSENCES ARE THE POINT. No `packages: write`, no `id-token: write`, no
# `attestations: write` — this workflow cannot publish, tag, or attest anything, by construction
# rather than by intent. (The packages are public today, measured 2026-08-28 with an anonymous
# probe, so `packages: read` is belt over braces; anonymous readability is a measurement of the
# current setting, not a contract.)
permissions:
  contents: read
  packages: read

concurrency:
  group: rescan-images
  cancel-in-progress: false

jobs:
  # WHAT IS SCANNED IS RESOLVED ONCE, FROM `release-images.yml`'s OWN MATRIX. The five image
  # names already exist in `build.yml`, `release-images.yml`, `deploy/docker-compose.yml` and the
  # reconcile allowlist; a sixth copy here would be a sixth thing to keep in step. So this job
  # declares nothing and asks the script, whose fixture suite runs in the blocking `scripts` job
  # of `build.yml` — including a case that reads the REAL `release-images.yml`, so a respelling
  # of that matrix turns red at PR time rather than by silently shortening this matrix at 05:05.
  resolve:
    name: resolve published digests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve
        id: resolve
        run: |
          set -euo pipefail
          # `bash <path>`, not `./<path>`, and that is deliberate. Most scripts under
          # `.github/scripts/` are committed 100644 and every caller invokes them this way, which
          # is mode-blind. Nothing gates the exec bit in that directory the way `build.yml` gates
          # it for `deploy/systemd`, so depending on it here would be a 126/Permission-denied
          # waiting for the first checkout that did not preserve it. Count them with
          # `git ls-files -s .github/scripts/` rather than trusting a number written here.
          #
          # THE STATUS IS CAPTURED, NOT PIPED. An earlier version ended `| tee rows.tsv`, which
          # makes `$?` the status of `tee` — the exact class this repo has measured twice (see
          # `release-images.yml`'s note on reading a pipe's status as a tool's). It also collapsed
          # the script's two failure modes into one silent job failure.
          rc=0
          bash .github/scripts/resolve-published-digests.sh >rows.tsv || rc=$?
          if [ "$rc" -ne 0 ]; then
            # The distinction survives only if something carries it: stderr has the reason, but
            # the annotation is what reaches the run summary, and the run summary is what the one
            # reader sees. `release-images.yml` applies the same rule to its own 1-vs-2 branch.
            echo "::error::resolver exited $rc (1: the matrix lost legs, 2: could not answer). Nothing was scanned — this is NOT 'the images are clean'."
            exit "$rc"
          fi

          # `jq -Rn` with `inputs` reads each line as a raw string; without -R the tab-separated
          # rows would be parsed as JSON and every line would fail.
          matrix=$(jq -Rn -c '[inputs | split("\t") | {name: .[0], ref: .[1], created: .[2]}]' < rows.tsv)

          # THE CONSUMER CHECKS THE SHAPE TOO, because the contract crosses a serialisation
          # boundary and a producer trusted across one is how drift goes quiet. A null `.ref`
          # renders as an empty `image-ref`, and `trivy image ""` is not reliably red — the same
          # green no-op the resolver exists to prevent, reintroduced one file later.
          printf '%s' "$matrix" | jq -e '
            length > 0
            and all(.[]; .name and .created
                         and ((.ref // "") | test("^ghcr\\.io/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$")))
          ' >/dev/null \
            || { echo "::error::the resolved matrix is empty or its rows are not the agreed shape"; exit 1; }

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  scan:
    name: rescan ${{ matrix.image.name }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      # One vulnerable image must not hide the state of the other four.
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # THE AGE IS REPORTED AND IS NEVER A PREDICATE. An image is not stale because it is old,
      # it is stale because an advisory with a published fix now matches it — which is what the
      # step below measures directly. This line exists so a red run reads "this artefact was
      # built on <date> and now carries CVE-X", the sentence that makes the notification
      # actionable, instead of leaving the reader to work out which image is being complained
      # about and how long it has been running.
      #
      # THE VALUES ARRIVE AS `env:`, NEVER AS `${{ }}` INSIDE THE SCRIPT. Expression
      # interpolation is textual and happens before bash sees the line, so registry-supplied
      # content in a `run:` block is a script-injection source — a `$(...)` in it executes, with
      # `GITHUB_TOKEN` already in `~/.docker/config.json` from the login above. `created` is the
      # only value in this workflow that originates outside the repository. It is now
      # shape-checked at the producer as well; this is the other half of the same repair, and
      # either half alone would leave the pattern here for the next value to reuse.
      - name: What is being scanned
        env:
          IMAGE_NAME: ${{ matrix.image.name }}
          IMAGE_REF: ${{ matrix.image.ref }}
          IMAGE_CREATED: ${{ matrix.image.created }}
        run: |
          echo "image:   $IMAGE_NAME"
          echo "ref:     $IMAGE_REF"
          echo "built:   $IMAGE_CREATED"
          echo "This is the PUBLISHED artefact, pinned by digest, not a rebuild of it."

      # THE PARAMETERS ARE IDENTICAL TO BOTH EXISTING SCANS, and the parity IS the claim: this
      # artefact would not pass today the gate it passed when it was built. Changing `severity`
      # or `ignore-unfixed` here without changing them in `build.yml` and `release-images.yml`
      # would make that sentence false. `format: table` deliberately — `sarif` ignores
      # `exit-code` silently. No `continue-on-error`: a detector that cannot go red is not one.
      #
      # The ref is digest-pinned, which also closes the TOCTOU between resolving and scanning —
      # the same argument `jobbliggaren-reconcile.sh` makes for its own `--pull never`.
      - name: Trivy ${{ matrix.image.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image.ref }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
