# gitleaks config — extends the default ruleset (does NOT replace it).
[extend]
useDefault = true

# False positive: the retired integration-test password (not a real secret). No file carries it
# since ADR 0142 part 5a (#1743), but the pre-push scan reads the whole git history, where it stays.
# Global allowlist keyed on the secret VALUE (SHA-independent) so it survives
# history rewrites and the JobbPilot→Jobbliggaren rename. This supersedes the
# SHA-keyed .gitleaksignore (whose fingerprints break on every history rewrite).
[[allowlists]]
description = "Retired integration-test password T3stlosen123456 — git history only, not a real secret"
regexes = ['''T3stlosen123456''']
