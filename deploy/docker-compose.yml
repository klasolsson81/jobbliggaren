# Jobbliggaren production stack — Netcup RS 1000 G12 (x86, 4 cores, 8 GB).
# ADR 0050 + its `Amendment 2026-08-04`; capacity table in ADR 0122.
#
# Selected BY PATH, never by COMPOSE_FILE in the box's .env:
#
#   docker compose -f /opt/jobbliggaren/deploy/docker-compose.yml pull
#   docker compose -f /opt/jobbliggaren/deploy/docker-compose.yml up -d
#
# COMPOSE_FILE overrides a project's own file resolution, and the compose guard is
# structurally blind to it (#1217) — a green guard would then vouch for a file the
# deploy does not run.
#
# Only `caddy` publishes, and it publishes WIDE on 80/443. That is not an oversight
# in the loopback rule: ACME HTTP-01 arrives on 80 and TLS-ALPN-01 on 443, both from
# the public internet, so a loopback-bound reverse proxy means no certificate and no
# site (ADR 0050 Amendment 2026-08-04 §5, gate M-5b). Every other service publishes
# nothing at all — under Option B the API is not edge-exposed and is reached only over
# the internal network. `.github/scripts/compose-edge-publish-guard.sh` is the gate on
# exactly that shape.
#
# Database and edge-gate credentials come from `deploy/.env` on the box (root-owned,
# chmod 600, never committed). Every one is a hard `:?` requirement — compose refuses to
# start without it.
#
# The four CRYPTO values are not among them: since #198 they are files on tmpfs, never
# environment values and never in `.env` (gate B-1 — see the x-app-secrets anchor).

name: jobbliggaren-prod

# Container logs are capped here rather than left to the daemon default, and since #1175 this
# is the LAST-RESORT BUFFER of three layers rather than the store. The three, and what is MEANT
# to bound each: the seq service below (queryable, box-local, a retention policy set BY HAND
# inside Seq — Seq exposes no configuration surface for it, so this file cannot carry it, and
# the DURATION is deliberately not written here either: it decays, and it has one home);
# the `hostlogs/` prefix jobbliggaren-logship.service ships to (off-box, encrypted, bounded by
# a lifecycle rule that is NOT yet created); and this — bounded by VOLUME and by nothing else.
#
# WHETHER EITHER OF THE FIRST TWO IS IN FORCE IS A MEASUREMENT, NOT A PROPERTY OF THIS FILE, and
# it has one home: log-sink.md §4. Read that row before treating either as a bound; why this line
# stopped asserting it is ADR 0024's Amendment 2026-08-23 (#1170).
# A quiet container still keeps its 30 MB for months, so retention time here stays undefined.
# Demoting this layer is what finally makes a smaller max-size defensible, but the number
# needs a write rate. The box's daemon config sets the same 10m x 3; this makes the artefact
# carry it too, for anyone running the stack elsewhere.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# THE FOUR CRYPTO VALUES ARE FILES, NOT ENVIRONMENT VALUES (#198, gate B-1).
#
# A container's environment is persisted by Docker in its own on-disk state, and
# `docker inspect` returns it even after the container has exited — measured on the box
# 2026-08-05 (#1240). That was one of B-1's two plaintext-on-disk surfaces; `deploy/.env`
# was the other. What travels below is a PATH, and a path is not a secret.
#
# The files live on /run (tmpfs, RAM-backed) and are written by the operator after each
# boot — there is no encrypted-at-rest copy anywhere on this disk, deliberately: with no
# TPM on this host (measured 2026-08-09: `systemd-analyze has-tpm2` = partial, no /dev/tpm0),
# a sealed blob and its unsealing key would travel in the same disk snapshot, which is
# obfuscation rather than encryption. See docs/runbooks/master-key-ops.md.
#
# The peppers ride the same mechanism, and that is defence in depth rather than a gate
# requirement: B-1 names the master key alone. They travel because the anchor below exists
# so api/worker cannot diverge, and splitting one value out would leave that guarantee
# spread across two mechanisms. A shared read-only mount makes divergence impossible at a
# stronger level than YAML did: both containers read the same inode.
#
# The four values MUST be byte-identical between api and worker: both hosts validate them
# at startup (ValidateOnStart in the Infrastructure DI they share), and data written under
# one value is unreadable under another.
x-app-secrets: &app-secrets
  FieldEncryption__Provider: Local
  FieldEncryption__LocalMasterKeyBase64_FILE: /run/app-secrets/FieldEncryption__LocalMasterKeyBase64
  # Key identity, not a secret — the re-wrap operation's idempotency marker (#198, M-3).
  # It travels as a file with the key bytes on purpose: identity and bytes change at the
  # same instant for the same reason, so the pair is written atomically by one script.
  FieldEncryption__LocalMasterKeyId_FILE: /run/app-secrets/FieldEncryption__LocalMasterKeyId
  AuditPseudonymization__PepperBase64_FILE: /run/app-secrets/AuditPseudonymization__PepperBase64
  CompanyWatchPseudonymization__PepperBase64_FILE: /run/app-secrets/CompanyWatchPseudonymization__PepperBase64
  CvReviewFingerprintPseudonymization__PepperBase64_FILE: /run/app-secrets/CvReviewFingerprintPseudonymization__PepperBase64

# Read-only, and the SAME host directory for every service that gets it — see the anchor
# above. The
# host path is a literal, deliberately NOT a ${...:?} variable: a new hard requirement
# would make the hourly reconcile refuse the entire apply until the operator had filled it
# in, with `systemctl --failed` as the only reader (deploy/systemd/jobbliggaren-reconcile.sh).
#
# THE DIRECTORY MUST EXIST BEFORE THE FIRST `up`, and nothing here enforces that. Measured:
# this mount carries `create_host_path: true`, so if /etc/tmpfiles.d/jobbliggaren.conf has not
# been installed, Docker silently creates the path itself — root-owned, un-traversable by the
# container — and the app then fails with "master key missing" rather than a permission error.
# Installing the tmpfiles unit is therefore a step in the first-boot procedure
# (docs/runbooks/vps-deploy-stack.md §3), not an optional extra, and
# `jobbliggaren-inject-secrets.sh --check` asserts the directory's mode for the same reason.
x-app-secrets-mount: &app-secrets-mount
  # Item-level anchor too, so a service that needs an ADDITIONAL mount can extend the list
  # without restating the path. YAML merges maps, never sequences, so `<<:` cannot do this.
  - &app-secrets-entry /run/jobbliggaren/secrets:/run/app-secrets:ro

# ONE definition, two consumers: `migrate` (schema, every `up`) and `migrate-rewrap` (the
# master-key rotation, ops profile only). Duplicating the string would let host, port, database,
# role or SSL mode drift between them — and the copy that drifts unnoticed would be the
# rotation's, which runs once a year and is therefore discovered last. Same argument the
# x-app-secrets anchor makes for api and worker.
# jobbliggaren_app, not jobbliggaren_migrations, and the variable name is the clue:
# `schema` mode applies the APP schema's EF migrations. `migrate init` grants
# USAGE+CREATE on schema public, ALL on its tables and sequences, and the matching
# default privileges to the app role — and to no one else. Pointed at the migrations
# role this service dies with 42501 "permission denied for schema public" the moment
# EF tries to create __EFMigrationsHistory, which is a gating dependency of api and
# worker on every `up`. Measured on the Netcup box 2026-08-05, first boot.
# The migrations role owns the hangfire schema (see the runbook's GRANT model); it is
# not the role that owns public.
x-migrate-app-connection: &migrate-app-connection
  MIGRATE_APP_CONNECTION_STRING: "Host=postgres;Port=5432;Database=jobbliggaren;Username=jobbliggaren_app;Password=${POSTGRES_APP_PASSWORD:?};SSL Mode=Disable"

x-app-connections: &app-connections
  ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=jobbliggaren;Username=jobbliggaren_app;Password=${POSTGRES_APP_PASSWORD:?}"
  ConnectionStrings__HangfireStorage: "Host=postgres;Port=5432;Database=jobbliggaren;Username=jobbliggaren_worker;Password=${POSTGRES_WORKER_PASSWORD:?}"
  ConnectionStrings__Redis: "redis:6379"

# Outbound email (#183). Carried by api and worker — the two services that call
# AddEmailSender — and by nothing else.
#
# THIS ANCHOR DOES NOT ENABLE EMAIL AND MUST NOT. The default resolves to
# NullEmailSender exactly as before; the flip to `Scaleway` is release-checklist.md §2.5 and
# Klas's alone (ADR 0124 states it unconditionally). What this adds is the ability to
# express the flip at all: measured 2026-08-09, `deploy/` carried no Email__* variable of
# any kind, so the flip was not merely gated, it was unreachable.
#
# THE PROVIDER IS SCALEWAY SINCE #183 (E1, b71c14de), AND `Ses` IS NOW A BOOT REFUSAL rather
# than an older spelling of the same thing. AWS refused production access permanently, so the
# SES arm was deleted rather than repointed — the Scaleway arm succeeds it, though the SDK
# package does not, Scaleway publishing none for .NET. AddEmailSender's switch ends in
# `else throw`, and `Ses` reaches it exactly as `Resend` (ADR 0124) does. Nothing falls back.
#
# AddEmailSender reads `configuration["Email:Provider"] ?? "Console"`, and `??` does not
# catch an EMPTY string — compose renders an unset `${EMAIL_PROVIDER:-}` as "" and sets the
# variable anyway, so the empty form would fall through to the unknown-provider arm and
# refuse the boot with `Email:Provider='' stöds inte`. Hence the literal default.
#
# The two credential pointers use the `_FILE` seam and default EMPTY, which is also not a
# style choice: EnvFileSecretsConfiguration THROWS when a `_FILE` variable names a path it
# cannot read, so these cannot carry a literal path the way the master key's pointers do —
# the master key is injected on every boot, while these are injected only for the flip, so
# a literal here would be a boot refusal on every box that has not flipped. A blank pointer
# is "not configured" and is inert. The paths lie under the x-app-secrets-mount volume, which any service carrying
# this anchor must also carry — without the mount, a set pointer is a boot refusal.
#
# jobbliggaren-inject-secrets.sh WRITES those two files, and prompts for them when
# EMAIL_PROVIDER is Scaleway, when either pointer is set, or under JBL_INJECT_SCALEWAY=1 (#183).
# Unconditional entries would demand the credentials at every boot and take the box down today;
# no entry at all would leave the flip unable to place a secret. The condition is what makes
# both survivable. Operator view, including the inject-before-you-edit order that keeps the flip
# from being an outage: deploy/.env.example.
#
# Two pointers because there are two secrets with independent rotation lifecycles, not two halves
# of one credential — the reasoning has one home on this side of the wire,
# jobbliggaren-inject-secrets.sh's SCALEWAY_SECRET_KEYS.
#
# Email__BaseUrl is set unconditionally because it is wrong unconditionally otherwise: it
# is unset everywhere in the tree, so it falls back to EmailOptions' http://localhost:3000
# and every confirmation link in a real send would point at the reader's own machine. Its
# only consumers are the e-mail templates.
x-app-email: &app-email
  Email__Provider: ${EMAIL_PROVIDER:-Console}
  Email__Scaleway__Region: ${EMAIL_SCALEWAY_REGION:-}
  Email__Scaleway__SecretKey_FILE: ${EMAIL_SCALEWAY_SECRET_KEY_FILE:-}
  Email__Scaleway__ProjectId_FILE: ${EMAIL_SCALEWAY_PROJECT_ID_FILE:-}
  # A literal equal to the EmailOptions code default, deliberately NOT a knob: the sender
  # must lie under the domain identity verified at the provider, and p=reject makes a wrong
  # sender silence rather than a bounce — so every reachable non-default value is a wrong one.
  Email__FromAddress: no-reply@jobbliggaren.se
  Email__BaseUrl: https://${SITE_HOST:?}

# The structured log sink (#1175 (B)). Carried by api and worker — the two hosts that call
# AddJobbliggarenLogging — and by nothing else.
#
# THE PORT IS 5341, NOT 80, AND THAT IS A SECURITY BOUNDARY RATHER THAN A DETAIL. Seq listens
# for INGESTION on 5341 and serves its UI and query API on 80; the dev compose file maps both
# and labels them (`"127.0.0.1:5341:80"` UI + API, `"127.0.0.1:5342:5341"` ingestion — the bind
# address is quoted because in a comment whose whole subject is that the binding is the control,
# eliding it is how #1198 happened). Pointing the app at 5341
# keeps the query API out of the app's CONFIGURATION — and that is all it does.
#
# WHAT THIS IS NOT: network isolation. An earlier draft of this comment said a compromised api or
# worker "cannot reach the query API over the network at all", and that is measured FALSE
# (2026-08-11, Seq on its own bridge with no `ports:`): containers on a user-defined bridge reach
# each other by default — inter-container communication is on, `stack` is not segmented — so a
# sibling gets HTTP 200 from `seq:80`. What actually holds, measured in the same run: the query
# API on 80 answers **401** without authentication, and 5341 carries **no** query API at all
# (**404**). So the split is real and the defence is AUTHENTICATION, not topology. The 401 is the
# control, it is the one with a verification row in log-sink.md §4, and describing a control that
# needs measuring as one that does not is exactly the #1198 shape this file's header invokes.
# `Seq:ServerUrl` is read by
# LoggingBuilderExtensions, which attaches the provider ONLY when the value is non-empty, so
# an unset value leaves both hosts console-only exactly as before.
#
# THE API KEY CARRIES `Ingest` AND NOTHING ELSE. It is not a root-survival control and must not
# be described as one — root on this box reads the Seq volume directly. What it bounds is a
# compromised application container: with an ingest-only key, an attacker inside api or worker
# can neither read the corpus back nor delete from it.
#
# AND IT BOUNDS EVEN THAT ONLY ONCE A SETTING NO ENVIRONMENT VARIABLE REACHES IS TURNED ON.
# Measured 2026-08-11 against datalust/seq:2026.1: `RequireApiKeyForWritingEvents` defaults to
# FALSE, and while it is false the ingestion endpoint accepts a write with a valid key, an empty
# key, a wrong key and no key at all — 201 in all four cases, with authentication otherwise
# enabled. With it true the last three answer 401. Three spellings of an environment variable for
# it were measured silently ignored, including SEQ_FIRSTRUN_REQUIREAPIKEYFORWRITINGEVENTS on the
# prefix Seq does read, so this file CANNOT ship it fail-closed; it is a step in
# log-sink.md §3, and a step is something an operator can skip. The runbook's §4 carries the row
# that measures it at the box, and until that row is dated the sentence above states an intent
# rather than a control — which is the #1198 shape, one layer up.
#
# `${SEQ_ADMIN_PASSWORD:-}` USES `:-` AND NOT `:?`, AND THE DIFFERENCE IS THE WHOLE BOX. Every
# other credential here is a hard `:?` because compose should refuse to start without it. Not
# this one: `jobbliggaren-reconcile.sh` runs `compose up -d` hourly, and a `:?` on a value the
# box's `.env` does not yet carry makes compose refuse the ENTIRE apply — every service, every
# hour, with `systemctl --failed` as the only signal. With `:-` the seq container alone fails,
# and it fails with Seq's own diagnostic, which is greppable. The compose header makes the same
# argument about hard requirements; this is that argument applied.
x-app-seq: &app-seq
  Seq__ServerUrl: ${SEQ_SERVER_URL:-}
  Seq__ApiKey: ${SEQ_INGEST_API_KEY:-}
  Seq__MinimumLevel: ${SEQ_MINIMUM_LEVEL:-Information}

services:

  # ==============================================================
  # Edge — the only service that publishes
  # ==============================================================
  caddy:
    image: ghcr.io/klasolsson81/jobbliggaren-caddy:${IMAGE_TAG:-latest}
    container_name: jobbliggaren-caddy
    ports:
      # Wide by requirement, not by omission — see the header.
      - "80:80"
      - "443:443"
    environment:
      SITE_HOST: ${SITE_HOST:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      # Selects one of three snippets baked into the image. Default `both` is an EMPTY file,
      # so the running configuration is unchanged; `http01` and `alpn01` each disable the other
      # challenge so issuance can be proven per path. Never a running value (#196).
      ACME_CHALLENGE_MODE: ${ACME_CHALLENGE_MODE:-both}
      BASIC_AUTH_USER: ${BASIC_AUTH_USER:?}
      # bcrypt hash from `caddy hash-password`. Never committed: this repo is public
      # and K2 is the whole admission control, so a committed hash is offline-crackable
      # (ADR 0050 Amendment 2026-08-04 §5, M-5b point 5).
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?}
    volumes:
      # Certificates and ACME account state. Losing this volume means re-issuing, which
      # spends Let's Encrypt rate limit — treat it as durable.
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    # THE GATE IS AN UNAUTHENTICATED CPU AMPLIFIER and this cap is the second half of the
    # answer. A request carrying any `Authorization: Basic` header pays the full hash,
    # because Caddy caches only SUCCESSFUL comparisons — so wrong passwords pay every
    # time, and nothing upstream filters them. The first half is the hash cost itself,
    # lowered to bcrypt 11 in `.env.example` (Klas 2026-08-05).
    #
    # THE RATIO IS ARITHMETIC, NOT A MEASUREMENT: bcrypt is exponential in cost, so 11 to
    # 14 is 2^3 = 8x by construction and no machine can produce another answer. Two
    # independent measurements put cost 14 near 850 ms on a one-CPU container; a third
    # (mine) reported 217 ms and is withdrawn, because it contradicts both the others and
    # the arithmetic. The ratio is what the decision rests on and it cannot rot.
    #
    # argon2id is refused at the class rather than at a threshold, and deliberately with
    # no speed figure: the only one measured came from the same run as the withdrawn
    # bcrypt number, and keeping one while retracting the other would be arbitrary. The
    # ground is shape, not speed - a per-request allocation (46 MiB at its default m=47104) on an
    # unauthenticated edge is a memory-exhaustion primitive whose concurrency the attacker
    # chooses, so no value of m makes it safe here.
    # The cap alone does not make the amplifier cheap; it stops it starving Postgres, the
    # API and the Worker along with the edge.
    cpus: 1.0
    # NO depends_on AT ALL, and the short form was not enough. `web` itself waits on
    # `api: service_healthy`, so `depends_on: [web]` inherits that transitively: measured
    # on Compose 2.40.3, with api unhealthy the short form leaves caddy CREATED and never
    # started, while removing the key entirely leaves it RUNNING. Caddy needs nothing from
    # web to boot — reverse_proxy resolves upstream per request — so the only thing the
    # dependency bought was the failure it was written to prevent: a stack that never
    # becomes healthy would have no edge, no error page and no certificate renewal. A 503 from the edge is the
    # better outcome — that is what an active health check answers once the upstream is
    # marked down, and it is what was measured here.
    security_opt:
      - no-new-privileges:true
    logging: *logging
    restart: unless-stopped
    networks: [stack]

  # ==============================================================
  # Next.js — the only thing Caddy proxies to (Option B)
  # ==============================================================
  web:
    image: ghcr.io/klasolsson81/jobbliggaren-web:${IMAGE_TAG:-latest}
    container_name: jobbliggaren-web
    environment:
      # Option B invariant 6: server-only, internal service DNS, never the public
      # origin. Pointed at the public origin, every SSR/BFF call loops back through
      # Caddy to Next, which has no /api/v1/* handlers, and 404s.
      BACKEND_URL: "http://api:8080"
      NODE_ENV: production
      # DEV-ONLY, see the api service. Without this slot NODE_ENV=production hides the reset
      # button on the very box it exists for.
      DEV_TOOLS_RESET_ENABLED: ${DEV_TOOLS_RESET_ENABLED:-false}
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    mem_limit: 640m
    healthcheck:
      # node is the only runtime in this image; fetch has been global since node 18.
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *logging
    restart: unless-stopped
    networks: [stack]

  # ==============================================================
  # Application
  # ==============================================================
  api:
    image: ghcr.io/klasolsson81/jobbliggaren-api:${IMAGE_TAG:-latest}
    container_name: jobbliggaren-api
    environment:
      <<: [*app-secrets, *app-connections, *app-email, *app-seq]
      ASPNETCORE_ENVIRONMENT: Production
      # Capacity condition 2 (ADR 0050 Amendment 2026-08-04 §2). Real behaviour change
      # here: Microsoft.NET.Sdk.Web sets ServerGarbageCollection=true, and Workstation GC
      # costs throughput under concurrent load — which is why the NBomber run against the
      # ADR 0045 budgets is part of this deploy's validation and not an afterthought.
      DOTNET_gcServer: "0"
      # The bridge subnet declared under `networks:` below. ForwardedHeadersConfig
      # fail-stops a Production boot on an empty value, which is why the committed
      # appsettings.Production.json leaves it empty and the value is injected here.
      ForwardedHeaders__KnownNetworks__0: "172.28.0.0/24"
      # Registration gate (#734). Absent knob renders `false` — AuthOptions' own default, and
      # the posture the box has today: POST /auth/register answers 503, so no NEW account can
      # be created. Both flags are passed, not just the gate: AuthOptionsValidator is the single
      # home of which combinations are legal, and passing only the gate would leave the operator
      # unable to satisfy a rule the boot enforces. Inline rather than a shared anchor because the worker
      # consumes no Auth__* at all — every host-specific key in this file is already inline,
      # while x-app-email and x-app-seq are anchors precisely because both hosts read them.
      # The default is pinned by DeployComposeRegistrationGateTests, since an open default
      # would boot LEGALLY once the mail provider delivers. Operator view, flip order and
      # failure modes: deploy/.env.example.
      Auth__RegistrationsOpen: ${AUTH_REGISTRATIONS_OPEN:-false}
      Auth__RequireEmailConfirmation: ${AUTH_REQUIRE_EMAIL_CONFIRMATION:-false}
      # DEV-ONLY throwaway tooling. REMOVE BEFORE LAUNCH with the flag itself
      # (docs/runbooks/release-checklist.md 2.7). Default pinned by
      # DeployComposeDevToolsGateTests: this gates a DESTRUCTIVE, owner-scoped reset, so an
      # absent value must resolve to false rather than to whatever the shell happens to hold.
      # Same variable feeds the web service, deliberately: the two halves are set together or
      # not at all, and with only one on the button renders and every press is refused.
      DevTools__EnableResetMyData: ${DEV_TOOLS_RESET_ENABLED:-false}
      # Read by IdempotentAdminRoleSeeder at every Api START, never at registration: an
      # account created after this boot receives the role on the NEXT restart, and the boot
      # in between logs "ingen matchande user hittades". It re-asserts on every start, so
      # blank it once the role is assigned — the role persists in the database, and a
      # standing value silently re-grants what an in-app revocation removed.
      AdminBootstrap__InitialAdminEmail: ${ADMIN_BOOTSTRAP_INITIAL_ADMIN_EMAIL:-}
      # #1350 — where the Data-Protection keyring is persisted, matched by the writable volume
      # below. Unset means the framework default, i.e. the container's writable layer, which is
      # the defect: every recreate mints a fresh keyring and silently invalidates every
      # outstanding activation, password-reset and change-email link. The Api reads the key name
      # from DependencyInjection.DataProtectionKeyPathConfigKey; DeployComposeDataProtectionTests
      # pins that this value and the mount destination stay the same path.
      # NOT passed to `worker`: it mints and validates no DataProtector tokens and must not
      # share this keyring.
      DataProtection__KeyPath: /keys
    volumes:
      - *app-secrets-entry
      # Writable, unlike the secrets mount: the keyring is written by the app, not injected.
      - dataprotection_keys:/keys
    mem_limit: 1024m
    # B-1 POSTURE, and do not remove this line. ADR 0050 Amendment 2026-08-04 §2
    # condition 4 attributes it explicitly: `mem_limit` binds only the memory axis, so a
    # container at its ceiling swaps into zram — the same physical RAM, compressed — and
    # `memswap_limit == mem_limit` is called a "strictly stronger B-1 posture" there,
    # because the key then cannot reach zram either, only anonymous RAM.
    #
    # It STRENGTHENS B-1 and it never discharged it. #198 closed the gate itself by taking
    # the key out of container environment and out of `deploy/.env` entirely — see the
    # x-app-secrets anchor above. This line remains load-bearing for the OTHER half: the key
    # is plaintext in this process's memory for its whole lifetime, and without
    # `memswap_limit` a container at its ceiling would page that memory into zram.
    memswap_limit: 1024m
    healthcheck:
      # The aspnet image ships no curl or wget deliberately (see its Dockerfile), so the
      # probe is a bash /dev/tcp socket against the strict readiness endpoint — which
      # checks Postgres CanConnect and Redis PING and answers 503 until both are up.
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8080 && printf "GET /api/ready HTTP/1.0\r\n\r\n" >&3 && read -r status <&3 && case "$$status" in *" 200 "*) exit 0 ;; *) exit 1 ;; esac'
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    logging: *logging
    restart: unless-stopped
    networks: [stack]

  worker:
    image: ghcr.io/klasolsson81/jobbliggaren-worker:${IMAGE_TAG:-latest}
    container_name: jobbliggaren-worker
    environment:
      <<: [*app-secrets, *app-connections, *app-email, *app-seq]
      # DOTNET_ENVIRONMENT, not ASPNETCORE_ENVIRONMENT, and the difference is load-bearing.
      # The Worker is a generic host (Host.CreateApplicationBuilder), which reads
      # DOTNET_ENVIRONMENT; ASPNETCORE_ENVIRONMENT is what a WebApplication reads, so on this
      # service it was inert. The Production overlay was being loaded only because Production
      # is the framework default when nothing is set — which meant the overlay's
      # JobTech:IngestEnabled=false, i.e. the whole pre-beta-data ingestion gate, rested on a
      # default rather than on anything this file declared. The api service below keeps
      # ASPNETCORE_ENVIRONMENT because it IS a WebApplication.
      DOTNET_ENVIRONMENT: Production
      DOTNET_gcServer: "0"
      # The ingestion gate, and it is deliberately NOT flipped in the shipped Production overlay.
      # That overlay keeps IngestEnabled=false and JobSourceIngestGateConfigurationTests pins it,
      # so an image that reaches any box ingests nothing until an operator says otherwise HERE.
      # The default is false for the same reason the Auth gates above default closed: an absent
      # key must mean OFF here rather than fall through. What it falls through TO is two layers,
      # not one - the Production overlay's own false (loaded because DOTNET_ENVIRONMENT is set
      # above), and only if that vanishes too, the code default, which is true. The lower layer
      # has already gone silently absent once: see the DOTNET_ENVIRONMENT note above.
      # Klas gave the written GO 2026-08-17 (release-checklist.md 2.6 point 3.5, which records the
      # adjudicator, the date and where it was given). The GO is what authorises setting this;
      # this line is not itself permission.
      # THE GO IS NOT SUFFICIENT ON ITS OWN, and that is security-auditor's ruling of the same
      # date, not this file's opinion: setting this to true is BLOCKED until the risk ADR 0123
      # records is measurably reduced (requirement (1), restated by security-auditor 2026-08-17 —
      # a property, not a named control), both M-7 legs are verified on host-detection.md (the
      # unmeasured half is the wake-and-page chain), and a NEW grant covers the state WITH real
      # data. Point 3.5 carries the ruling and its grounds.
      JobTech__IngestEnabled: ${JOBTECH_INGEST_ENABLED:-false}
    volumes: *app-secrets-mount
    mem_limit: 1024m
    memswap_limit: 1024m
    # Hangfire's ShutdownTimeout is 25 s (HangfireWorkerOptions), sized to sit just under
    # a 30 s grace period so job state is committed before SIGKILL. Compose's default is
    # 10 s, which would kill the process 15 s early — so the value is set here rather than
    # inherited. Raising ShutdownTimeoutSeconds means raising this in the same change.
    stop_grace_period: 30s
    # No healthcheck: the Worker hosts no HTTP surface, so there is nothing to probe
    # that is not already covered by the restart policy.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    security_opt:
      - no-new-privileges:true
    logging: *logging
    restart: unless-stopped
    networks: [stack]

  # Oneshot schema migration. It gates api and worker mechanically via
  # `service_completed_successfully`, so ordering holds on every `up`, not only on the
  # first one. The one-time role provisioning (`init`, `bootstrap`, `ensure-extensions`)
  # is an operator step — `docker compose -f <path> run --rm migrate init` — because it
  # needs the master credentials and must not run on every restart.
  migrate:
    image: ghcr.io/klasolsson81/jobbliggaren-migrate:${IMAGE_TAG:-latest}
    container_name: jobbliggaren-migrate
    command: ["schema"]
    environment:
      <<: *migrate-app-connection
      MIGRATE_DB_HOST: postgres
      MIGRATE_DB_PORT: "5432"
      MIGRATE_DB_NAME: jobbliggaren
      # Disable, not Require: the stock postgres image serves no TLS, so Require fails
      # the handshake. ADR 0050's "Require is acceptable only on the private bridge" is
      # a ceiling on what may be relaxed, not an instruction to set it. Nothing but this
      # network can reach 5432 — no service publishes it, and the host's forward chain
      # admits only 80/443 from outside.
      MIGRATE_SSL_MODE: Disable
      MIGRATE_MASTER_USERNAME: postgres
      MIGRATE_MASTER_PASSWORD: ${POSTGRES_MASTER_PASSWORD:?}
      MIGRATE_MIGRATIONS_PASSWORD: ${POSTGRES_MIGRATIONS_PASSWORD:?}
      MIGRATE_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?}
      MIGRATE_WORKER_PASSWORD: ${POSTGRES_WORKER_PASSWORD:?}
      # #1236 — forwards the schema-ahead override; the VALUE is set in the box's
      # `deploy/.env` (this tracked line only passes it through — a hand-edit here
      # diverges the box's clone and makes its next `git pull` refuse, wedging deploys).
      # Semantics, refusal anatomy and the
      # ID-set rule: docs/runbooks/vps-deploy-stack.md §3a — one home, this is a pointer.
      # `:-` and not `:?` — the box must `up` with the key undefined (.env.example's
      # contract). On this service and NOT in the x-migrate-app-connection anchor:
      # migrate-rewrap shares that anchor and must never inherit a schema-judgment override.
      MIGRATE_ALLOW_SCHEMA_AHEAD: ${MIGRATE_ALLOW_SCHEMA_AHEAD:-}
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    logging: *logging
    restart: "no"
    networks: [stack]

  # The rotation, as its own service under a profile so `up` never starts it and `schema` never
  # carries the secrets mount. #198 M-3.
  #
  # WHY A SIBLING RATHER THAN A MOUNT ON `migrate`. `schema` runs on EVERY `up` — api and worker
  # gate on it via service_completed_successfully, and the hourly reconcile calls `up -d` — so a
  # mount there would hand the master key to a container that needs no crypto material at all,
  # once an hour, for the life of the box. All three images run `USER app` and the files are 0400
  # owned by that uid, so the container really could read them. Least privilege, and the profile
  # keeps the declaration in this file rather than in a `compose run -v` the runbook would have
  # to keep in sync by hand.
  #
  # `memswap_limit == mem_limit`, same reason as api and worker: during a rotation this process
  # holds TWO master keys in plaintext for the whole run, and without it a container at its
  # ceiling pages that memory into zram.
  migrate-rewrap:
    image: ghcr.io/klasolsson81/jobbliggaren-migrate:${IMAGE_TAG:-latest}
    container_name: jobbliggaren-migrate-rewrap
    profiles: ["ops"]
    command: ["rewrap-master-key"]
    volumes: *app-secrets-mount
    environment:
      <<: *migrate-app-connection
    mem_limit: 512m
    memswap_limit: 512m
    # No `depends_on`: this runs mid-rotation with api and worker deliberately stopped, and a
    # `service_healthy` dependency would START postgres rather than fail clearly. That is a
    # decision, not the oversight the asymmetry against `migrate` reads as.
    security_opt:
      - no-new-privileges:true
    logging: *logging
    restart: "no"
    networks: [stack]

  # ==============================================================
  # Data
  # ==============================================================
  postgres:
    # BUMPING THIS TAG — run the collation check against the box afterwards. `public.swedish`
    # is an ICU collation and the ICU version comes out of this image; if it drifts, btree
    # text indexes are sorted by an order that no longer holds. Postgres does not crash, the
    # queries go quietly wrong. Query and repair: docs/runbooks/release-checklist.md §2.
    # BUMPING THIS TAG ALSO REQUIRES an edit to UPSTREAM_ALLOWLIST in
    # deploy/systemd/jobbliggaren-reconcile.sh — the reconcile wrapper verifies our own
    # images and skips only the upstream tags named there, so an unlisted tag refuses the
    # whole apply, hourly, with no reader (#1175).
    image: postgres:18.3
    container_name: jobbliggaren-postgres
    # Tuned FROM the 2 560 MiB cap, not beside it. Under cgroup v2 the page cache is
    # charged to the cgroup that faults it in, so this container's cap prices Postgres's
    # file cache too — the host's spare RAM is not reachable from in here (ADR 0122).
    # shared_buffers 640 MB = 25 % of the cap; effective_cache_size is what remains of it
    # for file cache, NOT the host total; work_mem x max_connections is the sort/hash
    # ceiling and is what makes 60 connections rather than the default 100 the safe number.
    command:
      - postgres
      - -c
      - shared_buffers=640MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=192MB
      # autovacuum_work_mem INHERITS maintenance_work_mem when unset, and there are three
      # workers — so the 192 MB knob above is really up to 576 MiB per cycle inside a
      # 2 560 MiB cap. Bounded explicitly so the file sets what it appears to set.
      - -c
      - autovacuum_work_mem=64MB
      - -c
      - max_connections=60
      - -c
      - wal_compression=on
      # The dimensioning workload is not memory-bound: the nightly snapshot job commits
      # per item, so ~47k transactions land against a 2.5 GB table in one window. At the
      # 1 GB default, checkpoints fire on VOLUME long before the timeout and every first
      # touch of a page after one writes a full-page image. Disk is not the scarce
      # resource on this box; RAM is.
      - -c
      - max_wal_size=4GB
      - -c
      - min_wal_size=1GB
    environment:
      POSTGRES_DB: jobbliggaren
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_MASTER_PASSWORD:?}
    volumes:
      # Postgres 18+: mount /var/lib/postgresql (not .../data) so version-specific
      # subdirectories are created — required for pg_upgrade --link.
      - postgres_data:/var/lib/postgresql
    mem_limit: 2560m
    # Docker's 64 MB default breaks parallel workers on a corpus this size.
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobbliggaren"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    logging: *logging
    restart: unless-stopped
    networks: [stack]

  redis:
    # BUMPING THIS TAG ALSO REQUIRES an edit to UPSTREAM_ALLOWLIST in
    # deploy/systemd/jobbliggaren-reconcile.sh — the reconcile wrapper verifies our own
    # images and skips only the upstream tags named there, so an unlisted tag refuses the
    # whole apply, hourly, with no reader (#1175).
    image: redis:8.6-alpine
    container_name: jobbliggaren-redis
    # BOTH keys or neither. Without maxmemory Redis grows past the container cap and the
    # kernel OOM-kills it, losing every session at once; without a policy the default
    # would evict. `noeviction` is the decided value (ADR 0122): allkeys-lru would evict
    # session keys and produce silent logouts. Under noeviction a full instance refuses
    # writes loudly instead, which is the failure we can see.
    command:
      - redis-server
      - --maxmemory
      - 400mb
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    logging: *logging
    restart: unless-stopped
    networks: [stack]

  # ==============================================================
  # Structured log sink — #1175 (B). Reachable ONLY on the internal network.
  # ==============================================================
  seq:
    # BUMPING THIS TAG ALSO REQUIRES an edit to UPSTREAM_ALLOWLIST in
    # deploy/systemd/jobbliggaren-reconcile.sh — the reconcile wrapper verifies our own
    # images and skips only the upstream tags named there, so an unlisted tag refuses the
    # whole apply, hourly, with no reader.
    image: datalust/seq:2026.1
    container_name: jobbliggaren-seq
    # NO `ports:` KEY, AND ITS ABSENCE IS THE CONTROL. Not `127.0.0.1:5341:80` — that is the
    # DEV compose file's shape and it would FAIL the gate here:
    # `.github/scripts/compose-edge-publish-guard.sh` clause 1 is "exactly one service
    # publishes, and nothing else does", and caddy is that one service. The two guards give
    # opposite verdicts on the same engine, which the edge guard's own header records.
    #
    # AND THERE IS NO SSH TUNNEL EITHER, which an earlier draft of this comment asserted.
    # This box runs `AllowTcpForwarding no` (vps-base-hardening.md §4.2's drop-in; measured
    # effective on the box 2026-08-11 with `sshd -T`), so `ssh -L` in ANY address form is
    # refused with "administratively prohibited" — the address was never the defect. What
    # reaches an unpublished container is the box's own curl against the container IP.
    # docs/runbooks/log-sink.md §3 owns the procedure and the measurement; do not restate
    # the command here, because the last time it lived in two homes the two disagreed.
    #
    # That is also why #1198 cannot recur in this shape: there is no listener on a host
    # interface to leave unauthenticated.
    environment:
      ACCEPT_EULA: "Y"
      # Seq 2026.1 REFUSES TO START without either a first-run admin password or an explicit
      # no-authentication opt-out — measured on the box 2026-08-11, exit 1 with
      # "No default admin password was supplied". That fail-closed default is the structural
      # repair for #1198's class, where a Seq sat unauthenticated for months while the compose
      # file's own comment vouched for it. Do not add SEQ_FIRSTRUN_NOAUTHENTICATION.
      #
      # Read ONLY on first run against an empty volume; later changes are made in Seq and this
      # value stops being the source of truth. That is a real trap for the next operator and it
      # is why the runbook says to change it in Seq rather than here.
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:-}
    volumes:
      - seq_data:/data
    # THE MEASURED CONFIGURATION, NOT A ROUNDED-UP ONE — and raising it is not the safe move
    # it looks like. Seq sizes its own caches against what it measures as available memory,
    # and under Docker the cgroup limit IS how it learns that, so a 1024m cap would be a
    # DIFFERENT, UNMEASURED configuration in which the cache grows toward the higher target —
    # a new unmeasured number rather than headroom. Datalust's published "3.5 GB for a light
    # workload" is a recommendation and was falsified as a requirement by measuring instead.
    # The figures and the command that regenerates them have ONE home, deliberately:
    # docs/runbooks/log-sink.md §4. Repeating them here would mean a re-measurement under a
    # different cap had to find this file too.
    mem_limit: 512m
    # memswap_limit == mem_limit here is CAPACITY HONESTY, NOT gate B-1. On api and worker the
    # same line is partly a B-1 control, because those processes hold the master key in memory
    # and zram is still RAM the key must not reach. Seq holds no key. Stated because a reader
    # who generalises the api rationale to this service reasons from the wrong premise.
    memswap_limit: 512m
    # NO HEALTHCHECK, DELIBERATELY, AND THIS IS A GAP RATHER THAN A DECISION THAT IT NEEDS
    # NONE. Nothing depends_on seq, so an unhealthy status blocks no start-up; and an
    # unverified probe that fails would paint a permanent "unhealthy" on the box's surface,
    # which is the always-lit-alarm failure this stack has repaired twice elsewhere. Seq
    # exposes a health endpoint, but whether this image carries a client to call it was not
    # measured. log-sink.md §4 carries the row that closes this.
    security_opt:
      - no-new-privileges:true
    logging: *logging
    restart: unless-stopped
    networks: [stack]

networks:
  stack:
    driver: bridge
    # The subnet is FIXED because a value derived from it is configuration: the API's
    # ForwardedHeaders__KnownNetworks__0 above must equal this CIDR, and a Docker-assigned
    # pool address would change under it. The bridge is named so the host's nftables
    # forward rules can match on the interface rather than on a generated name.
    driver_opts:
      com.docker.network.bridge.name: br-jbl
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  redis_data:
  # #1350 — the Api's Data-Protection keyring. A named volume rather than a bind under
  # /run/jobbliggaren/, which is RAM-backed (ADR 0050 B-1) and would lose the keys on every
  # reboot while looking repaired; and rather than a database-backed store, which would put the
  # keys into the pg_dump artefact the backup ships off-box (jobbliggaren-backup.sh dumps
  # Postgres and no Docker volume). Deleting this volume invalidates outstanding activation,
  # reset and change-email links and nothing else — they are 24h or shorter and re-requestable.
  dataprotection_keys:
  # The sink's event store. It holds application events in PLAINTEXT on this box's disk —
  # `UserId`, `CorrelationId`, IP addresses and whatever else a log statement carries — which
  # is why it is enumerated in docs/runbooks/gdpr-processing-register.md alongside the
  # json-file layer and the off-box hostlogs/ archive, and why Seq's own retention policy is the
  # control that WOULD bound its age — a by-hand step (log-sink.md §3 step 7) with no
  # configuration surface, whose state is measured in §4 and never asserted here. Deleting this
  # volume destroys the searchable corpus and
  # nothing else: the durable copy is the age-encrypted archive (#1175 (A)).
  seq_data:
