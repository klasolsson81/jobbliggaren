# /etc/audit/auditd.conf.d/10-jobbliggaren.conf — gate M-7 (#1201).
#
# THE POINT OF THIS FILE IS ONE LINE, AND IT IS NOT A TIDINESS SETTING.
# Debian's default `admin_space_left_action` is SUSPEND, and `halt` and `single` are valid values
# for the disk-full actions. That means an out-of-the-box auditd can SUSPEND LOGGING or take the
# host down when the disk fills. A detective control must never be able to cause the outage it
# exists to make someone aware of — a self-inflicted availability incident from a measure whose
# only purpose is awareness. Every action below is therefore explicitly a non-destructive one.
#
# The other values bound auditd's own log so it cannot become the thing that fills the disk. The
# journal's floor is set separately (journald-jobbliggaren-retention.conf); these are different
# logs with different rotation, and neither implies the other.
#
# NOT MEASURED BY A DRILL, AND THE VERIFICATION ROW SAYS SO. Filling the production disk to watch
# the action fire is a self-inflicted incident; the row records the EFFECTIVE configuration and
# states plainly that the drill was not run and why. A measured cell, not an empty one.

# Bound auditd's own log: 8 MB per file, 5 files, rotate rather than stop.
max_log_file = 8
num_logs = 5
max_log_file_action = ROTATE

# When space runs low or out: say so, never suspend and never halt.
space_left = 512
space_left_action = SYSLOG
admin_space_left = 256
admin_space_left_action = SYSLOG
disk_full_action = ROTATE
disk_error_action = SYSLOG
