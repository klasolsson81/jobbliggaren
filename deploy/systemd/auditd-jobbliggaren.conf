# auditd space-action delta for gate M-7 (#1201) — a REFERENCE, not a drop-in.
#
# THIS FILE IS NOT INSTALLED ANYWHERE. auditd reads exactly one configuration file,
# /etc/audit/auditd.conf, and has no drop-in directory. Measured on the box 2026-08-10 after
# installing auditd 1:4.0.2-2+b2: the package ships /etc/audit/plugins.d (plugin config) and no
# auditd.conf.d; the man page mentions conf.d zero times; and the auditd binary contains no such
# path at all. An earlier revision of this work shipped these values as
# /etc/audit/auditd.conf.d/10-jobbliggaren.conf, which auditd would never have read — the
# settings would have been inert while the file argued for their necessity. host-detection.md §5
# edits /etc/audit/auditd.conf in place instead, and its verification row reads the values back.
#
# WHY THESE THREE AND ONLY THESE THREE. Debian's shipped defaults were measured on the box the
# same day, and most of what an earlier draft "set" was already the default — writing those back
# would have been noise pretending to be configuration. What actually differs:
#
#   setting                     Debian default   required   why
#   admin_space_left_action     SUSPEND          SYSLOG     stops logging when disk runs low
#   disk_full_action            SUSPEND          ROTATE     stops logging when the disk fills
#   disk_error_action           SUSPEND          SYSLOG     stops logging on a write error
#
# All three defaults halt or suspend the audit trail, and `halt` and `single` are valid values in
# this family too. A DETECTIVE CONTROL MUST NEVER CAUSE THE OUTAGE IT EXISTS TO REPORT — and the
# specific failure here is worse than an outage: SUSPEND silently stops the very trail an
# incident would be reconstructed from, at exactly the moment something is going wrong.
#
# Already correct on Debian and therefore NOT touched: max_log_file = 8, num_logs = 5,
# max_log_file_action = ROTATE, space_left = 75, space_left_action = SYSLOG. Those bound auditd's
# own log so it cannot become the thing that fills the disk, and the defaults already do it.

admin_space_left_action = SYSLOG
disk_full_action = ROTATE
disk_error_action = SYSLOG
