# Installed to /etc/tmpfiles.d/jobbliggaren-observe.conf — #1982, ADR 0157. Apply it with
# `systemd-tmpfiles --create /etc/tmpfiles.d/jobbliggaren-observe.conf`, after
# jobbliggaren-observe-sysusers.conf: this line names jbl-observe, and tmpfiles skips a line whose
# user does not resolve.
#
# A file of its own, not a fourth line in jobbliggaren-tmpfiles.conf: that file is applied by the
# master-key and backup procedures on boxes that have no sampler user yet, and a line that cannot
# resolve its user would turn those steps red.
#
# THIS DIRECTORY IS THE OPPOSITE OF host-secrets/. It holds only metadata that is fit for any
# admin to read, it is bind-mounted read-only into api and into nothing else, and it is owned by
# the unprivileged sampler user, so the unit that writes it needs no root. Its source path must
# never become a parent of secrets/ or host-secrets/; DeployComposeHostBridgeTests pins that.
#
# No `:` on the mode or the owner. There is no grant here that a later `systemd-tmpfiles --create`
# could revoke, and a directory Docker created first (the mount carries create_host_path: true so
# that api never fails to start over it, owned by root) is adjusted to this.
d /run/jobbliggaren/observations 0755 jbl-observe jbl-observe -
