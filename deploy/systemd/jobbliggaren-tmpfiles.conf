# Installed to /etc/tmpfiles.d/jobbliggaren.conf — #198, ADR 0050 gate B-1.
#
# Creates the secrets staging directory at every boot so that:
#   1. the compose bind mount never auto-creates a root-owned directory of its own — and it
#      WOULD: the mount carries `create_host_path: true` (measured in `compose config`), so
#      without this file Docker silently makes the path itself, root-owned, and the container
#      cannot traverse it, and
#   2. the post-reboot state is an EMPTY directory rather than a missing path — api and worker
#      then fail options validation loudly and crash-loop until the operator injects, which is
#      the designed failure direction (fail-closed, never a fallback key).
#
# /run is tmpfs (measured 2026-08-09: 813 MB, nosuid,nodev,noexec), so everything under it
# dies at reboot by construction. That is the feature: with no TPM on this host there is no
# encrypted-at-rest copy anywhere, and the key exists only in RAM and in Klas's password
# manager.
#
# THE `:` PREFIX IS LOAD-BEARING, and its absence was a defect. A bare `d` line ADJUSTS mode and
# ownership on an already-existing directory, not only on creation (tmpfiles.d(5)). The injection
# script sets the directory to 0710 root:<container-gid> so the container's group can traverse
# it; without `:` here, the next `systemd-tmpfiles --create` — a systemd upgrade under
# unattended-upgrades, or an operator re-running the install step — would silently revoke that
# back to 0700 root:root. The files would still be there, api and worker would crash-loop on the
# next restart, and a files-only check would report everything healthy. `:` means "apply only
# when creating", so boot gives the correct closed posture and nothing later takes the script's
# grant away.
#
# The container's numeric gid is MEASURED from the image by jobbliggaren-inject-secrets.sh and
# is deliberately not written here: it is a base-image detail, and tmpfiles.d cannot run that
# measurement. Until injection the directory is simply unreadable by anyone but root, which is
# the correct state for a box that holds no key yet.
# THE SECOND DIRECTORY IS NOT A VARIANT OF THE FIRST, AND THE SEPARATION IS THE CONTROL (#197,
# senior-cto-advisor bind 2026-08-09 D4). `secrets/` is bind-mounted read-only into api and
# worker; `host-secrets/` is mounted NOWHERE and holds what only a host-side root process may
# read — today the backup upload credential. Putting that credential in `secrets/` would have
# worked, because the files there are 0400 owned by the container uid and a root-owned 0400 file
# is unreadable through the 0710 mount — but then an application compromise is kept out by a
# mode bit on one file, and a future widening of the mount silently hands the backups to whoever
# owns the API. A directory that is not mounted cannot be exposed by any edit to a mount. Least
# privilege by structure rather than by attribute; the same argument that made migrate-rewrap a
# separate compose service rather than a mount on migrate.
#
# 0700 root:root and no `:` on the mode is deliberate here, unlike the `secrets` line above it:
# nothing needs to traverse this directory except root, so there is no grant for a later
# `systemd-tmpfiles --create` to revoke.
#
# THE THIRD DIRECTORY HOLDS WHAT api ALONE MAY READ (#1981 PR 2): today the delivery read key,
# which reads every recipient's address at the provider. It is bind-mounted into api and no other
# service, so the worker, which egresses, never holds it. The `:` prefixes are there for the reason
# the `secrets` line gives: placing the key, the injection grants 0710 root:<container-gid>. api's
# mount carries `create_host_path: false`, so this line is what makes a boot leave the source
# present and empty; jobbliggaren-reconcile.sh creates it as well, for a box whose installed copy of
# this file predates the line.
#
# THE FOURTH HOLDS WHAT THE worker ALONE MAY READ (#1981 PR 4): today the DMARC mailbox password,
# the login to the mailbox the worker's DMARC ingestion reads and api never does. It is
# bind-mounted into the worker and no other service. The `:` prefixes are there for the same
# reason: placing the password, the injection grants 0710 root:<gid>, with the gid measured from
# the WORKER image. The worker's mount carries `create_host_path: false` as well, and
# jobbliggaren-reconcile.sh creates this directory too.
d /run/jobbliggaren              0755 root root -
d /run/jobbliggaren/secrets      :0700 :root :root -
d /run/jobbliggaren/host-secrets 0700 root root -
d /run/jobbliggaren/api-secrets  :0700 :root :root -
d /run/jobbliggaren/worker-secrets :0700 :root :root -
