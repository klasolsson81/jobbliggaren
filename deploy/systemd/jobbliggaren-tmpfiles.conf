# Installed to /etc/tmpfiles.d/jobbliggaren.conf — #198, ADR 0050 gate B-1.
#
# Creates the secrets staging directory at every boot so that:
#   1. the compose bind mount never auto-creates a root-owned directory of its own, and
#   2. the post-reboot state is an EMPTY directory rather than a missing path — api and
#      worker then fail options validation loudly and crash-loop until the operator
#      injects, which is the designed failure direction (fail-closed, never a fallback key).
#
# /run is tmpfs (measured 2026-08-09: 813 MB, nosuid,nodev,noexec), so everything under it
# dies at reboot by construction. That is the feature: with no TPM on this host there is no
# encrypted-at-rest copy anywhere, and the key exists only in RAM and in Klas's password
# manager.
#
# Mode 0710 on the secrets directory: the owner (root) manages it, the group may traverse
# into it but may NOT list it. The group is the container runtime user, whose numeric id is
# MEASURED from the image by jobbliggaren-inject-secrets.sh — never hardcoded here, because
# it is a base-image detail and coupling the host to it fails at cutover.
# tmpfiles.d cannot run that measurement, so the directory is created root-owned and the
# injection script chowns it. Until then it is simply unreadable, which is correct.
d /run/jobbliggaren        0755 root root -
d /run/jobbliggaren/secrets 0700 root root -
