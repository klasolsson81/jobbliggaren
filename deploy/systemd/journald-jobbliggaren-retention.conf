# /etc/systemd/journald.conf.d/60-jobbliggaren-retention.conf — gate M-7 (#1201).
#
# WHAT THIS PINS, AND WHAT journald CAN AND CANNOT DO. journald has NO minimum-retention
# directive. Every limit it offers is a deletion trigger, and whichever binds first wins — so a
# journal window is always a CEILING, engineered from the size cap against the observed write
# rate, and never a floor that can be declared.
#
# An earlier revision of this file set `MaxRetentionSec=30day` and called it "a floor on TIME".
# That was wrong in the most expensive direction: `MaxRetentionSec=` deletes entries OLDER than
# the span, defaults to 0 (no time-based deletion at all), and adding it therefore SHORTENED the
# evidence window in a file whose stated purpose is to secure one. It is gone. Retention of the
# personal data the journal carries (sshd source addresses) is a real and separate question — it
# is escalated to Klas rather than decided in a config comment, alongside auditd's own log, which
# today is bounded by size and by nothing else.
#
# THE WINDOW IS NOT PUBLISHED AS A NUMBER ANYWHERE. A live measured number in a tracked file
# decays within a commit or two. docs/runbooks/host-detection.md publishes the COMMAND that
# regenerates it, and the verification row carries the measured value with its date.
#
# WHAT THIS BUYS AND WHAT IT DOES NOT: an evidence window against the mistake and lower-privilege
# classes. Root can `journalctl --vacuum-time=1s`, so it is not a control against the attacker
# ADR 0123 names. The window that would survive that attacker is an off-box copy — #1175.
#
# THE `60-` PREFIX IS DELIBERATE. Drop-ins sort by filename across ALL directories, and systemd
# reserves 10–40 for vendor files under /usr; 60–90 is the documented range for /etc. A `10-`
# name could be silently overridden by a distribution drop-in with a higher number.

[Journal]
Storage=persistent
# Both are raised well above the defaults (10% of the filesystem capped at 4G for SystemMaxUse,
# 15% for SystemKeepFree). On this box that is what widens the window rather than narrowing it;
# re-measure with the command in host-detection.md §7 if the disk or the write rate changes.
SystemMaxUse=4G
SystemKeepFree=2G
