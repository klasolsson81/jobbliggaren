# /etc/systemd/journald.conf.d/10-jobbliggaren-retention.conf — gate M-7 (#1201).
#
# WHY AN EXPLICIT FLOOR WHEN THE DEFAULT ALREADY HOLDS. Measured 2026-08-10: the journal is
# persistent, and at the current write rate the window is comfortably wide. But the default is a
# PROPERTY OF THE DISTRIBUTION, not a commitment of ours, and Art. 5(2) asks for a capability
# that is demonstrable. An evidence window that exists by accident cannot be demonstrated; one
# that is pinned can. Adding auditd (the same PR) also raises the write rate, so the accident
# was about to change without anyone deciding.
#
# THE NUMBER IS NOT PUBLISHED IN PROSE ANYWHERE — a live measured number in a tracked file decays
# within a commit or two. docs/runbooks/host-detection.md publishes the COMMAND that regenerates
# the window, and the verification row carries the measured value WITH ITS DATE.
#
# WHAT THIS BUYS AND WHAT IT DOES NOT. It is an evidence window against the mistake and
# lower-privilege classes. Root can still `journalctl --vacuum-time=1s`, so this is not a control
# against the attacker ADR 0123 names. The window that would survive that attacker is an off-box
# copy, and that belongs to #1175 — named, not silently implied.

[Journal]
Storage=persistent
SystemMaxUse=2G
# Never let the journal be the reason the box runs out of disk: keep this much free regardless
# of the cap above. The heartbeat's P5 predicate watches the same filesystem from the other side.
SystemKeepFree=2G
# A floor on how far back the journal must reach before size-based rotation may discard anything.
# systemd honours whichever of the two limits binds first, so this is a floor on TIME while
# SystemMaxUse is a ceiling on SPACE.
MaxRetentionSec=30day
# Forwarding to syslog costs work and reaches nothing: rsyslog is not installed on this box
# (measured 2026-08-10), so the default `yes` was writing into a socket with no reader.
ForwardToSyslog=no
