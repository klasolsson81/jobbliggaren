# Compose Specification v5 — ingen top-level `version:`-nyckel (obsolete sedan 2024).
#
# Profiles:
#   (default)  — postgres-dev, redis-dev, seq
#   test       — postgres-test, redis-test
#   full       — allt ovan (default-services + test-services)
#
# Starta:
#   docker compose up -d                         # dev
#   docker compose --profile test up -d          # lägg till test
#   docker compose --profile full up -d          # alla services
#
# Förkrav: .env-fil i repo-roten med POSTGRES_PASSWORD_DEV + POSTGRES_PASSWORD_TEST.
# Se .env.example för mall.

name: jobbliggaren

services:

  # ==============================================================
  # DEFAULT (dev) — alltid aktiv
  # ==============================================================

  postgres-dev:
    image: postgres:18.3
    container_name: jobbliggaren-postgres-dev
    environment:
      POSTGRES_DB: jobbliggaren
      POSTGRES_USER: jobbliggaren
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_DEV:?POSTGRES_PASSWORD_DEV måste sättas i .env}
    ports:
      # Loopback-bunden. Se not vid `seq` nedan för varför bind-adressen är
      # lastbärande och inte kosmetisk (#1198).
      - "127.0.0.1:5435:5432"
    volumes:
      # Postgres 18+: mount /var/lib/postgresql (inte .../data) så att
      # version-specifika subkataloger skapas — krävs för pg_upgrade --link.
      - jobbliggaren_postgres_dev_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobbliggaren -d jobbliggaren"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis-dev:
    image: redis:8.6-alpine
    container_name: jobbliggaren-redis-dev
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - jobbliggaren_redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  seq:
    image: datalust/seq:latest
    container_name: jobbliggaren-seq
    environment:
      ACCEPT_EULA: "Y"
      # Seq 2025.2+ kräver explicit firstRun-konfig. För localhost-dev stänger vi av
      # auth helt: Seq är loopback-bunden (raden nedan) och innehåller bara dev-loggar.
      #
      # DEN HÄR KOMMENTAREN BAR TRE FALSKA PÅSTÅENDEN TILL #1198, och alla tre är
      # utskrivna här därför att nästa läsare annars gör samma slutledning:
      #
      #   1. "Seq är bunden till loopback" — den var det INTE. Den band `0.0.0.0` och
      #      motiverade avstängd auth med en bindning som inte fanns. Mätt 2026-08-04
      #      från värdens Ethernet-adress: `HTTP 200` mot ett oautentiserat Seq-API.
      #      Sant först i och med den här ändringen.
      #   2. "Produktion kör aldrig Seq" — falskt. CLAUDE.md §11 beskriver
      #      Seq-providern som levande wiring (`AddJobbliggarenLogging`, gated på
      #      `Seq:ServerUrl`), och #1175 äger den obyggda prod-loggsänkan.
      #   3. "(CloudWatch istället)" — falskt. AWS är rivet (ADR 0066).
      #
      # LÄS ALDRIG EN BIND-ADRESS UR DEN HÄR FILEN. `docs/runbooks/vps-base-hardening.md`
      # §12 registrerar att en publicerad containerport passerar värdens `forward`-kedja
      # i stället för `input` — bind-adressen är alltså lastbärande, och grinden i ADR
      # 0050 `Amendment 2026-08-04` §5 punkt 6 kräver bevis **utifrån** med `curl`, aldrig
      # genom att läsa den här filen. Precis den här kommentaren är skälet: den påstod
      # motsatsen i månader och ingen fångade det genom att läsa.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "127.0.0.1:5341:80"      # Seq UI + API (unified http-port)
      - "127.0.0.1:5342:5341"    # Seq ingestion-port (separat listener enligt Seq-startlog)
    volumes:
      - jobbliggaren_seq_data:/data
    restart: unless-stopped

  # ==============================================================
  # PROFILE test — aktiveras med `--profile test` eller `--profile full`
  # ==============================================================

  postgres-test:
    image: postgres:18.3
    container_name: jobbliggaren-postgres-test
    profiles: ["test", "full"]
    environment:
      POSTGRES_DB: jobbliggaren_test
      POSTGRES_USER: jobbliggaren
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_TEST:?POSTGRES_PASSWORD_TEST måste sättas i .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - jobbliggaren_postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobbliggaren -d jobbliggaren_test"]
      interval: 3s
      timeout: 2s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  redis-test:
    image: redis:8.6-alpine
    container_name: jobbliggaren-redis-test
    profiles: ["test", "full"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - jobbliggaren_redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 15
      start_period: 5s
    restart: unless-stopped

volumes:
  jobbliggaren_postgres_dev_data:
  jobbliggaren_redis_dev_data:
  jobbliggaren_seq_data:
  jobbliggaren_postgres_test_data:
  jobbliggaren_redis_test_data:
