# Compose Specification v5 — ingen top-level `version:`-nyckel (obsolete sedan 2024).
#
# Profiles:
#   (default)  — postgres-dev, redis-dev, seq
#   test       — postgres-test, redis-test
#   full       — allt ovan (default-services + test-services)
#
# Starta:
#   docker compose up -d                         # dev
#   docker compose --profile test up -d          # lägg till test
#   docker compose --profile full up -d          # alla services
#
# Förkrav: .env-fil i repo-roten med POSTGRES_PASSWORD_DEV, POSTGRES_PASSWORD_TEST
# + SEQ_ADMIN_PASSWORD_DEV. Alla tre är hårda `:?`-krav — compose vägrar starta utan dem.
# Se .env.example för mall.

name: jobbliggaren

services:

  # ==============================================================
  # DEFAULT (dev) — alltid aktiv
  # ==============================================================

  postgres-dev:
    # BUMPAS DU DEN HÄR TAGGEN — kör kollationskontrollen mot dev-DB:n efteråt.
    # `public.swedish` är en ICU-kollation (migration 20260714170816) och ICU-versionen
    # kommer ur den här imagen. Driver den, sorteras btree-index på text efter en ordning
    # som inte längre gäller: Postgres kraschar inte, frågorna blir tyst fel. Steg-1-frågan
    # (`pg_collation_actual_version`) och reparationen står i
    # `docs/runbooks/release-checklist.md` §2 — den grinden läser den TAGGADE miljön, så
    # den fångar inte den här databasen, som är den enda med riktiga data.
    # Dependabot bevakar taggen (`docker-compose`-posten i .github/dependabot.yml) men
    # sådana PR:er auto-mergas ALDRIG. Det generella skälet gäller varje image-bump —
    # ingenting läser den image som ändras — och den tysta felmoden ovan kommer utöver det.
    # Löser någon ICU-frågan får alltså auto-merge INTE återinföras på den grunden ensam.
    image: postgres:18.4
    container_name: jobbliggaren-postgres-dev
    environment:
      POSTGRES_DB: jobbliggaren
      POSTGRES_USER: jobbliggaren
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_DEV:?POSTGRES_PASSWORD_DEV måste sättas i .env}
    ports:
      # Loopback-bunden. Se not vid `seq` nedan för varför bind-adressen är
      # lastbärande och inte kosmetisk (#1198).
      - "127.0.0.1:5435:5432"
    volumes:
      # Postgres 18+: mount /var/lib/postgresql (inte .../data) så att
      # version-specifika subkataloger skapas — krävs för pg_upgrade --link.
      - jobbliggaren_postgres_dev_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobbliggaren -d jobbliggaren"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  redis-dev:
    image: redis:8.10-alpine
    container_name: jobbliggaren-redis-dev
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - jobbliggaren_redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  seq:
    image: datalust/seq:latest
    container_name: jobbliggaren-seq
    environment:
      ACCEPT_EULA: "Y"
      # AUTH ÄR PÅ, och det är en ändring (Klas-beslut 2026-08-04, #1198). Fram till dess
      # körde dev-Seq `SEQ_FIRSTRUN_NOAUTHENTICATION: "true"` med motiveringen "Seq är
      # loopback-bunden och innehåller bara dev-loggar". **Båda leden var fel.**
      #
      # Bindningen var `0.0.0.0` (mätt 2026-08-04: `HTTP 200` mot ett oautentiserat
      # Seq-API från värdens Ethernet-adress). Och innehållet var inte "bara dev-loggar":
      # `ConsoleEmailSender` skrev då hela `PlainTextBody` för vilken mottagare som helst,
      # så sinken bar 41 aktiverings- och bekräftelselänkar i klartext plus en verklig
      # e-postadress (sedan #1208 skrivs kroppen bara för en RFC 2606/6761-reserverad
      # mottagare). Bindningen lagades
      # i samma PR — men då hade den varit **enda** kontrollen över det materialet, och
      # det var precis den kontroll som varit fel i månader medan den här kommentaren
      # gick i god för den. Därför en andra kontroll som inte är ett påstående.
      #
      # `SEQ_FIRSTRUN_ADMINPASSWORD` läses bara vid FÖRSTA uppstarten mot en tom volym.
      # Byter du lösenord i `.env` senare gäller det inte förrän volymen återskapas
      # (proceduren står i `docs/runbooks/local-dev-setup.md` §6.4 och bara där — den
      # måste scopas till Seq-volymen, och ett ` -v ` på fel plats river postgres med).
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD_DEV:?SEQ_ADMIN_PASSWORD_DEV måste sättas i .env}
    ports:
      # BIND-ADRESSEN ÄR LASTBÄRANDE, inte kosmetisk: `docs/runbooks/vps-base-hardening.md`
      # §12 registrerar att en publicerad containerport passerar värdens `forward`-kedja i
      # stället för `input`. Läs den aldrig **härifrån som bevis för vad som faktiskt kör** —
      # ADR 0050 `Amendment 2026-08-04` §5:s punkt *"Ingen container publicerar till 0.0.0.0"*
      # kräver `curl` utifrån (citerad på sin text, inte på sitt nummer — §5:s lista har
      # vuxit förut), eftersom just den
      # här filens kommentar påstod motsatsen i månader utan att någon läsare fångade det.
      # (Det förbjuder inte en form-baserad regressionsvakt som kontrollerar att prefixet
      # inte försvinner igen — det är en annan fråga än vad som kör. Den vakten FINNS sedan
      # #1198: `.github/scripts/compose-loopback-guard.sh`, grindad av `ci`-jobbet
      # `scripts (bash fixtures)`. Den bevisar att filen inte ändrats tillbaka, aldrig vad
      # som lyssnar — `curl`-kravet ovan står oförändrat.)
      - "127.0.0.1:5341:80"      # Seq UI + API (unified http-port)
      - "127.0.0.1:5342:5341"    # Seq ingestion-port (separat listener enligt Seq-startlog)
    volumes:
      - jobbliggaren_seq_data:/data
    restart: unless-stopped

  # ==============================================================
  # PROFILE test — aktiveras med `--profile test` eller `--profile full`
  # ==============================================================

  postgres-test:
    image: postgres:18.4
    container_name: jobbliggaren-postgres-test
    profiles: ["test", "full"]
    environment:
      POSTGRES_DB: jobbliggaren_test
      POSTGRES_USER: jobbliggaren
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD_TEST:?POSTGRES_PASSWORD_TEST måste sättas i .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - jobbliggaren_postgres_test_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobbliggaren -d jobbliggaren_test"]
      interval: 3s
      timeout: 2s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  redis-test:
    image: redis:8.10-alpine
    container_name: jobbliggaren-redis-test
    profiles: ["test", "full"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - jobbliggaren_redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 15
      start_period: 5s
    restart: unless-stopped

volumes:
  jobbliggaren_postgres_dev_data:
  jobbliggaren_redis_dev_data:
  jobbliggaren_seq_data:
  jobbliggaren_postgres_test_data:
  jobbliggaren_redis_test_data:
